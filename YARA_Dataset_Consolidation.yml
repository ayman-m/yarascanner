name: YARA Dataset Consolidation
description: |-
  Groups the matched-file rows every host produced under one RULESET into a single
  consolidated dataset, safely handling scans still in progress. Meant to be scheduled twice
  daily as a Job (Queue Handling: "Don't trigger a new job instance" - overlapping runs are
  not needed since the underlying grouping is idempotent and safe to resume, but skipping
  avoids doubling tenant load for no benefit).

  Flow: check readiness (YaraConsolidateStatus, read-only) -> if nothing is eligible but
  something is still running, wait via a bounded poll (GenericPolling) and recheck once
  -> if anything is eligible, run the consolidation step the consolidation_mode input
  selects -> if anything failed, flag it for attention. If nothing is eligible and nothing
  is in progress after the recheck, the run ends cleanly - the next scheduled trigger
  picks up whatever has since finished. No state persists between runs; status and both
  consolidation modes re-derive eligibility from tenant state on each call.

  TWO CONSOLIDATION MODES, chosen by the consolidation_mode input. Both leave the scanner
  untouched, both read the same source - the permanent per-host matches datasets - and
  NEITHER DELETES A SOURCE. They differ in fidelity, not in what they touch.
  * full (default) -> YaraConsolidateApply. Groups every column of every matched-file row,
  across every host scanned with one ruleset, into ONE dataset per ruleset -
  yara_scanner_full_v<VER>_rules_<rulehash>, keyed on the ruleset hash the scanner leaves at
  the end of every scan_id, the only component every host in one Action Center launch
  shares. It also reads the SCANS lifecycle shards, but only to build the terminal map that
  decides which scans have finished: it does not merge them and does not delete them.
  Consolidating the lifecycle shards is a separate concern, and nothing in the pack performs
  one today. It is a DRY RUN unless full_execute is left at its default of true.
  * summary -> YaraConsolidateSummary. Writes ONE ROW PER (host, rule) into
  yara_scanner_summary_v<VER>_rules_<hash>, also one dataset per ruleset - which rules fired
  on which host, four columns, no filenames and no per-rule counts. It is a dry run unless
  summary_execute is left at its default of true.
  Pick per deployment on cost, not on safety. Full detail is roughly 40x the rows of a
  summary, which is why row_ceiling refuses an oversized ruleset group rather than
  half-filling its target, and why a large fleet wants summary mode rather than a raised
  ceiling. Neither choice is one-way, and neither costs you the file-level detail: the
  per-host matches dataset (yara_scanner_matches_v4_<host>_<hex>, no month suffix) is
  PERMANENT under the scanner's overwrite model - the next scan on that host rewrites it
  wholesale - so there is nothing to reclaim by deleting it, and it remains the deep-dive
  source a consolidated row points back to. Re-running reconciles rather than appends, so a
  ruleset consolidated in one mode can simply be consolidated in the other as well.

  NOTE ON VERIFICATION: the condition operators (isExists on the eligible/pending
  scan_id lists, and isEqualString against the consolidation_mode input in task 11) and the
  GenericPolling sub-playbook's `dt` filter are the pieces of this playbook with no local
  precedent in this repo to copy from - they are believed correct from the platform's own
  documented GenericPolling/condition-task schema but have not yet been exercised against a
  live run. Verify all of them on first use. Task 11 is deliberately built to fail SAFE: it
  names both modes as explicit labels and sends anything else - a typo, an empty value, or
  an operator that does not evaluate as expected - to a dead-end title task that writes
  nothing, rather than letting an unrecognised mode fall through to a branch the operator
  did not ask for.

  CAVEAT ON DELETION SAFETY: neither mode deletes a source, so there is no delete here to
  get wrong. The one remove_lookup_data full mode issues targets its OWN consolidated
  dataset, dropping scan_ids the sources no longer hold - and if any source dataset cannot
  be read, that removal is skipped entirely for the pass rather than guessing which rows are
  genuinely stale. Two independent guards keep the per-host matches datasets out of every
  destructive call site: parse_shard excludes them at enumeration time, and
  _is_live_overwrite_dataset re-derives the same answer at the call itself. What genuinely
  deletes in this pack is elsewhere and is never scheduled from here - YaraCleanup removes
  an aged month-suffixed scans shard, and is the only thing that does, though nothing in the
  pack schedules it either; the manual full-tenant wipe removes the lot. The platform has no undelete
  or dataset versioning, so treat those two as one-way. Both automations are themselves dry
  runs unless execute=true, but this playbook passes true in both modes by default, so a
  scheduled run writes - set full_execute or summary_execute to "false" for a preview, and
  use that dry-run output, or YaraConsolidateStatus, to check what a run WOULD write before
  raising row_ceiling or lowering abandoned_after_hours on a live schedule.
