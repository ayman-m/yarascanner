inputs:
- key: consolidation_mode
  value:
    simple: full
  required: false
  description: 'Which consolidation step runs on the eligible scans: "full" (default)
    runs YaraConsolidateApply, which groups every column of every matched-file row,
    across every host scanned with one ruleset, into ONE yara_scanner_full_v<VER>_rules_<rulehash>
    dataset per ruleset. "summary" runs YaraConsolidateSummary, which writes one row
    per (host, rule) into yara_scanner_summary_v<VER>_rules_<hash>. Both read the
    permanent per-host matches datasets and NEITHER deletes them, so the choice is
    one of fidelity and cost - full detail is roughly 40x the rows of a summary -
    not of what survives the pass. Either way the per-host dataset remains the deep-dive
    source, until the next scan on that host overwrites it. Matched exactly - any
    other value, including an empty one, runs NEITHER and ends the pass at a dead-end
    task rather than defaulting to a branch nobody asked for.'
  playbookInputQuery: null
- key: summary_execute
  value:
    simple: "true"
  required: false
  description: Only read in summary mode. YaraConsolidateSummary is a dry run unless
    execute=true, so this is "true" by default - left at "false" the summary branch
    would report what it would write and write nothing, every scheduled run, for ever.
    Set it to "false" deliberately to preview a pass.
  playbookInputQuery: null
- key: full_execute
  value:
    simple: "true"
  required: false
  description: 'Only read in full mode, and the exact counterpart of summary_execute.
    YaraConsolidateApply is now a dry run unless execute=true, so this is "true" by
    default - left at "false" the full branch would report what it would write and
    write nothing, every scheduled run, for ever. Both modes are non-destructive:
    both read the per-host matches datasets and neither removes them, so they stay
    the deep-dive source.'
  playbookInputQuery: null
- key: scan_id
  value: {}
  required: false
  description: Restrict this run to these scan_id(s) (comma-separated). Leave empty
    for all finished scans across the tenant.
  playbookInputQuery: null
- key: poll_interval_minutes
  value:
    simple: "30"
  required: false
  description: Minutes between rechecks while waiting on in-progress scans.
  playbookInputQuery: null
- key: poll_timeout_minutes
  value:
    simple: "240"
  required: false
  description: Total minutes to wait for in-progress scans before giving up on this
    cycle and letting the next scheduled run pick it up. This is THIS RUN's patience
    budget, separate from abandoned_after_hours (24h by default) which governs when
    a scan with no terminal lifecycle row is treated as finished and consolidated
    anyway to preserve its findings.
  playbookInputQuery: null
- key: row_ceiling
  value: {}
  required: false
  description: Override the script's default row ceiling (60,000) above which a RULESET
    GROUP is refused rather than half-written. It is the only size bound on a pass.
    The default sits below the ~70,000 rows at which lookup writes were measured going
    dead, so a tenant whose matches legitimately exceed it wants summary mode - roughly
    40x fewer rows - rather than a ceiling raised past what lookup writes survive.
    Leave empty to use the script default.
  playbookInputQuery: null
- key: retention_hours
  value: {}
  required: false
  description: A scan silent this long is treated as finished even without a terminal
    lifecycle row. Passed to YaraConsolidateStatus, YaraConsolidateApply and YaraConsolidateSummary,
    all of which default to 24 when it is empty. Previously named abandoned_after_hours,
    which described a different concept from the argument it is actually wired to.
  playbookInputQuery: null
outputs:
- contextPath: Yara.ConsolidateStatus.eligible_count
  description: Number of scans found eligible on the last status check.
  type: Number
- contextPath: Yara.ConsolidateApply.written
  description: 'Full mode only: one line per consolidated dataset written, or in a
    dry run that would be written.'
  type: String
- contextPath: Yara.ConsolidateApply.rows_written
  description: 'Full mode only: total full-detail rows written across all ruleset
    groups.'
  type: Number
- contextPath: Yara.ConsolidateApply.groups
  description: 'Full mode only: how many ruleset groups were produced.'
  type: Number
- contextPath: Yara.ConsolidateApply.failed
  description: 'Full mode only: ruleset groups that failed or exceeded row_ceiling.
    No source data is deleted in any of those cases, so re-running is safe.'
  type: String
- contextPath: Yara.ConsolidateApply.dry_run
  description: 'Full mode only: true when the branch ran as a preview, i.e. full_execute
    was not left at its default of true.'
  type: Boolean
- contextPath: Yara.ConsolidateSummary.written
  description: 'Summary mode only: summary targets written, with row count, host count
    and why the scan was eligible.'
  type: Unknown
- contextPath: Yara.ConsolidateSummary.failed
  description: 'Summary mode only: scans that could not be summarised. Host shards
    are untouched in every case, so re-running is safe.'
  type: Unknown
- contextPath: Yara.ConsolidateSummary.shards_deleted
  description: 'Summary mode only: always 0. Present so a run can prove that the summary
    branch deleted nothing.'
  type: Number
- contextPath: Yara.ConsolidateSummary.dry_run
  description: 'Summary mode only: true when the branch ran as a preview, i.e. summary_execute
    was not left at its default of true.'
  type: Boolean
adopted: true
possibleresponses: []
