inputs:
- key: script_name
  value:
    simple: xdr_yara_scanner
  required: true
  description: 'Exact name of the scanner script in the Action Center library. IMPORTANT: core-script-run

    rejects any parameter set that does not exactly match the script''s defined inputs, so this

    script MUST be uploaded with exactly these 5 string inputs, in order:

    yarafile, scan_folder, alert_severity, mode, options. The older 3-input build will be rejected.'
  playbookInputQuery: null
- key: yarafile
  value:
    simple: ''
  required: false
  description: Base64-encoded YARA rules. Leave empty and the playbook looks for an uploaded .yar via File.EntryID
    and encodes it. If neither is present the playbook stops - it never falls back to a built-in ruleset.
  playbookInputQuery: null
- key: scan_folder
  value:
    simple: default
  required: false
  description: Target folder to scan, or "default" for the platform default scope.
  playbookInputQuery: null
- key: alert_severity
  value:
    simple: low
  required: false
  description: low | medium | high.
  playbookInputQuery: null
- key: mode
  value:
    simple: scan
  required: false
  description: scan | cancel (deliver a cancel to a running scan on the targets).
  playbookInputQuery: null
- key: options
  value:
    simple: ''
  required: false
  description: Compact runtime options, e.g. create_alerts=false,throttle_mode=os,collect_files=true.
  playbookInputQuery: null
- key: endpoint_hostnames
  value:
    simple: ''
  required: false
  description: Comma-separated hostnames to scan. Combine with endpoint_groups, or use instead of it. Ignored when
    endpoint_groups is `all`.
  playbookInputQuery: null
- key: endpoint_groups
  value:
    simple: all
  required: false
  description: 'Comma-separated endpoint group names to scan. The literal `all` scans every CONNECTED endpoint on
    the tenant - that is the default, and it is deliberate: it must be typed, never arrived at by leaving a box empty.
    Leaving this AND endpoint_hostnames blank stops the playbook.'
  playbookInputQuery: null
- key: timeout
  value:
    simple: '3600'
  required: false
  description: Per-endpoint script execution timeout in seconds, enforced on the endpoint. The playbook does NOT wait
    this long - the dispatch task returns as soon as the wave is away. Verify the wave separately with YaraScanVerify.
  playbookInputQuery: null
outputs:
- contextPath: Core.ScriptResult.action_id
  description: ID of the Action Center action initiated.
  type: Number
- contextPath: Core.ScriptResult.results.standard_output
  description: STDOUT/STDERR from the scanner (the SCAN_RESULT summary line). POPULATED ONLY IF THE DISPATCH TASK
    WAITS. This playbook returns as soon as the wave is away, so expect this to be empty - the scan is still running
    on the endpoint at that point. Read the scanner's own lifecycle and match rows instead, or re-enable polling on
    task 5 if a caller genuinely needs to block until every endpoint finishes.
  type: String
- contextPath: Core.ScriptResult.results.execution_status
  description: Per-endpoint execution status. Same caveat as standard_output - not available on a dispatch-and-return.
    Use YaraScanVerify to confirm the wave started.
  type: String
fromversion: 6.5.0
tests:
- No tests (auto-formatted)
