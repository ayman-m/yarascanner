    taskid: 4b1c0a10-0000-0000-0000-000000000007
    type: condition
    task:
      id: 4b1c0a10-0000-0000-0000-000000000007
      version: -1
      name: Scan all, or a named scope?
      type: condition
      iscommand: false
      brand: ''
      description: '`all` needs confirming before it reaches the fleet. A named group does not - the operator already
        said what they meant.'
    separatecontext: false
    continueonerrortype: ''
    conditions:
