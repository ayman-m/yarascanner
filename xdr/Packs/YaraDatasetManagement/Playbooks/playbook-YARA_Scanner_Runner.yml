      version: -1
      name: Get ALL connected endpoints
      description: The `all` branch. No hostname or group filter - only status, so every connected endpoint on the
        tenant is a target. Reached only when an operator typed `all`, never by leaving an input blank.
      script: Cortex Core - IR|||core-get-endpoints
      type: regular
      iscommand: true
      brand: Cortex Core - IR
    scriptarguments:
      status:
        simple: connected
    nexttasks:
      '#none#':
      - '4'
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 1100, "y": 1790}}'
  '9':
    id: '9'
    taskid: 4b1c0a10-0000-0000-0000-000000000009
    type: condition
    task:
      id: 4b1c0a10-0000-0000-0000-000000000009
      version: -1
      name: Any endpoints resolved?
      type: condition
      iscommand: false
      brand: ''
      description: A misspelled group, or a group whose members are all disconnected, resolves to nothing. Without
        this the playbook dispatches to an empty target list and completes green having scanned no host.
    separatecontext: false
    continueonerrortype: ''
    conditions:
    - label: found
      condition:
      - - operator: isExists
          left:
            value:
              simple: endpoint_id
            iscontext: true
    nexttasks:
      found:
      - '5'
      '#default#':
      - '11'
    view: '{"position": {"x": 450, "y": 2080}}'
  '10':
    id: '10'
    taskid: 4b1c0a10-0000-0000-0000-000000000010
    type: title
    task:
