inputs:
- key: consolidation_mode
  value:
    simple: summary
  required: false
  description: 'Which consolidation step runs on the eligible scans: "full" runs YaraConsolidateApply, which groups
    every column of every matched-file row, across every host scanned with one ruleset, into ONE yara_scanner_full_v<VER>_rules_<rulehash>
    dataset per ruleset. "summary" (default) runs YaraConsolidateSummary, which writes one row per (host, rule) into
    yara_scanner_summary_v<VER>_rules_<hash>. Both read the permanent per-host matches datasets and NEITHER deletes
    them, so the choice is one of fidelity and cost - full detail is roughly 40x the rows of a summary - not of
    what survives the pass. Either way the per-host dataset remains the deep-dive source, until the next scan on
    that host overwrites it. Matched exactly - any other value, including an empty one, runs NEITHER and ends the
    pass at a dead-end task rather than defaulting to a branch nobody asked for.'
  playbookInputQuery: null
- key: summary_execute
  value:
    simple: 'true'
  required: false
  description: Only read in summary mode. YaraConsolidateSummary is a dry run unless execute=true, so this is "true"
    by default - left at "false" the summary branch would report what it would write and write nothing, every scheduled
    run, for ever. Set it to "false" deliberately to preview a pass.
  playbookInputQuery: null
- key: full_execute
  value:
    simple: 'false'
  required: false
  description: 'Only read in full mode, and the exact counterpart of summary_execute. Defaults to "false" - the
    opposite of summary_execute - because this pack currently runs summary-only: the full path is reachable by
    setting consolidation_mode="full", and this stays "false" until you deliberately opt into it, so a stray mode
    change alone can''t start writing the ~40x-larger full dataset. YaraConsolidateApply is itself a dry run unless
    execute=true regardless of this default. Both modes are non-destructive: both read the per-host matches datasets
    and neither removes them, so they stay the deep-dive source.'
  playbookInputQuery: null
- key: scan_id
  value:
    simple: ''
  required: false
  description: Restrict this run to these scan_id(s) (comma-separated). Leave empty for all finished scans across
    the tenant.
  playbookInputQuery: null
- key: poll_interval_minutes
  value:
    simple: '30'
  required: false
  description: Minutes between rechecks while waiting on in-progress scans.
  playbookInputQuery: null
- key: poll_timeout_minutes
  value:
    simple: '240'
  required: false
  description: Total minutes to wait for in-progress scans before giving up on this cycle and letting the next scheduled
    run pick it up. This is THIS RUN's patience budget, separate from abandoned_after_hours (24h by default) which
    governs when a scan with no terminal lifecycle row is treated as finished and consolidated anyway to preserve
    its findings.
  playbookInputQuery: null
- key: row_ceiling
  value:
    simple: ''
  required: false
  description: Override the script's default row ceiling (60,000) above which a RULESET GROUP is refused rather
    than half-written. It is the only size bound on a pass. The default sits below the ~70,000 rows at which lookup
    writes were measured going dead, so a tenant whose matches legitimately exceed it wants summary mode - roughly
    40x fewer rows - rather than a ceiling raised past what lookup writes survive. Leave empty to use the script
    default.
  playbookInputQuery: null
- key: retention_hours
  value:
    simple: ''
  required: false
  description: A scan silent this long is treated as finished even without a terminal lifecycle row. Passed to YaraConsolidateStatus,
    YaraConsolidateApply and YaraConsolidateSummary, all of which default to 24 when it is empty. Previously named
    abandoned_after_hours, which described a different concept from the argument it is actually wired to.
  playbookInputQuery: null
outputs:
- contextPath: Yara.ConsolidateStatus.eligible_count
  description: Number of scans found eligible on the last status check.
  type: Number
- contextPath: Yara.ConsolidateApply.status
  description: 'Full mode only: one of success, partial_failure, dry_run or skipped_locked. The single field to
    branch on - it saves testing the three lists and lock_held_by_other_run separately. partial_failure is reported
    on a DRY RUN too, because a row_ceiling refusal is a real refusal whichever mode found it and dry run is the
    automation''s default mode; dry_run, the boolean below, is what says which mode ran.'
  type: String
- contextPath: Yara.ConsolidateApply.written
  description: 'Full mode only: one OBJECT per per-ruleset full target written, or in a dry run that WOULD be written,
    keyed action / ruleset / target / rows / hosts / scans / scans_new / stale_rows_removed. action is "wrote" or
    "would_write", so a task never has to read a verb out of a sentence to learn whether rows landed. Objects rather
    than sentences, so a task can filter on a field instead of matching prose.'
  type: Unknown
- contextPath: Yara.ConsolidateApply.rows_written
  description: 'Full mode only: total full-detail rows written across all ruleset groups.'
  type: Number
- contextPath: Yara.ConsolidateApply.groups
  description: 'Full mode only: how many ruleset groups were produced.'
  type: Number
- contextPath: Yara.ConsolidateApply.skipped
  description: 'Full mode only: one OBJECT per thing left alone, keyed name / reason / detail / scan_id / hostname
    / dataset / ruleset. reason is a closed set - scan_in_progress, quiet_period, no_rule_hash, source_unreadable,
    stale_removal_disabled_bounded, stale_removal_disabled_unreadable, target_already_current - so it is safe to
    match on. Nothing in this list was touched.'
  type: Unknown
- contextPath: Yara.ConsolidateApply.failed
  description: 'Full mode only: one OBJECT per ruleset group that did not complete, keyed reason / detail / ruleset
    / target / rows / row_ceiling / rows_added_before_failure / sources_untouched. reason is a closed set - row_ceiling_exceeded
    (an operator decision: nothing was attempted and a re-run changes nothing until the ceiling is raised or the
    fleet is summarised), target_unreadable, write_incomplete, write_error (those three are retryable). Task 7 tests
    this list with isNotEmpty and task 8 copies it whole, so both read objects. No source data is deleted in any
    of these cases, and every record asserts sources_untouched, so re-running is safe.'
  type: Unknown
- contextPath: Yara.ConsolidateApply.dry_run
  description: 'Full mode only: true when the branch ran as a preview, i.e. full_execute was not left at its default
    of true.'
  type: Boolean
- contextPath: Yara.ConsolidateSummary.status
  description: 'Summary mode only: one of success, partial_failure or dry_run. The single field to branch on - it
    saves testing three lists to learn what happened.'
  type: String
- contextPath: Yara.ConsolidateSummary.written
  description: 'Summary mode only: one OBJECT per summary target written, keyed action / ruleset / target / rows
    / hosts / scans / scans_refreshed / stale_rows_removed / estimated_kb / eligibility. Objects rather than sentences,
    so a task can filter on a field instead of matching prose.'
  type: Unknown
- contextPath: Yara.ConsolidateSummary.skipped
  description: 'Summary mode only: one OBJECT per thing left alone, keyed name / reason / detail / scan_id / hostname
    / dataset / ruleset. reason is a closed set - scan_in_progress, quiet_period, no_rule_hash, source_unreadable,
    stale_removal_disabled, nothing_observed - so it is safe to match on. Nothing in this list was touched.'
  type: Unknown
- contextPath: Yara.ConsolidateSummary.failed
  description: 'Summary mode only: one OBJECT per ruleset that could not be written, keyed reason / detail / ruleset
    / target / sources_untouched. Host shards are untouched in every case, so re-running is safe.'
  type: Unknown
- contextPath: Yara.ConsolidateSummary.warnings
  description: 'Summary mode only: caveats the run has about its own numbers - a read that hit the row cap, a fleet-wide
    query that fell back to one query per shard. Empty on a clean pass.'
  type: Unknown
- contextPath: Yara.ConsolidateSummary.rows_written
  description: 'Summary mode only: total (host, rule) rows across every target written, or in a preview that would
    be written.'
  type: Number
- contextPath: Yara.ConsolidateSummary.collapse_ratio
  description: 'Summary mode only: findings_collapsed / summary_rows_observed - how many file-level findings one
    summary row stands for. The number that says what summary mode is buying.'
  type: Number
- contextPath: Yara.ConsolidateSummary.stale_removal_enabled
  description: 'Summary mode only: whether the pass was allowed to remove superseded rows from its own targets.
    False after a bounded pass or an unreadable source, which needs a later unbounded pass to reconcile.'
  type: Boolean
- contextPath: Yara.ConsolidateSummary.shards_deleted
  description: 'Summary mode only: always 0. Present so a run can prove that the summary branch deleted nothing.'
  type: Number
- contextPath: Yara.ConsolidateSummary.dry_run
  description: 'Summary mode only: true when the branch ran as a preview, i.e. summary_execute was not left at its
    default of true.'
  type: Boolean
