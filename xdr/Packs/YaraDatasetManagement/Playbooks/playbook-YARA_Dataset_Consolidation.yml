id: YARA_Dataset_Consolidation
version: -1
name: YARA Dataset Consolidation
description: 'Merges each finished YARA scan''s per-host lookup dataset shards into one dataset per

  scan, safely handling scans still in progress. Meant to be scheduled twice daily as a

  Job (Queue Handling: "Don''t trigger a new job instance" - overlapping runs are not

  needed since the underlying merge is idempotent and safe to resume, but skipping

  avoids doubling tenant load for no benefit).


  Flow: check readiness (YaraConsolidateStatus, read-only) -> if nothing is eligible but

  something is still running, wait via a bounded poll (GenericPolling) and recheck once

  -> if anything is eligible, run the consolidation step the consolidation_mode input

  selects -> if anything failed, flag it for attention. If nothing is eligible and nothing

  is in progress after the recheck, the run ends cleanly - the next scheduled trigger

  picks up whatever has since finished. No state persists between runs; status and both

  consolidation modes re-derive eligibility from tenant state on each call.


  TWO CONSOLIDATION MODES, chosen by the consolidation_mode input. Both read the same

  per-host matches dataset and both leave the scanner untouched; they differ only in what

  they copy out, and in whether the source survives.

  * full (default, the pre-existing behaviour) -> YaraConsolidateApply. Copies EVERY

  matched-file row into yara_scanner_matches_v<VER>_scan_<slug>, then DELETES the per-host

  source shard once the target''s row count has verified. Use it when the per-scan target

  has to answer file-level questions on its own.

  * summary -> YaraConsolidateSummary. Writes ONE ROW PER (host, rule) into

  yara_scanner_summary_v<VER>_scan_<slug> - which rules fired on which host, four columns,

  no filenames and no per-rule counts - and DELETES NOTHING AT ALL. The per-host dataset

  stays put as the deep-dive source a summary row points back to. It is a dry run unless

  summary_execute is left at its default of true.

  The two are not interchangeable after the fact: full mode removes the per-host shard that

  summary mode leaves as the only place per-file detail still lives (until the next scan on

  that host rewrites it). Pick per deployment, not per run.


  NOTE ON VERIFICATION: the condition operators (isExists on the eligible/pending

  scan_id lists, and isEqualString against the consolidation_mode input in task 11) and the

  GenericPolling sub-playbook''s `dt` filter are the pieces of this playbook with no local

  precedent in this repo to copy from - they are believed correct from the platform''s own

  documented GenericPolling/condition-task schema but have not yet been exercised against a

  live run. Verify all of them on first use. Task 11 is deliberately built to fail SAFE: it

  names both modes as explicit labels and sends anything else - a typo, an empty value, or

  an operator that does not evaluate as expected - to a dead-end title task that merges and

  deletes nothing, rather than letting an unrecognised mode fall through to the branch that

  deletes shards.


  CAVEAT ON DELETION SAFETY: before deleting a per-host shard, the merge verifies the

  per-scan target''s row count equals the shard''s row count - that is row-count parity,

  not a content comparison, so a corrupted write with a matching count would still pass.

  The platform has no undelete or dataset versioning, so a bad delete cannot be recovered

  after the fact. Treat this playbook''s deletions as one-way; use YaraConsolidateStatus''

  dry-run output to check what a run WOULD do before raising row_ceiling or lowering

  abandoned_after_hours on a live schedule.'
