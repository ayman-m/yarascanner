inputs:
- key: consolidation_mode
  value:
    simple: full
  required: false
  description: 'Which consolidation step runs on the eligible scans: "full" (default) merges every matched-file row with YaraConsolidateApply and then DELETES the verified per-host source shard; "summary" writes one row per (host, rule) with YaraConsolidateSummary and deletes nothing, leaving the per-host dataset as the deep-dive source. Matched exactly - any other value, including an empty one, runs NEITHER and ends the pass at a dead-end task rather than defaulting to the branch that deletes data.'
  playbookInputQuery: null
- key: summary_execute
  value:
    simple: 'true'
  required: false
  description: 'Only read in summary mode. YaraConsolidateSummary is a dry run unless execute=true, so this is "true" by default - left at "false" the summary branch would report what it would write and write nothing, every scheduled run, for ever. Set it to "false" deliberately to preview a pass. The full-detail branch has no equivalent: YaraConsolidateApply always writes, and deletes.'
  playbookInputQuery: null
- key: scan_id
  value:
    simple: ''
  required: false
  description: Restrict this run to these scan_id(s) (comma-separated). Leave empty for all finished scans across the tenant.
  playbookInputQuery: null
- key: poll_interval_minutes
  value:
    simple: '30'
  required: false
  description: Minutes between rechecks while waiting on in-progress scans.
  playbookInputQuery: null
- key: poll_timeout_minutes
  value:
    simple: '240'
  required: false
  description: Total minutes to wait for in-progress scans before giving up on this cycle and letting the next scheduled run pick it up. This is THIS RUN's patience budget, separate from CONFIG_CONSOLIDATE_OBSOLETE_AFTER (days-scale, in the script) which governs when a truly-stuck scan is merged anyway to preserve its findings.
  playbookInputQuery: null
- key: max_scans
  value:
    simple: ''
  required: false
  description: 'Most scans one Apply pass consolidates before stopping and reporting more remain (see Yara.ConsolidateApply output). Bounds a pass to finish inside the script timeout instead of being killed mid-merge while still holding the consolidation lock - measured live: 5 scans took 71% of a 900s timeout, so 20 would be killed around scan 7. Leave empty for the script default (4). The polling loop above means a bounded pass is not a dead end - "Anything ready after waiting?" is not what re-invokes it, though: a full backlog needs this playbook re-run, or the input raised, to finish.'
  playbookInputQuery: null
- key: row_ceiling
  value:
    simple: ''
  required: false
  description: Override the script's default per-scan row ceiling (2,000,000) above which a scan is refused rather than half-built. Leave empty to use the script default. Raise this for a tenant whose scans legitimately produce more matches than the default ceiling allows, instead of resorting to manual ad-hoc invocation.
  playbookInputQuery: null
- key: abandoned_after_hours
  value:
    simple: ''
  required: false
  description: Override the script's default hours (24h) a non-terminal scan must be silent before it's treated as abandoned and consolidated anyway to preserve its partial findings. Leave empty to use the script default.
  playbookInputQuery: null
outputs:
- contextPath: Yara.ConsolidateStatus.eligible_count
  description: Number of scans found eligible on the last status check.
  type: Number
- contextPath: Yara.ConsolidateApply.consolidated_count
  description: Number of scans actually merged this run.
  type: Number
- contextPath: Yara.ConsolidateApply.failed_count
  description: Number of scans that failed to merge and need attention.
  type: Number
- contextPath: Yara.ConsolidateApply.failed_reasons
  description: Map of failed scan_id to the specific reason it failed (e.g. row_ceiling_exceeded, count_mismatch).
  type: Unknown
- contextPath: Yara.ConsolidateSummary.written
  description: 'Summary mode only: per-scan summary targets written, with row count, host count and why the scan was eligible.'
  type: Unknown
- contextPath: Yara.ConsolidateSummary.failed
  description: 'Summary mode only: scans that could not be summarised. Host shards are untouched in every case, so re-running is safe.'
  type: Unknown
- contextPath: Yara.ConsolidateSummary.shards_deleted
  description: 'Summary mode only: always 0. Present so a run can prove that the summary branch deleted nothing.'
  type: Number
- contextPath: Yara.ConsolidateSummary.dry_run
  description: 'Summary mode only: true when the branch ran as a preview, i.e. summary_execute was not left at its default of true.'
  type: Boolean
