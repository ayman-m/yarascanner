    type: condition
    task:
      id: 7d3e0c30-0000-0000-0000-00000000000d
      version: -1
      name: Anything failed?
      description: 'Reports failures as Yara.ConsolidateSummary.failed. Host shards are untouched in every failure
        case - this automation never deletes a source - which is why a failure is a flag to read rather than an
        incident to chase: re-running is always safe.'
      type: condition
      iscommand: false
      brand: ''
    conditions:
