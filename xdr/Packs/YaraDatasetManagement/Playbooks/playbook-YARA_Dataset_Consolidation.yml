        halts the whole run before here) - for that case, and for a persistent/queryable history this task's own
        context flag does not provide, see the yara_scanner_consolidation_runs dataset and the "Consolidation Run
        Health" widget, written by YaraConsolidateSummary on every executing pass, including one that stands down
