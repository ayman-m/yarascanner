id: YARA_Dataset_Consolidation
version: -1
name: YARA Dataset Consolidation
description: "Groups the matched-file rows every host produced under one RULESET into a single consolidated dataset,\
  \ safely handling scans still in progress. Meant to run twice daily as a Job.\n\nFlow: check readiness -> wait\
  \ on a bounded poll if scans are still running -> consolidate in the mode consolidation_mode selects -> flag anything\
  \ that failed. Nothing eligible and nothing running ends the run cleanly; the next trigger picks up whatever has\
  \ since finished. No state persists between runs.\n\nTwo modes, both reading the same permanent per-host matches\
  \ datasets and NEITHER DELETING A SOURCE:\n  full (default) - YaraConsolidateApply, every column of every matched-file\
  \ row, one dataset per ruleset.\n  summary - YaraConsolidateSummary, one row per (host, rule), roughly a fortieth\
  \ of the rows.\n\nA finished scan is not grouped until its newest row has been quiet for 900s: the scanner writes\
  \ its terminal lifecycle row before draining its uploaders, so 'completed' does not mean the rows landed, and\
  \ grouping inside that window would copy a partial set permanently.\n\nSee the pack README for the full reasoning,\
  \ the safety rails and the argument tables."
