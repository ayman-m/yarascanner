id: YARA_Dataset_Consolidation
version: -1
name: YARA Dataset Consolidation
description: "Groups the matched-file rows every host produced under one RULESET into a single consolidated dataset,\
  \ safely handling scans still in progress. Meant to run twice daily as a Job.\n\nFlow: clear context -> summarise\
  \ -> flag anything that failed. YaraConsolidateSummary is dry-run-by-default and computes its own eligibility\
  \ internally (which scans are ready, which are still running), so there is no separate readiness/poll gate in\
  \ front of it - calling it with execute=true both checks and applies in one call. Nothing eligible ends the run\
  \ cleanly, reported by the script itself; the next trigger picks up whatever has since finished. No state persists\
  \ between runs.\n\nSummary mode only: writes one row per (host, rule) into yara_scanner_summary_v<VER>_rules_<hash>,\
  \ roughly a fortieth of the rows full detail would be. It reads the permanent per-host matches datasets and deletes\
  \ NEITHER them nor any row inside them - the per-host dataset remains the deep-dive source until the next scan\
  \ on that host overwrites it. Full-detail consolidation (YaraConsolidateApply, one dataset per ruleset with every\
  \ column) is a separate automation this playbook no longer calls; invoke it directly if full detail is ever needed\
  \ again. See the pack README for the full reasoning and the argument tables.\n\nA finished scan is not summarised\
  \ until its newest row has been quiet for 900s: the scanner writes its terminal lifecycle row before draining\
  \ its uploaders, so 'completed' does not mean the rows landed, and summarising inside that window would copy a\
  \ partial set permanently."
starttaskid: '0'
