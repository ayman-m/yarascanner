    type: regular
    task:
      id: 7d3e0c30-0000-0000-0000-000000000016
      version: -1
      name: Clear context from any previous run
      description: Re-running this playbook on an issue that has already run it would otherwise inherit the previous
        run's context. List-valued outputs are APPENDED to across calls in one investigation, so failed accumulates
        and the condition downstream reads a mixture of both runs. The automation clears its own keys; this clears
        whatever else the issue is carrying, so a re-run starts from the same blank slate as a first run.
      scriptName: DeleteContext
      type: regular
      iscommand: false
      brand: ''
    scriptarguments:
      all:
        simple: 'yes'
    nexttasks:
      '#none#':
      - '12'
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 450, "y": 200}}'
inputs:
- key: scan_id
  value:
    simple: ''
  required: false
  description: Restrict this run to these scan_id(s) (comma-separated). Leave empty for every eligible scan across
    the tenant - YaraConsolidateSummary computes eligibility itself.
  playbookInputQuery: null
- key: execute
  value:
    simple: 'true'
  required: false
  description: YaraConsolidateSummary is a dry run unless execute=true, so this is "true" by default - left at
    "false" the run would report what it would write and write nothing, every scheduled run, for ever. Set it to
    "false" deliberately to preview a pass.
  playbookInputQuery: null
- key: retention_hours
  value:
    simple: ''
  required: false
  description: A scan silent this long is treated as finished even without a terminal lifecycle row. Passed straight
    to YaraConsolidateSummary, which defaults to 24 when it is empty.
  playbookInputQuery: null
outputs:
- contextPath: Yara.ConsolidateSummary.status
  description: One of success, partial_failure or dry_run. The single field to branch on - it saves testing three
    lists to learn what happened.
  type: String
- contextPath: Yara.ConsolidateSummary.written
  description: One OBJECT per summary target written, keyed action / ruleset / target / rows / hosts / scans /
    scans_refreshed / stale_rows_removed / estimated_kb / eligibility. Objects rather than sentences, so a task
    can filter on a field instead of matching prose.
  type: Unknown
- contextPath: Yara.ConsolidateSummary.skipped
  description: One OBJECT per thing left alone, keyed name / reason / detail / scan_id / hostname / dataset / ruleset.
    reason is a closed set - scan_in_progress, quiet_period, no_rule_hash, source_unreadable, stale_removal_disabled,
    nothing_observed - so it is safe to match on. Nothing in this list was touched.
  type: Unknown
- contextPath: Yara.ConsolidateSummary.failed
  description: One OBJECT per ruleset that could not be written, keyed reason / detail / ruleset / target / sources_untouched.
    Host shards are untouched in every case, so re-running is safe.
  type: Unknown
- contextPath: Yara.ConsolidateSummary.warnings
  description: Caveats the run has about its own numbers - a read that hit the row cap, a fleet-wide query that
    fell back to one query per shard. Empty on a clean pass.
  type: Unknown
- contextPath: Yara.ConsolidateSummary.rows_written
  description: Total (host, rule) rows across every target written, or in a preview that would be written.
  type: Number
- contextPath: Yara.ConsolidateSummary.collapse_ratio
  description: findings_collapsed / summary_rows_observed - how many file-level findings one summary row stands
    for. The number that says what summary mode is buying.
  type: Number
- contextPath: Yara.ConsolidateSummary.stale_removal_enabled
  description: Whether the pass was allowed to remove superseded rows from its own targets. False after a bounded
    pass or an unreadable source, which needs a later unbounded pass to reconcile.
  type: Boolean
- contextPath: Yara.ConsolidateSummary.shards_deleted
  description: Always 0. Present so a run can prove that this branch deleted nothing.
  type: Number
- contextPath: Yara.ConsolidateSummary.dry_run
  description: True when the run was a preview, i.e. execute was not left at its default of true.
  type: Boolean
