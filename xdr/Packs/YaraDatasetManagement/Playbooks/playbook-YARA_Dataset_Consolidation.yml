  '12':
    id: '12'
    taskid: 7d3e0c30-0000-0000-0000-00000000000c
    type: regular
    task:
      id: 7d3e0c30-0000-0000-0000-00000000000c
      version: -1
      name: Summarise consolidation
      description: 'Writes ONE ROW PER (host, rule) into yara_scanner_summary_v<VER>_rules_<hash>, ONE dataset per
        ruleset holding every host scanned with it - which rules fired on which host - and deletes nothing: no shard,
        no row inside one. The per-host matches dataset is permanent under the scanner''s overwrite model and stays
        as the deep-dive source. Takes the consolidation lock so it never runs concurrently with a manually-invoked
        YaraConsolidateApply pass. schema_version is deliberately not wired to a playbook input - the automation''s
        own default (the scanner''s current lookup schema version) is right for a single-version fleet, and a mid-rollout
        fleet should be summarised by invoking the automation directly per version rather than by giving a scheduled
        Job a version to go stale. Dry run unless execute is true - it reports exactly what it would write and creates
        nothing.'
      script: YaraConsolidateSummary
      type: regular
      iscommand: false
      brand: ''
    scriptarguments:
      scan_id:
        simple: ${inputs.scan_id}
      retention_hours:
        simple: ${inputs.retention_hours}
      execute:
        simple: ${inputs.execute}
    nexttasks:
      '#none#':
      - '13'
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 450, "y": 350}}'
    note: false
