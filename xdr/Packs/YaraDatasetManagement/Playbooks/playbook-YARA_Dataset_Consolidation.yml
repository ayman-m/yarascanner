id: YARA_Dataset_Consolidation
version: -1
name: YARA Dataset Consolidation
description: "Groups the matched-file rows every host produced under one RULESET into a single consolidated dataset,\
  \ safely handling scans still in progress. Meant to run twice daily as a Job.\n\nFlow: clear context -> consolidate\
  \ in the mode consolidation_mode selects -> flag anything that failed. There is no separate readiness/poll gate\
  \ in front of the consolidate step: YaraConsolidateApply and YaraConsolidateSummary are both dry-run-by-default\
  \ and compute their own eligibility internally (the same check a standalone status task would have made), so\
  \ calling either directly with execute=true both checks and applies in one call. Nothing eligible ends the run\
  \ cleanly, reported by the script itself; the next trigger picks up whatever has since finished. No state persists\
  \ between runs.\n\nTwo modes, both reading the same permanent per-host matches datasets and NEITHER DELETING A\
  \ SOURCE:\n  full - YaraConsolidateApply, every column of every matched-file row, one dataset per ruleset.\n \
  \ summary (default) - YaraConsolidateSummary, one row per (host, rule), roughly a fortieth of the rows.\n\nThe\
  \ readiness-check/poll tasks (status check, GenericPolling wait, recheck) are still defined in this playbook but\
  \ are currently UNREACHABLE - kept for a possible future re-wire rather than deleted, since removing them loses\
  \ the automatic wait-for-in-progress-scans behavior they provided. See the pack README for the full reasoning,\
  \ the safety rails and the argument tables.\n\nA finished scan is not grouped until its newest row has been quiet\
  \ for 900s: the scanner writes its terminal lifecycle row before draining its uploaders, so 'completed' does not\
  \ mean the rows landed, and grouping inside that window would copy a partial set permanently."
starttaskid: '0'
