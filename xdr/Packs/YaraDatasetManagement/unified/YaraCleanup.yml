args:
- name: older_than_months
  description: Delete rotated datasets older than N whole months. No default, on purpose — omit it (and delete_legacy) and this automation selects nothing and deletes nothing. N=0 means "every month before the current one". A negative value is clamped to 0.
  required: false
  isArray: false
  default: false
  secret: false
- name: delete_legacy
  description: Also delete datasets on an older/unversioned schema. Every safety rail applies to these exactly as it does to the retention-window path, because "legacy" is derived from schema_version — set that one version too high and live datasets classify as legacy. Refused outright while any NEWER-schema dataset exists (that proves schema_version is stale), and unsuffixed legacy datasets are never blanket candidates. Datasets on a NEWER schema are never deleted regardless.
  required: false
  isArray: false
  default: false
  defaultValue: 'false'
  secret: false
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
- name: execute
  description: THE DELETION OPT-IN. Leave false (the default) for a dry run that reports what it would delete and deletes nothing. Set true to actually delete — whole datasets, irreversibly.
  required: false
  isArray: false
  default: false
  defaultValue: 'false'
  secret: false
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
- name: min_quiet_hours
  description: Never delete a dataset whose newest row is younger than this many hours, regardless of its month label — protects against a scan still writing near a month boundary, or clock/timezone skew between the scanning endpoint and the tenant (default 24). This argument CANNOT switch the rail off - anything below the 1h floor is raised to 1h and the run says so.
  required: false
  isArray: false
  default: false
  secret: false
- name: force
  description: Pass force=true to delete_dataset, for datasets that have dependencies.
  required: false
  isArray: false
  default: false
  defaultValue: 'false'
  secret: false
  auto: PREDEFINED
  predefined:
  - 'true'
  - 'false'
- name: schema_version
  description: The scanner's current lookup schema version (YARA_LOOKUP_SCHEMA_VER on the endpoints; "2" if unset). Must be a whole number — a non-numeric value is rejected outright, because it would silently reclassify every live dataset as "legacy". Datasets on a HIGHER version are classified as "newer" and are never deleted; if this is stale-LOW the run prunes little and says which datasets rail 4 vetoed. If it is stale-HIGH, live datasets classify as legacy — the live recency and consolidation rails are what stop that from deleting them, and they are reported as skips.
  required: false
  isArray: false
  default: false
  secret: false
comment: 'Retention pruning for YARA lookup datasets — DELETES WHOLE DATASETS. Dry run by default: without execute=true it reports what it would delete and deletes nothing, so a bare invocation can never lose data. Seven safety rails apply to every candidate on BOTH selection paths (retention window and delete_legacy) and are not optional — never the current month (a scan may be writing to it), never a future-dated month (clock skew), never an unsuffixed dataset (it holds ALL pre-rotation history for that host), never a newer schema version, never a name outside the yara_scanner_* contract, never a dataset written to within min_quiet_hours, and never a dataset still holding a scan consolidation has not verified into a per-scan target. Per-scan consolidated targets are never candidates either. Every kept candidate''s reason is reported, including the newer-schema and (when delete_legacy is off) legacy buckets. A real deletion pass takes the same consolidation lock YaraConsolidateApply uses and stands down if another run holds it — treating an unreadable lock row as held, and reporting any takeover; a dry run never takes the lock. Each executed pass writes one row to yara_scanner_cleanup_runs.'
commonfields:
  id: YaraCleanup
  version: -1
enabled: true
name: YaraCleanup
outputs:
- contextPath: Yara.Cleanup.dry_run
  description: True if this run deleted nothing by design (execute was not true).
  type: Boolean
- contextPath: Yara.Cleanup.nothing_requested
  description: True if neither older_than_months nor delete_legacy was given, so nothing was selected and no API call was made.
  type: Boolean
- contextPath: Yara.Cleanup.lock_held_by_other_run
  description: True if the consolidation lock was held by another run, so this pass deleted nothing.
  type: Boolean
- contextPath: Yara.Cleanup.lock_taken_over
  description: True if another run's lock marker was present and this pass took it over as stale — it deleted while that marker was in place.
  type: Boolean
- contextPath: Yara.Cleanup.lock_takeover_reason
  description: The takeover message, when lock_taken_over is true.
  type: String
- contextPath: Yara.Cleanup.selected
  description: Dataset(s) that passed every safety rail — deleted this run, or that would be deleted on a dry run.
  type: String
- contextPath: Yara.Cleanup.selected_count
  description: Number of datasets selected for deletion.
  type: Number
- contextPath: Yara.Cleanup.deleted
  description: Dataset(s) actually deleted this run (always empty on a dry run).
  type: String
- contextPath: Yara.Cleanup.deleted_count
  description: Number of datasets actually deleted this run.
  type: Number
- contextPath: Yara.Cleanup.failed
  description: Per-dataset delete failures — dataset and error. One failure does not strand the rest of the cleanup.
  type: Unknown
- contextPath: Yara.Cleanup.failed_count
  description: Number of datasets that failed to delete.
  type: Number
- contextPath: Yara.Cleanup.skipped
  description: Every candidate that was kept, with the specific rail and reason that kept it — including newer-schema datasets and, when delete_legacy is off, legacy ones.
  type: String
- contextPath: Yara.Cleanup.skipped_count
  description: Number of candidates kept.
  type: Number
- contextPath: Yara.Cleanup.newer
  description: Datasets on a HIGHER schema version than schema_version — never pruned (rail 4). A non-empty list here means schema_version may be stale.
  type: String
- contextPath: Yara.Cleanup.newer_count
  description: Number of newer-schema datasets vetoed by rail 4.
  type: Number
- contextPath: Yara.Cleanup.schema_version
  description: The schema version this run treated as current — it decides whether the run had any scope at all.
  type: String
- contextPath: Yara.Cleanup.older_than_months
  description: The retention window this run used (null if none was given).
  type: Number
- contextPath: Yara.Cleanup.delete_legacy
  description: Whether legacy-schema datasets were in scope for this run.
  type: Boolean
- contextPath: Yara.Cleanup.min_quiet_hours
  description: The quiet-period threshold this run used, after the 1h floor.
  type: Number
script: |
  """YaraCleanup — retention pruning for YARA lookup datasets. DELETES WHOLE DATASETS.

  STANDALONE: this file carries everything it needs. It imports no other automation, and
  relies only on the demisto / CommonServerPython names the platform injects at runtime.

  DRY RUN BY DEFAULT: without `execute=true` this reports what it WOULD delete and deletes
  nothing, so an operator who runs it with no arguments can never lose data. The readable
  output states which mode the run was in.

  The seven safety rails live in YaraConsolidateCommon.prune_datasets and the functions it
  calls (never the current month, never a future month, never an unsuffixed dataset, never a
  newer schema version, never a name outside the yara_scanner_* contract, never a dataset
  written to within min_quiet_hours, never a dataset still holding an unconsolidated scan).
  They apply to BOTH selection paths — the retention window and delete_legacy — because
  "legacy" is a classification derived from the schema_version argument, and a version set one
  too high reclassifies the live tenant as legacy. A real deletion pass takes the same
  consolidation lock YaraConsolidateApply uses, before the rails are evaluated; a dry run
  never takes it.

  Deliberately does NOT write a row to yara_scanner_consolidation_runs: that dataset's schema
  is scan-oriented (consolidated_count, failed_scan_ids, status success|partial_failure|
  crashed) and describes a consolidation pass. Recording dataset deletions there would
  misreport counts on the Consolidation Run Health widget and — worse — a cleanup row would
  satisfy that widget's "a row in the last ~24h" liveness check, masking a merge Job that has
  stopped running. An executed prune instead writes one row to its own yara_scanner_cleanup_runs
  dataset (see record_cleanup_run), because a War Room entry alone cannot answer "what did we
  prune last month" for an action with no undo.
  """

  # ============================================================================
  # Inlined verbatim from the shared consolidation library. Do not edit here in
  # isolation - tests/ gates this against xdr_consolidate.py and xdr_data_management.py.
  # ============================================================================
  import json
  import time



  # ============================================================================
  # xdr_consolidate.py core logic — verbatim port. That module is the one unit-tested with no
  # network in tests/test_consolidation.py against a FakeClient; the copy below is held to it by
  # test_pack_copy_gate_logic_matches_xdr_consolidate, which compares the two files' gate
  # helpers statement-by-statement so this copy cannot silently drift out of sync again. See
  # xdr_consolidate.py for full comments.
  # ============================================================================
  import collections
  import re

  _PREFIX = "yara_scanner"
  _SHARD_RE = re.compile(
      r"^yara_scanner_(?P<kind>matches|scans)_v(?P<ver>\d+)_(?P<host>.+?_[0-9a-f]{6})(?:_(?P<month>\d{6}))?$"
  )
  TERMINAL_LIFECYCLE = {"completed", "cancelled", "failed"}
  # Kept in sync with xdr_consolidate.py's TERMINAL_ACTION — see that module for the
  # provenance comment (union of every Action Center state this repo's tooling has observed
  # as terminal from live polling, plus ABORTED/CANCELLED for Gate B).
  TERMINAL_ACTION = {"COMPLETED_SUCCESSFULLY", "FAILED", "ABORTED", "EXPIRED",
                     "TIMEOUT", "CANCELED", "CANCELLED",
                     "COMPLETED_WITH_ERRORS", "COMPLETED_PARTIAL"}
  DEFAULT_QUIET_SECS = 900
  DEFAULT_ROW_CEILING = 2_000_000
  DEFAULT_ABANDONED_SECS = 24 * 3600
  DELETE_CONCURRENCY = 12
  _WRITE_BATCH = 500
  # Endpoint-clock-skew tolerances (edge case #6) — kept in sync with xdr_consolidate.py, see
  # that module for the reasoning and the live measurements behind both numbers.
  SKEW_TOLERANCE_MS = 5 * 60 * 1000
  DEFAULT_SKEW_BACKSTOP_SECS = 7 * 24 * 3600

  # v2: one row per matched string offset (pre-3.0.0 scanner). v3: one row per (rule, file)
  # finding — see xdr_yara_scanner.py's add_match docstring for why. Both stay consolidatable
  # so a tenant mid-rollout of scanner v3.0.0 can still process leftover v2 shards.
  MATCHES_SCHEMA = {
      "tenant_id": "text", "scan_id": "text", "run_id": "text", "scan_date": "text",
      "hostname": "text", "os_info": "text", "os_type": "text", "ip_address": "text",
      "rule": "text", "filename": "text", "file_size": "number", "file_sha256": "text",
      "file_creation_time": "text", "scan_folder": "text", "match": "text", "offset": "number",
      "matched_length": "number", "string": "text", "severity": "text",
      "event_timestamp_ms": "number", "date_of_scan": "text",
  }
  MATCHES_SCHEMA_V3 = {
      "tenant_id": "text", "scan_id": "text", "run_id": "text", "scan_date": "text",
      "hostname": "text", "os_info": "text", "os_type": "text", "ip_address": "text",
      "rule": "text", "filename": "text", "file_size": "number", "file_sha256": "text",
      "file_creation_time": "text", "scan_folder": "text",
      "match_count": "number", "offsets": "text", "strings": "text", "string_ids": "text",
      "truncated": "bool", "severity": "text",
      "event_timestamp_ms": "number", "date_of_scan": "text",
  }
  _MATCHES_SCHEMAS_BY_VER = {"2": MATCHES_SCHEMA, "3": MATCHES_SCHEMA_V3}
  KNOWN_MATCHES_SCHEMA_VERSIONS = tuple(sorted(_MATCHES_SCHEMAS_BY_VER))


  def matches_schema_for(ver):
      return _MATCHES_SCHEMAS_BY_VER.get(str(ver), MATCHES_SCHEMA_V3)


  SCANS_SCHEMA = {
      "tenant_id": "text", "scan_id": "text", "run_id": "text", "scan_date": "text",
      "hostname": "text", "os_info": "text", "os_type": "text", "ip_address": "text",
      "status": "text", "scan_folder": "text", "files_scanned": "number",
      "files_skipped": "number", "detections": "number", "valid_rules": "number",
      "failed_rules": "number", "scan_rate_fps": "number", "elapsed_secs": "number",
      "total_paused_secs": "number", "throttle_mode": "text", "posture": "text",
      "event_timestamp_ms": "number", "message": "text",
  }

  # ---- overlap guard (defense in depth against a misconfigured/broken Job queue-handling
  # setting letting two consolidate_all runs collide on the same per-scan target) ----
  _LOCK_DATASET = "yara_scanner_consolidation_lock"
  _LOCK_SCHEMA = {"holder": "text", "started_ms": "number"}
  DEFAULT_LOCK_STALE_SECS = 2 * 3600


  def _read_lock(client):
      rows = client.xql("dataset = %s" % _LOCK_DATASET, limit=5) or []
      if not rows:
          return None
      ts = rows[0].get("started_ms")
      try:
          return int(ts) if ts is not None else None
      except (TypeError, ValueError):
          return None


  def acquire_consolidation_lock(client, log=print, now_ms=None,
                                 stale_after_secs=DEFAULT_LOCK_STALE_SECS, holder="unknown",
                                 unreadable_is_held=False, on_takeover=None):
      """See xdr_consolidate.py. Two knobs matter for the deletion caller (prune_datasets),
      whose cost of a WRONG takeover is irreversible rather than a retry: unreadable_is_held
      treats a lock dataset with no readable row as HELD (that is the add_data create-lag
      window right after another run took it), and on_takeover surfaces a steal so a prune can
      never report an uncontended pass while another run's marker was in place."""
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)
      resp = client.create_lookup_dataset(_LOCK_DATASET, _LOCK_SCHEMA)
      fresh = isinstance(resp, dict) and "dataset_name" in resp
      if not fresh:
          held_ms = _read_lock(client)
          if held_ms is not None and (now_ms - held_ms) < stale_after_secs * 1000:
              log("consolidation lock held (age %.0fs) - another run appears to be in "
                  "progress; skipping this pass" % ((now_ms - held_ms) / 1000.0))
              return False
          if held_ms is None and unreadable_is_held:
              log("consolidation lock marker exists but its row is unreadable - another run "
                  "most likely just created it (add_data create-lag); standing down rather "
                  "than taking over")
              return False
          msg = ("consolidation lock is stale or unreadable (%s) - taking over"
                 % ("age unknown" if held_ms is None
                    else "age %.0fs" % ((now_ms - held_ms) / 1000.0)))
          log(msg)
          if on_takeover:
              on_takeover(msg)
          client.delete_dataset(_LOCK_DATASET, force=True)
          client.create_lookup_dataset(_LOCK_DATASET, _LOCK_SCHEMA)
      client.add_lookup_data(_LOCK_DATASET, [{"holder": str(holder), "started_ms": now_ms}])
      return True


  def release_consolidation_lock(client, log=print):
      try:
          client.delete_dataset(_LOCK_DATASET, force=True)
      except Exception as e:
          log("could not release consolidation lock: %s" % e)


  # ---- consolidation run-log (edge case #36/#53) ------------------------------
  # A persistent, tenant-queryable record of each YaraConsolidateApply pass's outcome — the
  # only dashboard-visible signal for whether the twice-daily consolidation pipeline itself is
  # healthy. Task 8 ("Flag failures for attention") only writes to that one run's OWN ephemeral
  # XSOAR investigation context, which nothing else reads and which a total execution crash
  # (return_error on task 1/4/6, halting the playbook before task 8 is ever reached) bypasses
  # entirely — this dataset is what a widget can actually query, for every outcome including
  # a crash. See widgets/xdr/Consolidation Run Health.xql.
  _RUNS_DATASET = "yara_scanner_consolidation_runs"
  _RUNS_SCHEMA = {
      "run_ts_ms": "number", "status": "text", "consolidated_count": "number",
      "failed_count": "number", "failed_scan_ids": "text", "failed_reasons": "text",
      "error_message": "text",
  }


  def record_consolidation_run(client, status, result=None, error_message="", now_ms=None, log=print):
      """Best-effort: write ONE row per YaraConsolidateApply invocation recording its outcome.

      status is "success" (result["failed_count"] == 0), "partial_failure"
      (result["failed_count"] > 0), or "crashed" (consolidate_all raised before returning —
      result is then None/absent and error_message carries the exception text).

      A failure to WRITE this row must never mask or replace the run's real outcome — the
      caller still return_error()s / returns its normal CommandResults exactly as before
      regardless of whether this call succeeds; that is why every exception here is caught and
      only logged, never re-raised."""
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)
      result = result or {}
      row = {
          "run_ts_ms": now_ms,
          "status": status,
          "consolidated_count": int(result.get("consolidated_count", 0) or 0),
          "failed_count": int(result.get("failed_count", 0) or 0),
          "failed_scan_ids": json.dumps(result.get("failed_scan_ids", [])),
          "failed_reasons": json.dumps(result.get("failed_reasons", {})),
          "error_message": str(error_message or "")[:500],
      }
      try:
          client.create_lookup_dataset(_RUNS_DATASET, _RUNS_SCHEMA)
          client.add_lookup_data(_RUNS_DATASET, [row])
      except Exception as e:
          log("could not record consolidation run outcome: %s" % e)


  def target_name(kind, ver, scan_id):
      slug = re.sub(r"[^a-z0-9]+", "_", str(scan_id).lower()).strip("_") or "unknown"
      return "%s_%s_v%s_scan_%s" % (_PREFIX, kind, ver, slug)


  def parse_shard(name):
      if name is None:
          return None
      m = _SHARD_RE.match(name)
      if not m:
          return None
      host = m.group("host")
      if host.startswith("scan_") or host == "scan":
          return None
      return {"kind": m.group("kind"), "ver": m.group("ver"), "host": host, "month": m.group("month")}


  def shard_is_terminal(latest_status, action_state):
      if latest_status and str(latest_status).lower() in TERMINAL_LIFECYCLE:
          return True
      if action_state and str(action_state).upper() in TERMINAL_ACTION:
          return True
      return False


  def _as_ms(v):
      """Epoch-ms int from whatever XQL hands back (int, float, numeric/exponent string, ISO
      timestamp), or None. Never raises - see xdr_consolidate.py for why each shape is accepted."""
      if v is None:
          return None
      if isinstance(v, bool):
          return None
      try:
          return int(v)
      except (TypeError, ValueError):
          pass
      try:
          return int(float(v))
      except (TypeError, ValueError):
          pass
      try:
          from datetime import datetime, timezone
          s = str(v).strip().replace("Z", "+00:00")
          dt = datetime.fromisoformat(s)
          if dt.tzinfo is None:
              dt = dt.replace(tzinfo=timezone.utc)
          return int(dt.timestamp() * 1000)
      except (TypeError, ValueError):
          return None


  def _newest_ms(endpoint_ms, server_ms, now_ms=None):
      """The freshness signal both time gates measure against: the LATER of the endpoint's own
      event_timestamp_ms and the platform's server-side _insert_time, with implausible values
      discarded first (endpoint stamp ahead of ingest = a clock running ahead; server stamp far
      in the future of now_ms = a unit mismatch). Edge case #6 - see xdr_consolidate.py's copy
      for the full reasoning, including why this must never be reduced to _insert_time alone and
      why both callers may only ever be fed SOURCE SHARDS, never a per-scan target."""
      ep, srv = _as_ms(endpoint_ms), _as_ms(server_ms)
      if ep is not None and srv is not None and now_ms is not None \
              and srv > now_ms + SKEW_TOLERANCE_MS:
          srv = None                       # guard 2: implausible server stamp (unit mismatch)
      if ep is not None and srv is not None and ep > srv + SKEW_TOLERANCE_MS:
          ep = None                        # guard 1: endpoint clock ahead of ingest
      vals = [v for v in (ep, srv) if v is not None]
      return max(vals) if vals else None


  def _max_ms(a, b):
      """max() over two optional epoch-ms values, ignoring Nones."""
      if a is None:
          return b
      if b is None:
          return a
      return max(a, b)


  _ScanStat = collections.namedtuple("_ScanStat", "count newest ep_newest")


  def build_terminal_map(scans_rows_by_ds, action_state_for=None):
      out = {}
      for ds, rows in scans_rows_by_ds.items():
          p = parse_shard(ds)
          if not p or p["kind"] != "scans":
              continue
          host = p["host"]
          per = {}
          for r in rows:
              sid = r.get("scan_id")
              if sid:
                  per.setdefault(sid, []).append(r)
          for sid, rs in per.items():
              rs_sorted = sorted(rs, key=lambda r: _as_ms(r.get("event_timestamp_ms")) or 0)
              latest_status = rs_sorted[-1].get("status")
              newest = None
              for r in rs:
                  newest = _max_ms(newest, _newest_ms(r.get("event_timestamp_ms"),
                                                      r.get("_insert_time")))
              astate = action_state_for(host) if action_state_for else None
              out[(sid, host)] = {"terminal": shard_is_terminal(latest_status, astate),
                                  "newest_ms": newest, "status": latest_status}
      return out


  def newest_row_age_ok(newest_ms, now_ms, quiet_secs):
      if newest_ms is None:
          return True
      return (now_ms - int(newest_ms)) >= quiet_secs * 1000


  def plan_consolidation(scan_id, source_counts, target_count, row_ceiling=DEFAULT_ROW_CEILING):
      source_total = sum(int(v) for v in source_counts.values())
      if source_total > row_ceiling:
          return {"scan_id": scan_id, "ok": False, "reason": "row_ceiling_exceeded",
                  "source_total": source_total, "target_count": target_count, "deletable": []}
      if target_count == source_total and source_total > 0:
          return {"scan_id": scan_id, "ok": True, "reason": "verified",
                  "source_total": source_total, "target_count": target_count,
                  "deletable": sorted(source_counts)}
      return {"scan_id": scan_id, "ok": False, "reason": "count_mismatch",
              "source_total": source_total, "target_count": target_count, "deletable": []}


  def _added(reply):
      r = reply or {}
      return int(r.get("records_added", r.get("rows added", 0)) or 0)


  def _rows_of(dataset, client, limit=50000):
      return client.xql("dataset = %s" % dataset, limit=limit) or []


  def _rows_for_scan(client, dataset, scan_id, limit=50000):
      safe = str(scan_id).replace('"', "")
      return client.xql('dataset = %s | filter scan_id = "%s"' % (dataset, safe), limit=limit) or []


  def _cleanup_verified_scan_rows(client, srcs, scan_id, log):
      """Once scan_id's per-scan target is verified, strip just its rows out of every source
      shard right away - narrowing the window where a dashboard querying the wildcard
      double-counts it (once from the shard, once from the already-complete target), rather
      than waiting for the whole shard to become deletable (every OTHER scan it holds also
      finished). Sequential - remove_lookup_data is documented NOT concurrency-safe. Best
      effort: a failure here must not affect the scan's (already-verified) plan, and must not
      block the eventual whole-shard delete_dataset() once every scan sharing that shard is
      also done - that cleanup is separate and unconditional on this succeeding.

      Callers must only invoke this for kind=="matches" - see xdr_consolidate.py's identical
      helper for why "scans" shards must never be stripped this way (their rows are the sole
      source of build_terminal_map's lifecycle signal for sibling scans still sharing that
      shard)."""
      for ds in srcs:
          try:
              client.remove_lookup_data(ds, [{"scan_id": scan_id}])
          except Exception as e:
              log("  scan %s: row-level cleanup of %s FAILED (leaving rows for eventual "
                  "whole-shard delete instead): %s" % (scan_id, ds, str(e)[:120]))


  def _scan_stats(client, dataset, now_ms=None, log=None):
      """{scan_id: _ScanStat(count, newest, ep_newest)} via aggregation - no row pull. newest is
      skew-proofed per _newest_ms: max(_insert_time) rides along in the same comp stage (verified
      working on the live tenant). dataset MUST be a source shard, never a per-scan target."""
      rows = client.xql("dataset = %s | comp count() as n, max(event_timestamp_ms) as newest, "
                        "max(_insert_time) as srv_newest by scan_id" % dataset, limit=10000) or []
      out, srv_seen = {}, False
      for r in rows:
          sid = r.get("scan_id")
          if not sid:
              continue
          ep, srv = _as_ms(r.get("newest")), _as_ms(r.get("srv_newest"))
          srv_seen = srv_seen or srv is not None
          out[sid] = _ScanStat(int(r.get("n") or 0), _newest_ms(ep, srv, now_ms), ep)
      _warn_if_no_server_stamp(dataset, bool(out), srv_seen, log)
      return out


  def _warn_if_no_server_stamp(dataset, had_rows, srv_seen, log):
      """A silently-inactive skew protection (platform stopped returning _insert_time) must be
      visible in the Job's log rather than degrade unnoticed to pre-fix behaviour."""
      if had_rows and not srv_seen and log:
          log("  note: %s returned no usable _insert_time — endpoint-clock-skew protection is "
              "INACTIVE for this shard; gates fall back to event_timestamp_ms alone" % dataset)


  def _coerce_row(row, schema):
      out = {}
      for k in schema:
          if k not in row:
              continue
          v, t = row[k], schema[k]
          if v is None:
              out[k] = v
          elif t == "number":
              try:
                  f = float(v)
                  out[k] = int(f) if f == int(f) else f
              except (TypeError, ValueError):
                  out[k] = v
          elif t == "bool":
              out[k] = v if isinstance(v, bool) else str(v).strip().lower() in ("true", "1", "yes")
          elif t == "text":
              out[k] = v if isinstance(v, str) else str(v)
          else:
              out[k] = v
      return out


  def _stats_from_rows(rows, now_ms=None, log=None, dataset=""):
      """Same shape as _scan_stats but from already-read rows (used for tiny scans shards); here
      _insert_time arrives as a system column on each read-back row rather than from the
      aggregation. Rows MUST come from a source shard, never a per-scan target."""
      out, srv_seen = {}, False
      for r in rows:
          sid = r.get("scan_id")
          if not sid:
              continue
          prev = out.get(sid) or _ScanStat(0, None, None)
          ep, srv = _as_ms(r.get("event_timestamp_ms")), _as_ms(r.get("_insert_time"))
          srv_seen = srv_seen or srv is not None
          out[sid] = _ScanStat(prev.count + 1,
                               _max_ms(prev.newest, _newest_ms(ep, srv, now_ms)),
                               _max_ms(prev.ep_newest, ep))
      _warn_if_no_server_stamp(dataset, bool(out), srv_seen, log)
      return out


  def _gate_scan(scan_id, srcs, newest_by, ep_newest_by, tmap, now_ms, quiet_secs,
                 abandoned_after_secs, log, skew_backstop_secs=DEFAULT_SKEW_BACKSTOP_SECS):
      """Defer-reason string if any source host is not safe yet, else ''. Both age checks measure
      the skew-proof `newest` EXCEPT the `settled` backstop, which uses the endpoint stamp alone -
      the one value nothing but the endpoint itself can re-arm. See xdr_consolidate.py."""
      for ds in srcs:
          host = (parse_shard(ds) or {}).get("host", "")
          entry = tmap.get((scan_id, host))
          is_terminal = bool(entry and entry["terminal"])
          newest = newest_by.get((scan_id, ds))
          ep_newest = (ep_newest_by or {}).get((scan_id, ds))
          ep_age_ms = (now_ms - ep_newest) if ep_newest is not None else None
          settled = ep_age_ms is not None and ep_age_ms >= skew_backstop_secs * 1000
          if newest is not None and newest > now_ms + SKEW_TOLERANCE_MS:
              log("  scan %s: shard %s newest stamp is %.1fh in the FUTURE of this run's clock "
                  "(endpoint clock ahead, no usable _insert_time to correct with) — this scan "
                  "will keep deferring until real time catches up"
                  % (scan_id, ds, (newest - now_ms) / 3_600_000.0))
          if not is_terminal:
              age_ms = (now_ms - newest) if newest is not None else None
              abandoned = age_ms is not None and age_ms >= abandoned_after_secs * 1000
              if abandoned or settled:
                  log("  scan %s: host %s non-terminal (%s) but %s — treating as ABANDONED, "
                      "consolidating to preserve its findings"
                      % (scan_id, host, (entry.get("status") if entry else "no lifecycle row"),
                         ("newest row is %.1fh old" % (age_ms / 3_600_000.0)) if abandoned else
                         ("the endpoint has written nothing for %.1f days (server-stamp "
                          "backstop)" % (ep_age_ms / 86_400_000.0))))
              else:
                  log("  scan %s: host %s not terminal (%s) — deferring"
                      % (scan_id, host, "no lifecycle row" if not entry else entry.get("status")))
                  return "host_not_terminal"
          if not newest_row_age_ok(newest, now_ms, quiet_secs) and not settled:
              log("  scan %s: host shard %s within quiet period — deferring" % (scan_id, ds))
              return "within_quiet_period"
      return ""


  def _list_yara_datasets(client):
      raw = client.get_datasets()
      if isinstance(raw, dict):
          items = raw.get("data") or raw.get("datasets") or raw.get("reply") or []
      else:
          items = raw or []
      names = []
      for d in items:
          if isinstance(d, str):
              n, dtype = d, "LOOKUP"
          elif isinstance(d, dict):
              n = d.get("Dataset Name") or d.get("dataset_name") or d.get("name")
              dtype = str(d.get("Type") or d.get("dataset_type") or "LOOKUP").upper()
          else:
              continue
          if n and dtype == "LOOKUP" and str(n).startswith(_PREFIX):
              names.append(str(n))
      return names


  def _count(client, dataset):
      r = client.xql("dataset = %s | comp count() as n" % dataset, limit=5)
      return int(r[0].get("n", 0)) if r else 0


  def _delete_many(client, names, log, concurrency=None):
      import threading
      concurrency = concurrency or DELETE_CONCURRENCY
      lock = threading.Lock()
      done = {"n": 0}

      def worker(ds):
          try:
              client.delete_dataset(ds, force=True)
              with lock:
                  done["n"] += 1
          except Exception as e:
              log("    delete FAILED %s: %s" % (ds, str(e)[:60]))

      for i in range(0, len(names), concurrency):
          batch = names[i:i + concurrency]
          threads = [threading.Thread(target=worker, args=(ds,)) for ds in batch]
          for t in threads:
              t.start()
          for t in threads:
              t.join()
          log("    deleted %d/%d shards" % (done["n"], len(names)))


  def run_consolidation(client, kind, ver="2", quiet_secs=DEFAULT_QUIET_SECS,
                        row_ceiling=DEFAULT_ROW_CEILING, dry_run=True, log=print,
                        now_ms=None, action_state_for=None, only_scan_ids=None,
                        abandoned_after_secs=DEFAULT_ABANDONED_SECS):
      # ver selects ONE schema version's shards - a v2 shard and a v3 shard for the same scan
      # have different columns, so mixing them under one schema would mis-project every row.
      # check_consolidation_status/consolidate_all fan out across every known version; this
      # function only ever handles one per call.
      ver = str(ver)
      schema = matches_schema_for(ver) if kind == "matches" else SCANS_SCHEMA
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)

      all_ds = _list_yara_datasets(client)
      shards = [d for d in all_ds
                if (parse_shard(d) or {}).get("kind") == kind and (parse_shard(d) or {}).get("ver") == ver]
      if not shards:
          log("no %s shards found" % kind)
          return []

      scans_ds = [d for d in all_ds if (parse_shard(d) or {}).get("kind") == "scans"]
      scans_rows = {d: _rows_of(d, client) for d in scans_ds}
      tmap = build_terminal_map(scans_rows, action_state_for)

      all_groups, newest_by, ep_newest_by = {}, {}, {}
      for ds in shards:
          stats = (_stats_from_rows(scans_rows[ds], now_ms=now_ms, log=log, dataset=ds)
                   if kind == "scans" else _scan_stats(client, ds, now_ms=now_ms, log=log))
          for sid, st in stats.items():
              all_groups.setdefault(sid, {})[ds] = st.count
              newest_by[(sid, ds)] = st.newest
              ep_newest_by[(sid, ds)] = st.ep_newest

      shard_scans = {}
      for sid, counts in all_groups.items():
          for ds in counts:
              shard_scans.setdefault(ds, set()).add(sid)

      groups = all_groups
      if only_scan_ids is not None:
          want = set(only_scan_ids)
          groups = {s: c for s, c in all_groups.items() if s in want}
      log("found %d %s shard(s) across %d scan(s)" % (len(shards), kind, len(groups)))
      existing = set(all_ds)

      verified = set()
      plans = []
      for scan_id, counts in sorted(groups.items()):
          srcs = sorted(counts)
          deferred = _gate_scan(scan_id, srcs, newest_by, ep_newest_by, tmap, now_ms, quiet_secs,
                                abandoned_after_secs, log)
          if deferred:
              plans.append({"scan_id": scan_id, "ok": False, "reason": deferred, "deletable": []})
              continue

          target = target_name(kind, ver, scan_id)
          src_total = sum(counts.values())
          if src_total > row_ceiling:
              log("  scan %s: %d rows exceeds ceiling %d — skipped" % (scan_id, src_total, row_ceiling))
              plans.append(plan_consolidation(scan_id, counts, 0, row_ceiling))
              continue

          if dry_run:
              log("  scan %s: WOULD consolidate %d rows from %d shard(s) -> %s"
                  % (scan_id, src_total, len(srcs), target))
              plans.append({"scan_id": scan_id, "ok": None, "reason": "dry_run",
                            "source_total": src_total, "target": target, "deletable": []})
              continue

          pre = _count(client, target) if target in existing else 0
          if pre == src_total and src_total > 0:
              log("  scan %s: target already complete (%d rows) — verified, not rewritten"
                  % (scan_id, pre))
              verified.add(scan_id)
              # A retry of a previously-failed cleanup naturally lands here: this scan's target
              # was already written+verified by an earlier run, but the row-level cleanup below
              # may not have (fully) succeeded that time. Retry it now.
              if kind == "matches":
                  _cleanup_verified_scan_rows(client, srcs, scan_id, log)
              plans.append(plan_consolidation(scan_id, counts, pre, row_ceiling))
              continue                                          # <-- PATH A: idempotent re-verify
          if pre > src_total > 0:
              # Target holds MORE rows than the currently-live sources sum to - expected once
              # row-level cleanup has partially landed on a multi-shard scan (src_total is
              # recomputed fresh every run from whatever source shards are still live, so it
              # shrinks as cleanup succeeds on some sources while pre stays fixed at the
              # original, correct total). Stay verified and retry cleanup on what's left.
              log("  scan %s: target has %d rows, sources currently sum to only %d "
                  "(cleanup already landed on some sources) — still verified, retrying cleanup "
                  "on the rest" % (scan_id, pre, src_total))
              verified.add(scan_id)
              if kind == "matches":
                  _cleanup_verified_scan_rows(client, srcs, scan_id, log)
              plans.append({"scan_id": scan_id, "ok": True, "reason": "verified",
                            "source_total": src_total, "target_count": pre,
                            "deletable": sorted(srcs)})
              continue                                          # <-- PATH A2: partial-cleanup re-verify
          if pre not in (0, src_total):
              log("  scan %s: target exists with %d rows, expected %d — NOT touching, reports mismatch"
                  % (scan_id, pre, src_total))
              plans.append(plan_consolidation(scan_id, counts, pre, row_ceiling))
              continue

          client.create_lookup_dataset(target, schema)
          written = 0
          for ds in srcs:
              rows = _rows_for_scan(client, ds, scan_id)
              rows = [_coerce_row(r, schema) for r in rows]
              for i in range(0, len(rows), _WRITE_BATCH):
                  written += _added(client.add_lookup_data(target, rows[i:i + _WRITE_BATCH]))
          time.sleep(min(30, 2 + src_total // 500))
          tcount = _count(client, target)
          plan = plan_consolidation(scan_id, counts, tcount, row_ceiling)
          log("  scan %s: wrote %d, target now %d, sources %d -> %s"
              % (scan_id, written, tcount, src_total, "VERIFIED" if plan["ok"] else plan["reason"]))
          if plan["ok"]:
              verified.add(scan_id)                             # <-- PATH B: fresh write verified
              if kind == "matches":
                  _cleanup_verified_scan_rows(client, srcs, scan_id, log)
          plans.append(plan)

      if not dry_run:
          to_delete = [ds for ds, sids in shard_scans.items() if sids and sids <= verified]
          for ds, sids in sorted(shard_scans.items()):
              if sids & verified and not (sids <= verified):
                  log("  kept shard %s — %d of %d scan(s) still pending consolidation"
                      % (ds, len(sids - verified), len(sids)))
          if to_delete:
              log("  deleting %d fully-consolidated shard(s), %d at a time" % (len(to_delete), DELETE_CONCURRENCY))
              _delete_many(client, to_delete, log)
      return plans


  def check_consolidation_status(client, kinds=("matches", "scans"), vers=KNOWN_MATCHES_SCHEMA_VERSIONS,
                                 quiet_secs=DEFAULT_QUIET_SECS, row_ceiling=DEFAULT_ROW_CEILING,
                                 abandoned_after_secs=DEFAULT_ABANDONED_SECS,
                                 only_scan_ids=None, now_ms=None, action_state_for=None,
                                 log=lambda *a: None):
      # Covers every known schema version by default - a tenant mid-rollout of a new scanner
      # version has both old- and new-schema shards live at once, and both need consolidating.
      eligible, deferred, blocked = set(), set(), set()
      blocked_reasons = {}
      for ver in vers:
          for kind in kinds:
              for p in run_consolidation(client, kind, ver=ver, quiet_secs=quiet_secs,
                                         row_ceiling=row_ceiling, dry_run=True, log=log,
                                         now_ms=now_ms, action_state_for=action_state_for,
                                         only_scan_ids=only_scan_ids,
                                         abandoned_after_secs=abandoned_after_secs):
                  sid = p["scan_id"]
                  if p.get("ok") is None and p.get("reason") == "dry_run":
                      eligible.add(sid)
                  elif p.get("reason") in ("host_not_terminal", "within_quiet_period"):
                      deferred.add(sid)
                  else:
                      blocked.add(sid)
                      blocked_reasons[sid] = p.get("reason")
      eligible -= deferred | blocked
      return {"any_in_progress": bool(deferred), "eligible_count": len(eligible),
              "eligible_scan_ids": sorted(eligible), "pending_scan_ids": sorted(deferred),
              "blocked_count": len(blocked), "blocked_scan_ids": sorted(blocked),
              "blocked_reasons": blocked_reasons}


  def consolidate_all(client, kinds=("matches", "scans"), vers=KNOWN_MATCHES_SCHEMA_VERSIONS, dry_run=False,
                      only_scan_ids=None, quiet_secs=DEFAULT_QUIET_SECS,
                      row_ceiling=DEFAULT_ROW_CEILING, abandoned_after_secs=DEFAULT_ABANDONED_SECS,
                      now_ms=None, action_state_for=None, log=print):
      if not dry_run and not acquire_consolidation_lock(client, log=log, now_ms=now_ms):
          return {"consolidated_count": 0, "consolidated_scan_ids": [],
                  "deferred_count": 0, "deferred_scan_ids": [],
                  "failed_count": 0, "failed_scan_ids": [], "failed_reasons": {},
                  "lock_held_by_other_run": True}
      try:
          consolidated, deferred, failed = set(), set(), set()
          failed_reasons = {}
          for ver in vers:
              for kind in kinds:
                  for p in run_consolidation(client, kind, ver=ver, quiet_secs=quiet_secs,
                                             row_ceiling=row_ceiling, dry_run=dry_run, log=log,
                                             now_ms=now_ms, action_state_for=action_state_for,
                                             only_scan_ids=only_scan_ids,
                                             abandoned_after_secs=abandoned_after_secs):
                      sid = p["scan_id"]
                      if p.get("ok"):
                          consolidated.add(sid)
                      elif p.get("reason") in ("host_not_terminal", "within_quiet_period"):
                          deferred.add(sid)
                      else:
                          failed.add(sid)
                          failed_reasons[sid] = p.get("reason")
      finally:
          if not dry_run:
              release_consolidation_lock(client, log=log)
      return {"consolidated_count": len(consolidated), "consolidated_scan_ids": sorted(consolidated),
              "deferred_count": len(deferred), "deferred_scan_ids": sorted(deferred),
              "lock_held_by_other_run": False,
              "failed_count": len(failed), "failed_scan_ids": sorted(failed),
              "failed_reasons": failed_reasons}


  # ============================================================================
  # xdr_data_management.py core logic — verbatim port, same contract as the xdr_consolidate
  # port above: the CLI module is the canonical copy and the one whose functions are unit
  # tested against a fake tenant in tests/test_data_management.py; this copy is held to it by
  # test_pack_data_management_logic_matches_the_cli, which compares both files' ported
  # functions statement-by-statement. See xdr_data_management.py for full comments.
  #
  # One unavoidable deviation, asserted by that test's normaliser: the CLI's
  # filter_unconsolidated does `import xdr_consolidate as C` and calls `C.target_name(...)`.
  # An XSOAR script cannot import a repo module at runtime, and target_name is already part of
  # the port above, so the import is dropped and the `C.` qualifier removed. Nothing else
  # differs.
  #
  # classify_yara_datasets is ported from xdr_action_center.XDRActionCenter's METHOD of the
  # same name (the CLI reaches the classification through its client); it is a plain function
  # here because the pack has no XDRActionCenter. Held to the original behaviourally by
  # test_pack_classify_yara_datasets_matches_xdr_action_center.
  # ============================================================================
  # THESE TWO IMPORTS MUST STAY BELOW `from CommonServerPython import *` (top of file). The real
  # CommonServerPython does `from datetime import datetime, timedelta` and declares no __all__,
  # so the star-import binds the bare name `datetime` to the datetime CLASS. This module needs
  # the MODULE (datetime.date.today(), datetime.date(...)), and only re-importing it after the
  # star-import rebinds the name correctly. Move these up into the file's import block and every
  # month calculation fails on the tenant with AttributeError while the unit tests stay green.
  import datetime
  import os

  PREFIX = _PREFIX   # same literal as xdr_data_management.PREFIX; aliased so NAME_RE ports verbatim

  NAME_RE = re.compile(
      r"^%s_(?P<kind>matches|scans)_v(?P<version>\d+)(?:_(?P<rest>.+))?$" % re.escape(PREFIX)
  )
  # A trailing group that is a PLAUSIBLE YYYYMM (20xx, month 01-12) is the rotation month. A
  # host segment that is itself exactly that shape is indistinguishable from a month - we
  # resolve it as a month, because the worst outcome of that reading is declining to delete
  # something that looks recent, whereas reading it as a host could delete a whole host's
  # history in one call. The year/month RANGE is load-bearing: a bare \d{6} reads "110501" as
  # year 1105 (an age older than every retention window, so the ambiguity resolves towards
  # DELETING) and crashes months_between outright on a HHMMSS tail like "143025". See
  # xdr_data_management.py for the full note.
  MONTH_RE = re.compile(r"^(?:(?P<host>.*?)_)?(?P<month>20\d{2}(?:0[1-9]|1[0-2]))$")

  # Ported from xdr_data_management.DEFAULT_MIN_QUIET_HOURS (which is also its --min-quiet-hours
  # argparse default), and covered by the drift gate. Deliberately generous: the goal is proving
  # no active writer at all, not just outlasting the scanner's drain window.
  DEFAULT_MIN_QUIET_HOURS = 24.0

  # Pack-only floor for the same value. The CLI is run by a human who can see what they typed;
  # an XSOAR argument is a single field on a scheduled Job, and min_quiet_hours=0 does not
  # "relax" rail 6, it DISABLES it - filter_recently_written's `< 0 * 1000` is false for every
  # dataset, including one whose newest row landed a second ago. YaraCleanup floors the value
  # here rather than letting the rail be switched off from the console.
  MIN_ALLOWED_QUIET_HOURS = 1.0

  # The prune path judges ANOTHER run's lock far more conservatively than consolidation does.
  # Consolidation's 2h staleness window exists so a crashed pass cannot park the pipeline
  # forever, and the cost of a wrong takeover there is a redundant merge; here the cost is
  # deleting datasets while a consolidation pass is mid-copy, which is irreversible. This window
  # is set well above any consolidation runtime this repo has measured.
  PRUNE_LOCK_STALE_SECS = 6 * 3600

  # YARA lookup-dataset naming, from xdr_action_center.py (which computes YARA_SCHEMA_VERSION
  # from the YARA_LOOKUP_SCHEMA_VER env var at import). XSOAR containers have no such env var,
  # so the automations pass the version explicitly via set_schema_version().
  YARA_SCHEMA_VERSION = (os.environ.get("YARA_LOOKUP_SCHEMA_VER", "2").strip() or "2")
  YARA_OWNED_RE = re.compile(r"^(yara_scanner_(matches|scans)(_.*)?|yara_(matches|scans)_.*)$")
  CURRENT_RE = re.compile(r"^yara_scanner_(matches|scans)_v%s(_.*)?$" % re.escape(YARA_SCHEMA_VERSION))

  # The value at import, before any set_schema_version() call. An XSOAR docker image is
  # long-lived and serves many automation executions from one process, so a run that passes
  # schema_version would otherwise leave its version set for the NEXT run that passes none.
  # Both automations reset to this explicitly rather than inheriting whatever ran last.
  DEFAULT_SCHEMA_VERSION = YARA_SCHEMA_VERSION


  def set_schema_version(ver):
      """Point the classification at a different current schema version.

      Recomputes exactly what xdr_action_center.py computes at import time from
      YARA_LOOKUP_SCHEMA_VER, and nothing else. os.environ is set too so the ported
      render_report — which reads that same variable for its header line — agrees with the
      classification instead of silently disagreeing with it.

      NON-NUMERIC INPUT IS REFUSED, loudly, rather than accepted. This is a free-text XSOAR
      argument feeding a classification that decides what may be deleted, and a bad value fails
      in the DANGEROUS direction, not the safe one: "v3" makes CURRENT_RE match nothing (so no
      dataset is `current`) and makes cur_ver None (so the `v > cur_ver` newer-guard, rail 4,
      can never fire) — every live dataset on the tenant therefore lands in `legacy`. A caller
      that then passes delete_legacy would be pointed at the entire tenant. Refusing here is the
      only place that distinction can still be made.

      A too-HIGH numeric version has the same shape and cannot be detected from the value alone
      (`2 > 3` is simply False, so live v2 data classifies as legacy) — that one is caught
      downstream instead, by select_legacy_for_deletion's rails and the two live-query rails.

      Consequence worth knowing before changing it: whatever version is NOT current and is
      HIGHER lands in the `newer` bucket, which this tool refuses to delete (rail 4). On a
      tenant already writing v3 shards, leaving this at "2" means YaraCleanup prunes nothing.
      """
      global YARA_SCHEMA_VERSION, CURRENT_RE
      clean = str(ver).strip()
      if not clean.isdigit():
          raise ValueError(
              "schema_version must be a whole number — the scanner's YARA_LOOKUP_SCHEMA_VER, "
              'e.g. "2" or "3" — but got %r. Refusing to continue: a non-numeric version '
              "silently reclassifies every live dataset on the tenant as legacy." % (ver,))
      YARA_SCHEMA_VERSION = clean
      CURRENT_RE = re.compile(r"^yara_scanner_(matches|scans)_v%s(_.*)?$"
                              % re.escape(YARA_SCHEMA_VERSION))
      os.environ["YARA_LOOKUP_SCHEMA_VER"] = YARA_SCHEMA_VERSION


  def classify_yara_datasets(client):
      """Split the tenant's yara-owned LOOKUP datasets into (current, legacy, newer) by schema
      version. legacy = older/unversioned (safe to prune); newer = a HIGHER _vN than we assume,
      which signals this host's YARA_LOOKUP_SCHEMA_VER is stale — so it must NOT be pruned.

      This is safety rail 4: `newer` is never handed to any selection function."""
      cur_ver = int(YARA_SCHEMA_VERSION) if YARA_SCHEMA_VERSION.isdigit() else None
      ver_re = re.compile(r"_v(\d+)(?:_|$)")
      current, legacy, newer = [], [], []
      datasets = client.get_datasets()
      if isinstance(datasets, dict):  # get_datasets can return {"data":[...]} / {"datasets":[...]}
          datasets = datasets.get("data") or datasets.get("datasets") or []
      for d in (datasets or []):
          if not isinstance(d, dict):
              continue
          name = d.get("Dataset Name") or d.get("dataset_name") or ""
          dtype = (d.get("Type") or d.get("dataset_type") or "").upper()
          if dtype != "LOOKUP" or not YARA_OWNED_RE.match(name):
              continue
          if CURRENT_RE.match(name):
              current.append(name)
              continue
          m = ver_re.search(name)
          v = int(m.group(1)) if m else None
          if cur_ver is not None and v is not None and v > cur_ver:
              newer.append(name)  # a version we don't recognize as old — refuse to prune
          else:
              legacy.append(name)
      return sorted(current), sorted(legacy), sorted(newer)


  def parse_dataset_name(name):
      """Parse a dataset name into its parts, or None if it is not YARA-owned.

      Returning None is safety rail 5: anything outside the naming contract can never be a
      deletion candidate, so a bug here cannot reach unrelated tenant data.

      `scan_target` marks a CONSOLIDATED per-scan target (yara_scanner_<kind>_v<N>_scan_<slug>),
      using the same discriminator parse_shard applies in the other direction a few hundred
      lines above. It is not a rotation shard: no month by design, immutable once verified, and
      after consolidation deleted the sources it is the ONLY copy of that scan.
      """
      m = NAME_RE.match(name or "")
      if not m:
          return None
      rest = m.group("rest")
      host, month, scan_target = None, None, False
      if rest:
          if rest == "scan" or rest.startswith("scan_"):
              host, scan_target = rest, True
          else:
              mm = MONTH_RE.match(rest)
              if mm:
                  host = mm.group("host") or None
                  month = mm.group("month")
              else:
                  host = rest
      return {"name": name, "kind": m.group("kind"),
              "version": int(m.group("version")), "host": host, "month": month,
              "scan_target": scan_target}


  def months_between(older_yyyymm, newer_yyyymm):
      """Whole months from older to newer. NEGATIVE if `older` is actually in the future,
      which is how clock skew is detected and refused."""
      o = datetime.date(int(older_yyyymm[:4]), int(older_yyyymm[4:6]), 1)
      n = datetime.date(int(newer_yyyymm[:4]), int(newer_yyyymm[4:6]), 1)
      return (n.year - o.year) * 12 + (n.month - o.month)


  def has_rotated_sibling(name, all_names):
      """Does an unsuffixed dataset have rotated siblings for the same kind+host?

      If yes it is an ABANDONED pre-rotation dataset - rotation was enabled later and
      writes moved to the dated names, so this one is frozen, not growing. If no, the
      deployment is genuinely running CONFIG_LOOKUP_ROTATION="none" and the dataset really
      will grow without bound. The two need opposite advice, and telling someone to enable
      a setting that is already enabled sends them looking in the wrong place.
      """
      prefix = name + "_"
      return any(n != name and n.startswith(prefix) and n[len(prefix):].isdigit()
                 and len(n) - len(prefix) == 6 for n in (all_names or []))


  def select_rotated_for_deletion(current_names, older_than_months, now_yyyymm):
      """Pick rotated datasets older than the window. Returns (candidates, skip_reasons).

      Every safety rail that governs WHAT gets deleted from name alone lives here:
        * the CURRENT month is never a candidate - a scan may be writing to it, and
          delete_dataset mid-scan does not error the scan, it just makes every subsequent
          add_data batch fail with HTTP 400 against a name that no longer exists
        * a FUTURE month is never a candidate - clock skew must not destroy data
        * an UNROTATED dataset is never a candidate - deleting it destroys ALL history for
          that host, not one month: same API call, categorically different blast radius
        * anything outside the naming contract is never a candidate
      """
      candidates, skipped = [], []
      for name in current_names or []:
          info = parse_dataset_name(name)
          if info is None:
              skipped.append("%s: not a YARA dataset name" % name)
              continue
          if info["scan_target"]:
              skipped.append("%s: per-scan consolidated target - consolidation OUTPUT, not a "
                             "rotation shard, and after the source shards were deleted it is "
                             "the only copy of that scan" % name)
              continue
          if not info["month"]:
              if has_rotated_sibling(name, current_names):
                  skipped.append(
                      "%s: abandoned pre-rotation dataset (rotated siblings exist) - "
                      "frozen, not growing" % name)
              else:
                  skipped.append(
                      '%s: not rotated (no YYYYMM) - set CONFIG_LOOKUP_ROTATION="monthly" '
                      "in the scanner so this dataset stops growing" % name)
              continue
          if info["month"] == now_yyyymm:
              skipped.append("%s: current month - a scan may be writing to it" % name)
              continue
          age = months_between(info["month"], now_yyyymm)
          if age < 0:
              skipped.append("%s: dated in the future (clock skew?)" % name)
              continue
          if age <= older_than_months:
              skipped.append("%s: %d month(s) old, inside the %d-month window"
                             % (name, age, older_than_months))
              continue
          candidates.append(name)
      return candidates, skipped


  def filter_recently_written(client, candidates, min_quiet_secs, now_ms, log=print):
      """Drop any candidate whose newest row is younger than min_quiet_secs. Returns
      (survivors, skip_reasons).

      select_rotated_for_deletion's month-label age check has a real gap: the instant the
      calendar rolls to a new month, EVERY prior month's shard looks arbitrarily old regardless
      of actual elapsed wall-clock time since its last write - a scan running late on the last
      day of a month, or pure clock/timezone skew between the scanning endpoint and the machine
      running this prune, can make a shard a scan is STILL WRITING TO look like fair game. This
      asks the question that actually matters - has this shard stopped receiving writes
      recently - instead of inferring liveness from a calendar label. A query error SKIPS
      (keeps) the dataset, the same skip-to-be-safe posture every other rail takes."""
      survivors, skipped = [], []
      for name in candidates:
          try:
              rows = client.xql("dataset = %s | comp max(event_timestamp_ms) as newest" % name, limit=5) or []
              newest = rows[0].get("newest") if rows else None
              newest = int(newest) if newest is not None else None
          except Exception as e:
              skipped.append("%s: could not check recency (%s) - skipping to be safe" % (name, e))
              continue
          if newest is not None and (now_ms - newest) < min_quiet_secs * 1000:
              skipped.append("%s: newest row is only %.1fh old - a scan may still be writing "
                             "to it, skipping despite month age" % (name, (now_ms - newest) / 3_600_000.0))
              continue
          survivors.append(name)
      return survivors, skipped


  def filter_unconsolidated(client, candidates, log=print):
      """Drop any candidate that still holds a scan_id consolidation has not yet fully
      verified into a per-scan target. Returns (survivors, skip_reasons).

      A row_ceiling_exceeded (or otherwise permanently stuck) scan blocks consolidation's OWN
      deletion pass forever (a shard is only deleted once every scan_id it holds is verified) -
      but this prune is a completely separate code path with no knowledge of that. Left
      unchecked, it would eventually delete that shard by month age alone, destroying the one
      and only copy of a scan's data that was never successfully consolidated. A query error
      SKIPS (keeps) the dataset, same skip-to-be-safe posture as every other rail."""
      survivors, skipped = [], []
      for name in candidates:
          info = parse_dataset_name(name)
          if info is None:
              survivors.append(name)  # not a YARA dataset name; not this function's job to gate
              continue
          try:
              rows = client.xql("dataset = %s | comp count() as n by scan_id" % name, limit=10000) or []
          except Exception as e:
              skipped.append("%s: could not check consolidation state (%s) - skipping to be safe" % (name, e))
              continue
          stuck = []
          for r in rows:
              sid, n = r.get("scan_id"), int(r.get("n") or 0)
              if not sid or n <= 0:
                  continue
              target = target_name(info["kind"], str(info["version"]), sid)
              try:
                  tcount_rows = client.xql("dataset = %s | comp count() as n" % target, limit=5) or []
                  tcount = int(tcount_rows[0].get("n", 0)) if tcount_rows else 0
              except Exception:
                  tcount = -1  # target doesn't exist or errored - definitely not verified
              if tcount != n:
                  stuck.append(sid)
          if stuck:
              skipped.append("%s: still holds unconsolidated scan(s) %s (row_ceiling_exceeded, "
                             "count_mismatch, or simply never run) - skipping, would lose data"
                             % (name, ", ".join(stuck[:5])))
              continue
          survivors.append(name)
      return survivors, skipped


  def select_legacy_for_deletion(legacy_names, newer_names=(), now_yyyymm=None):
      """Legacy = older/unversioned schema, already classified by the toolkit. Returns
      (candidates, skip_reasons) — the same shape as select_rotated_for_deletion, because the
      same name-derived rails apply here.

      The 'newer' bucket is deliberately NOT accepted by this function: a host running a stale
      YARA_LOOKUP_SCHEMA_VER must never delete a future schema's data.

      "Legacy" is only ever as trustworthy as the assumed current schema version, and in this
      pack that is a single free-text XSOAR argument. Set it one version too HIGH — a typo, or a
      version bumped in the playbook ahead of the fleet rollout — and every live, actively-
      written dataset reclassifies as legacy. So the classification alone is not allowed to
      authorise a delete; see xdr_data_management.py for the full rail-by-rail reasoning.

      Callers must still run the survivors through filter_recently_written and
      filter_unconsolidated — those two are the only rails that can see an endpoint STILL
      WRITING to a dataset whose name says it is ancient.
      """
      if newer_names:
          return [], ["refusing blanket legacy deletion: %d dataset(s) are on a NEWER schema "
                      "version (%s) - the assumed current version is stale, so this 'legacy' "
                      "classification cannot be trusted"
                      % (len(newer_names), ", ".join(sorted(newer_names)[:5]))]
      candidates, skipped = [], []
      for name in legacy_names or []:
          info = parse_dataset_name(name)
          # The rails below must NOT be conditional on info being parseable. parse_dataset_name
          # requires the _vN segment, and the oldest legacy names predate it entirely
          # ("yara_scanner_scans_hostA"), so gating on `info is not None` silently exempted
          # exactly the least replaceable data: an unversioned, unsuffixed dataset holding ALL
          # of a host's pre-rotation history fell straight through to the delete list, while its
          # versioned sibling ("..._v1_hostA") was correctly protected. Derive the two facts the
          # rails actually need — is it a per-scan target, and does it carry a month suffix —
          # from the name itself when the full contract will not parse.
          if info is not None:
              is_scan_target, month = info["scan_target"], info["month"]
          elif str(name).startswith(PREFIX + "_"):
              # Inside the yara_scanner_* contract but missing the _vN segment: still a shard
              # whose shape we can read, so the rails apply.
              is_scan_target = "_scan_" in name
              m = MONTH_RE.match(name.rsplit("_", 1)[-1]) if "_" in name else None
              month = m.group("month") if m else None
          else:
              # Genuinely pre-contract naming (no yara_scanner_ prefix at all). We cannot read
              # its shape, so we deliberately do NOT infer an unsuffixed-ness we can't verify —
              # that would make --delete-legacy vacuous for the oldest data it exists to remove.
              # filter_recently_written and filter_unconsolidated run after this and remain the
              # last line of defence for these.
              candidates.append(name)
              continue

          if is_scan_target:
              skipped.append("%s: per-scan consolidated target - consolidation OUTPUT, not a "
                             "legacy leftover" % name)
              continue
          if not month:
              skipped.append("%s: unsuffixed - holds ALL pre-rotation history for that host, "
                             "so it is never a blanket candidate; delete it by name if you "
                             "really want the space" % name)
              continue
          if now_yyyymm:
              if month == now_yyyymm:
                  skipped.append("%s: current month - a scan may be writing to it" % name)
                  continue
              if months_between(month, now_yyyymm) < 0:
                  skipped.append("%s: dated in the future (clock skew?)" % name)
                  continue
          candidates.append(name)
      return candidates, skipped


  def render_report(current, legacy, newer, now_yyyymm):
      """Human-readable inventory. Ages are whole months."""
      schema = os.environ.get("YARA_LOOKUP_SCHEMA_VER", "2")
      lines = ["YARA lookup datasets (schema v%s current, now %s)" % (schema, now_yyyymm), ""]
      lines.append("%-52s %-8s %-14s %6s" % ("dataset", "kind", "host", "age"))
      lines.append("-" * 84)
      unrotated, abandoned, consolidated = [], [], []
      for name in current:
          info = parse_dataset_name(name)
          if info is None:
              lines.append("%-52s %s" % (name[:52], "(unrecognised - never a candidate)"))
              continue
          if info["scan_target"]:
              age = "scan"
              consolidated.append(name)
          elif info["month"]:
              age = "%dmo" % months_between(info["month"], now_yyyymm)
          else:
              age = "frozen" if has_rotated_sibling(name, current) else "n/a"
              (abandoned if age == "frozen" else unrotated).append(name)
          lines.append("%-52s %-8s %-14s %6s"
                       % (name[:52], info["kind"], (info["host"] or "-")[:14], age))
      if not current:
          lines.append("(none)")
      if legacy:
          lines += ["", "legacy schema (deletable with --delete-legacy):"]
          lines += ["  " + n for n in legacy]
      if newer:
          lines += ["", "NEWER schema - never deleted by this tool. Your "
                        "YARA_LOOKUP_SCHEMA_VER may be stale:"]
          lines += ["  " + n for n in newer]
      if consolidated:
          lines += [
              "",
              "%d dataset(s) are per-scan CONSOLIDATED TARGETS (…_scan_<id>). They are"
              % len(consolidated),
              "      consolidation OUTPUT: unrotated by design, finished, not growing, and",
              "      often a scan's only surviving copy. Never a cleanup candidate.",
          ]
      if abandoned:
          lines += [
              "",
              "NOTE: %d dataset(s) predate rotation (rotated siblings exist for the same"
              % len(abandoned),
              "      host). They are frozen, not growing - writes moved to the dated names.",
              "      This tool will not delete them: an unsuffixed dataset holds ALL",
              "      pre-rotation history for that host, so removing one is a bigger",
              "      decision than dropping a month. Delete manually if you want the space.",
          ]
      if unrotated:
          lines += [
              "",
              "WARNING: %d dataset(s) are NOT rotated and will grow without bound."
              % len(unrotated),
              "         add_data merge time scales with dataset SIZE, so these eventually",
              "         exceed any client timeout and go write-dead. Set",
              '         CONFIG_LOOKUP_ROTATION="monthly" in the scanner.',
              "         This tool deletes whole datasets only and will not touch them.",
          ]
      return "\n".join(lines)


  # ---- cleanup run-log --------------------------------------------------------
  # YaraCleanup's own marker dataset, deliberately NOT yara_scanner_consolidation_runs: that
  # schema and its status vocabulary describe a consolidation pass, and — worse — the
  # Consolidation Run Health widget reads "a row in the last ~24h" as proof the twice-daily
  # merge Job is alive, so a cleanup row there would mask a dead merge Job.
  #
  # It still needs a durable record of its own. A War Room entry and XSOAR investigation context
  # are per-run and not queryable across runs, so without this there is no way to answer "which
  # datasets did we prune last month, and why were the rest kept" — for the one automation in
  # this pack whose action cannot be undone.
  _CLEANUP_RUNS_DATASET = "yara_scanner_cleanup_runs"
  _CLEANUP_RUNS_SCHEMA = {
      "run_ts_ms": "number", "mode": "text", "schema_version": "text",
      "older_than_months": "number", "delete_legacy": "text", "min_quiet_hours": "number",
      "selected_count": "number", "deleted_count": "number", "failed_count": "number",
      "skipped_count": "number", "deleted": "text", "skipped_reasons": "text",
      "lock_taken_over": "text",
  }


  def record_cleanup_run(client, result, now_ms=None, log=print):
      """Best-effort: write ONE row per EXECUTED prune pass. Same contract as
      record_consolidation_run — a failure to write this row must never mask or replace the
      run's real outcome, which is why every exception is caught and only logged."""
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)
      otm = result.get("older_than_months")
      row = {
          "run_ts_ms": now_ms,
          "mode": "dry_run" if result.get("dry_run") else "executed",
          "schema_version": str(result.get("schema_version", "")),
          # -1, not null: "no retention window was given" is a distinct, meaningful state and a
          # numeric column cannot carry None on this API.
          "older_than_months": int(otm) if otm is not None else -1,
          "delete_legacy": str(bool(result.get("delete_legacy"))),
          "min_quiet_hours": float(result.get("min_quiet_hours") or 0),
          "selected_count": int(result.get("selected_count", 0) or 0),
          "deleted_count": int(result.get("deleted_count", 0) or 0),
          "failed_count": int(result.get("failed_count", 0) or 0),
          "skipped_count": int(result.get("skipped_count", 0) or 0),
          "deleted": json.dumps(result.get("deleted", []))[:4000],
          "skipped_reasons": json.dumps(result.get("skipped", []))[:8000],
          "lock_taken_over": str(bool(result.get("lock_taken_over"))),
      }
      try:
          client.create_lookup_dataset(_CLEANUP_RUNS_DATASET, _CLEANUP_RUNS_SCHEMA)
          client.add_lookup_data(_CLEANUP_RUNS_DATASET, [row])
      except Exception as e:
          log("could not record cleanup run outcome: %s" % e)


  # ---- orchestration for the two automations (the pack's equivalent of the CLI's main()
  # wiring of the --report / --older-than-months / --delete-legacy paths) ----

  def report_datasets(client, now_yyyymm=None):
      """READ-ONLY inventory of every yara_scanner_* lookup dataset. Never writes or deletes,
      and issues exactly one API call (the dataset listing) — safe to run any time, including
      from a poll loop.

      Returns the CLI's rendered text under "report" plus the same information structured for
      XSOAR context, including the two conditions render_report distinguishes:
        frozen      — unsuffixed but rotated siblings exist: a pre-rotation leftover, frozen
        not_rotated — unsuffixed with NO rotated siblings: rotation is genuinely off for that
                      deployment and the dataset will grow without bound
      They need opposite advice, which is why they are separate buckets and not one count.

      A third state, `consolidated`, keeps this pack's OWN output out of both. A per-scan target
      (…_v<N>_scan_<slug>) is unsuffixed too, but it is finished, immutable and unrotated by
      design — filing it under not_rotated would tell the operator to change a scanner setting
      that is already correct, and on a tenant with hundreds of consolidated scans it would bury
      the one genuinely-unrotated per-host dataset this bucket exists to surface.
      """
      now_yyyymm = now_yyyymm or datetime.date.today().strftime("%Y%m")
      current, legacy, newer = classify_yara_datasets(client)
      datasets, frozen, not_rotated, consolidated = [], [], [], []
      for name in current:
          info = parse_dataset_name(name)
          if info is None:
              datasets.append({"name": name, "kind": "", "host": "", "month": "",
                               "age_months": None, "state": "unrecognised"})
              continue
          if info["scan_target"]:
              state, age = "consolidated", None
              consolidated.append(name)
          elif info["month"]:
              state, age = "rotated", months_between(info["month"], now_yyyymm)
          else:
              age = None
              if has_rotated_sibling(name, current):
                  state = "frozen"
                  frozen.append(name)
              else:
                  state = "not_rotated"
                  not_rotated.append(name)
          datasets.append({"name": name, "kind": info["kind"], "host": info["host"] or "",
                           "month": info["month"] or "", "age_months": age, "state": state})
      return {
          "now_yyyymm": now_yyyymm,
          "schema_version": YARA_SCHEMA_VERSION,
          "report": render_report(current, legacy, newer, now_yyyymm),
          "datasets": datasets,
          "current_count": len(current),
          "frozen": frozen, "frozen_count": len(frozen),
          "not_rotated": not_rotated, "not_rotated_count": len(not_rotated),
          "consolidated": consolidated, "consolidated_count": len(consolidated),
          "legacy": legacy, "legacy_count": len(legacy),
          "newer": newer, "newer_count": len(newer),
      }


  def _live_rails(client, names, min_quiet_hours, now_ms, log):
      """Rails 6 and 7 — the only two that need live tenant queries, and the only two that can
      see an endpoint still WRITING to a dataset whose name says it is ancient. Both fail closed
      (a query error keeps the dataset). Applied identically to the rotated and the legacy
      candidate lists: a name-derived classification is never on its own enough to delete."""
      names, s1 = filter_recently_written(client, names, min_quiet_hours * 3600, now_ms, log=log)
      names, s2 = filter_unconsolidated(client, names, log=log)
      return names, s1 + s2


  def prune_datasets(client, older_than_months=None, delete_legacy=False,
                     min_quiet_hours=DEFAULT_MIN_QUIET_HOURS, force=False, execute=False,
                     now_ms=None, now_yyyymm=None, log=print, holder="YaraCleanup"):
      """Retention pruning: DELETES WHOLE DATASETS when execute is True.

      Ports xdr_data_management.main()'s deletion path, with the CLI's --yes inverted into
      `execute` so the default is a dry run — an operator who runs this with no opt-in reports
      what WOULD go and loses nothing.

      Four properties this function is required to have, all covered by tests:

      * No threshold, no legacy flag -> nothing happens, and it says so (the CLI gives
        --older-than-months no default on purpose so a bare invocation cannot delete). It
        returns before making any API call at all.
      * A real deletion pass takes the consolidation lock BEFORE evaluating the rails, and
        releases it in a finally. Pruning and consolidation mutate the same shards, and rails
        6/7 are point-in-time checks — a consolidation pass starting between the checks and the
        deletes would race them. A DRY RUN never takes the lock: it mutates nothing and must
        stay safe to run concurrently with anything. Because a wrong takeover here is
        irreversible (unlike consolidation, where it costs a redundant merge), this caller
        treats an unreadable lock row as HELD and judges staleness on a much longer window.
      * EVERY delete candidate passes the same rails, on both the age path and the legacy path.
        `legacy` is a derived classification that trusts a single free-text version argument;
        only the live rails can tell "these really are old-schema leftovers" from "my assumed
        version is one too high, so the whole live tenant now looks legacy".
      * Every skipped candidate's reason is returned — including the buckets that were never
        candidates at all (`newer` always, `legacy` when delete_legacy is false). A dataset
        silently not deleted is indistinguishable from a bug, and "0 selected, 0 skipped" must
        never be the report for "rail 4 vetoed the entire tenant".
      """
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)
      now_yyyymm = now_yyyymm or datetime.date.today().strftime("%Y%m")
      result = {
          "dry_run": not execute,
          "nothing_requested": False,
          "lock_held_by_other_run": False,
          "lock_taken_over": False,
          "lock_takeover_reason": "",
          "older_than_months": older_than_months,
          "delete_legacy": bool(delete_legacy),
          "min_quiet_hours": float(min_quiet_hours),
          "schema_version": YARA_SCHEMA_VERSION,
          "selected": [], "selected_count": 0,
          "deleted": [], "deleted_count": 0,
          "failed": [], "failed_count": 0,
          "skipped": [], "skipped_count": 0,
          "newer": [], "newer_count": 0,
      }

      if older_than_months is None and not delete_legacy:
          result["nothing_requested"] = True
          log("no retention window (older_than_months) and delete_legacy is false — nothing "
              "selected, nothing deleted")
          return result

      takeovers = []
      if execute and not acquire_consolidation_lock(
              client, log=log, now_ms=now_ms, holder=holder,
              stale_after_secs=PRUNE_LOCK_STALE_SECS, unreadable_is_held=True,
              on_takeover=takeovers.append):
          result["lock_held_by_other_run"] = True
          log("consolidation lock is held by another run — deleting nothing this pass")
          return result
      if takeovers:
          # Reported, never silent: this pass proceeded while another run's lock marker was in
          # place. Bounded risk (rail 7 usually mismatches while a merge is mid-copy) but the
          # operator must be able to tell this run apart from an uncontended one.
          result["lock_taken_over"] = True
          result["lock_takeover_reason"] = takeovers[0]

      try:
          current, legacy, newer = classify_yara_datasets(client)   # rail 4 lives here
          targets, skipped = [], []
          result["newer"], result["newer_count"] = newer, len(newer)
          for n in newer:
              skipped.append("%s: NEWER schema version than this code understands - never "
                             "pruned (rail 4); if that is unexpected, the schema_version "
                             "argument (currently v%s) is stale" % (n, YARA_SCHEMA_VERSION))
          if older_than_months is not None:
              t, s = select_rotated_for_deletion(current, older_than_months, now_yyyymm)
              skipped += s
              t, s2 = _live_rails(client, t, min_quiet_hours, now_ms, log)
              skipped += s2
              targets += t
          if delete_legacy:
              t, s = select_legacy_for_deletion(legacy, newer, now_yyyymm)
              skipped += s
              t, s2 = _live_rails(client, t, min_quiet_hours, now_ms, log)
              skipped += s2
              targets += t
          else:
              for n in legacy:
                  skipped.append("%s: legacy schema, but delete_legacy was not set" % n)

          result["selected"] = targets
          result["selected_count"] = len(targets)
          result["skipped"] = skipped
          result["skipped_count"] = len(skipped)
          for s in skipped:
              log("  skip  %s" % s)

          if not execute:
              log("DRY RUN — %d dataset(s) would be deleted, nothing touched" % len(targets))
              return result

          for name in targets:
              try:
                  client.delete_dataset(name, force=force)
                  result["deleted"].append(name)
                  log("  deleted %s" % name)
              except Exception as e:
                  # Continue: one dataset with dependencies must not strand the whole cleanup.
                  result["failed"].append({"dataset": name, "error": str(e)[:200]})
                  log("  FAILED  %s: %s" % (name, e))
          result["deleted_count"] = len(result["deleted"])
          result["failed_count"] = len(result["failed"])
          record_cleanup_run(client, result, now_ms=now_ms, log=log)
          return result
      finally:
          if execute:
              release_consolidation_lock(client, log=log)


  # ============================================================================
  # In-platform client: reaches this tenant's own public API directly over HTTPS with
  # signed Advanced (HMAC) credentials.
  #
  # The original design called the tenant's own API through the Cortex Core - IR
  # integration's generic REST bridge (demisto-api-post / core-api-post), avoiding a
  # separate embedded credential. Measured live against this tenant, 2026-08-10: NEITHER
  # command is registered here at all (automation/search for *api*/*core* returns zero
  # results) - a real platform gap on this specific Cortex XDR tenant, not a wording or
  # fallback bug. There is no generic REST bridge available to call through.
  #
  # Falls back to the SAME pattern xdr_yara_scanner.py already uses for the same problem
  # (a script needing tenant credentials without a bridge available): placeholder
  # constants substituted with real values before upload, never committed filled-in.
  # Auth logic (HMAC signing) ported verbatim from xdr_action_center.py's
  # XDRActionCenter._advanced_headers - the already-live-verified reference for this
  # tenant, used throughout this whole repo's live validation.
  # ============================================================================
  DEFAULT_XDR_API_KEY = "replace_with_xdr_advanced_api_key"
  DEFAULT_XDR_API_ID = "replace_with_xdr_advanced_api_id"
  DEFAULT_XDR_API_URL = "replace_with_xdr_api_url"


  class CoreApiClient:
      """xdr_consolidate's duck-typed client interface, backed by a direct, signed HTTPS
      call to this tenant's own public API (see module-level note above for why - no
      generic REST bridge command is registered on this tenant)."""

      def __init__(self, poll_secs=3, max_polls=60):
          self.poll_secs = poll_secs
          self.max_polls = max_polls
          self.base = DEFAULT_XDR_API_URL.rstrip("/")
          if "/public_api" in self.base:
              self.base = self.base[:self.base.index("/public_api")]
          if self.base.startswith("replace_with"):
              raise RuntimeError("XDR API credentials are not set - edit the three "
                                 "DEFAULT_XDR_* constants and re-upload.")

      def _headers(self):
          import hashlib
          import os
          nonce = os.urandom(32).hex()
          ts = str(int(time.time() * 1000))
          sig = hashlib.sha256((DEFAULT_XDR_API_KEY + nonce + ts).encode()).hexdigest()
          return {"x-xdr-timestamp": ts, "x-xdr-nonce": nonce,
                  "x-xdr-auth-id": str(DEFAULT_XDR_API_ID), "Authorization": sig,
                  "Content-Type": "application/json"}

      def _post(self, uri, body, timeout=90):
          import requests
          r = requests.post(self.base + uri, headers=self._headers(), json=body, timeout=timeout)
          try:
              data = r.json()
          except Exception:
              data = {"_raw": r.text}
          if r.status_code != 200:
              raise RuntimeError("%s HTTP %d: %s" % (uri, r.status_code, json.dumps(data)[:400]))
          return data

      def xql(self, query, limit=1000):
          started = self._post("/public_api/v1/xql/start_xql_query/", {"request_data": {"query": query}})
          qid = started.get("reply", started) if isinstance(started, dict) else started
          if isinstance(qid, dict):
              qid = qid.get("query_id") or qid.get("reply") or qid
          for _ in range(self.max_polls):
              data = self._post("/public_api/v1/xql/get_query_results/",
                                {"request_data": {"query_id": qid, "pending_flag": True,
                                                  "limit": limit, "format": "json"}})
              reply = data.get("reply", data) if isinstance(data, dict) else data
              status = reply.get("status") if isinstance(reply, dict) else None
              if status and status != "PENDING":
                  if status != "SUCCESS":
                      raise RuntimeError("XQL %s: %s" % (status, json.dumps(reply)[:400]))
                  results = reply.get("results", {})
                  if isinstance(results, dict) and "data" in results:
                      rows = results["data"]
                      return rows if isinstance(rows, list) else []
                  if isinstance(results, dict) and results.get("stream_id"):
                      return self._xql_stream(qid, results["stream_id"])
                  return results if isinstance(results, list) else []
              time.sleep(self.poll_secs)
          raise RuntimeError("XQL timed out")

      def _xql_stream(self, query_id, stream_id):
          data = self._post("/public_api/v1/xql/get_query_results_stream/",
                            {"request_data": {"query_id": query_id, "stream_id": stream_id,
                                              "is_gzip_compressed": False}})
          raw = data.get("_raw") if isinstance(data, dict) else None
          if raw is None:
              return data if isinstance(data, list) else []
          rows = []
          for line in raw.splitlines():
              line = line.strip()
              if line:
                  rows.append(json.loads(line))
          return rows

      def get_datasets(self):
          data = self._post("/public_api/v1/xql/get_datasets/", {"request": {}})
          return data.get("reply", data) if isinstance(data, dict) else data

      def create_lookup_dataset(self, dataset_name, schema):
          try:
              data = self._post("/public_api/v1/xql/add_dataset/",
                                {"request": {"dataset_name": dataset_name, "dataset_type": "lookup",
                                            "dataset_schema": schema}})
              return data.get("reply", data) if isinstance(data, dict) else data
          except RuntimeError as e:
              if "already exists" in str(e).lower():
                  return {"status": "exists"}
              raise

      def add_lookup_data(self, dataset_name, rows, create_lag_retries=6):
          last = None
          for attempt in range(create_lag_retries):
              try:
                  data = self._post("/public_api/v1/xql/lookups/add_data/",
                                    {"request": {"dataset_name": dataset_name, "data": list(rows)}})
                  return data.get("reply", data) if isinstance(data, dict) else data
              except RuntimeError as e:
                  msg = str(e)
                  if "HTTP 401" in msg:
                      # A rotated/expired/revoked key will not fix itself between retries —
                      # fail fast instead of burning 3 pointless 3/6/9s sleeps first (#47).
                      raise
                  msg = msg.lower()
                  if ("no schema" in msg or "not found" in msg) and attempt < create_lag_retries - 1:
                      last = e
                      time.sleep(3 * (attempt + 1))
                      continue
                  raise
          raise last

      def remove_lookup_data(self, dataset_name, filters):
          """Remove rows matching filter blocks (OR across blocks, AND within a block; EXACT
          values only). NOT concurrency-safe - the caller must serialize. Returns {'deleted': N}."""
          data = self._post("/public_api/v1/xql/lookups/remove_data/",
                            {"request": {"dataset_name": dataset_name, "filters": filters}}, timeout=200)
          return data.get("reply", data) if isinstance(data, dict) else data

      def delete_dataset(self, dataset_name, force=False, retries=3):
          last = None
          for attempt in range(retries):
              try:
                  data = self._post("/public_api/v2/xql/delete_dataset/",
                                    {"request": {"dataset_name": dataset_name, "force": bool(force)}})
                  return data.get("reply", data) if isinstance(data, dict) else data
              except Exception as e:
                  last = e
                  if "HTTP 401" in str(e):
                      # Same reasoning as add_lookup_data (#47): a dead key won't recover
                      # across retries, so fail on the first call instead of 3x 5/10/15s sleeps.
                      raise
                  msg = str(e).lower()
                  if "not found" in msg or "nonetype" in msg:
                      return {"status": "already_deleted"}
                  time.sleep(5 * (attempt + 1))
          raise last


  # ============================================================================
  # YaraCleanup entry point
  # ============================================================================
  def _flag(args, name):
      """A boolean argument XSOAR may deliver as an absent key, an empty string, or a string.

      Absent/empty is False — that is what makes `execute` a dry run by default. Anything else
      goes through argToBoolean, so an unrecognised value RAISES rather than being quietly read
      as either truth value; main() turns that into a return_error naming the argument.
      """
      value = args.get(name)
      if value is None or value == "":
          return False
      return argToBoolean(value)


  def main():
      args = demisto.args()
      notes = []

      # All argument coercion lives inside a try: on a destructive automation a mistyped
      # argument must produce this script's own message ("nothing was deleted"), not a raw
      # traceback that leaves the operator guessing which argument was rejected.
      try:
          # Always set the version explicitly, even when the caller passed none. An XSOAR docker
          # image serves many executions from one process, and set_schema_version mutates a
          # module global plus os.environ — without this reset a run that passed schema_version
          # would silently decide the scope of the NEXT run that passed none.
          set_schema_version(args.get("schema_version") or DEFAULT_SCHEMA_VERSION)

          older_than_months = args.get("older_than_months")
          older_than_months = int(older_than_months) if older_than_months not in (None, "") else None
          if older_than_months is not None and older_than_months < 0:
              notes.append("older_than_months was negative ({}); clamped to 0. A negative window "
                           "means nothing beyond 0 (\"every month before the current one\") and "
                           "would leave rails 1 and 2 as the only thing standing between the "
                           "prune and a live shard.".format(args.get("older_than_months")))
              older_than_months = 0

          min_quiet_hours = args.get("min_quiet_hours")
          min_quiet_hours = (float(min_quiet_hours) if min_quiet_hours not in (None, "")
                             else DEFAULT_MIN_QUIET_HOURS)
          if min_quiet_hours < MIN_ALLOWED_QUIET_HOURS:
              # 0 (or a negative) does not relax rail 6, it switches it off entirely: the
              # comparison `(now - newest) < 0` is false even for a row written a second ago.
              notes.append("min_quiet_hours was {} — below the {}h floor, which would DISABLE the "
                           "recency rail rather than relax it. Raised to {}h for this run."
                           .format(args.get("min_quiet_hours"), MIN_ALLOWED_QUIET_HOURS,
                                   MIN_ALLOWED_QUIET_HOURS))
              min_quiet_hours = MIN_ALLOWED_QUIET_HOURS

          kwargs = {
              "older_than_months": older_than_months,
              "delete_legacy": _flag(args, "delete_legacy"),
              "min_quiet_hours": min_quiet_hours,
              "force": _flag(args, "force"),
              # The opt-in. Absent -> False -> dry run: nothing is deleted.
              "execute": _flag(args, "execute"),
          }
      except Exception as ex:
          # Context is cleared on the failure path too: a crashed destructive run must not leave
          # a PREVIOUS run's Yara.Cleanup.deleted list in context for a downstream task to read
          # as this run's outcome.
          demisto.executeCommand("DeleteContext", {"key": "Yara.Cleanup"})
          return_error("YaraCleanup: invalid argument ({}). Nothing was deleted.".format(ex))
          return

      log_lines = []
      try:
          result = prune_datasets(CoreApiClient(), log=lambda m: log_lines.append(m), **kwargs)
      except Exception as ex:
          demisto.executeCommand("DeleteContext", {"key": "Yara.Cleanup"})
          return_error("YaraCleanup failed: {}".format(ex))
          return

      if result["nothing_requested"]:
          lines = ["Nothing selected and nothing deleted: no retention window was given "
                   "(older_than_months) and delete_legacy is false. This automation has no "
                   "default window on purpose — a bare invocation must never delete."]
      elif result["lock_held_by_other_run"]:
          lines = ["Skipped this pass — the consolidation lock is held by another concurrent "
                   "run (YaraConsolidateApply, the CLI, or another Job execution). Nothing "
                   "was deleted. Pruning and consolidation mutate the same shards, so this "
                   "run stands down rather than race it."]
      elif result["dry_run"]:
          lines = ["DRY RUN — nothing was deleted. {} dataset(s) WOULD be deleted; re-run with "
                   "execute=true to apply.".format(result["selected_count"])]
          lines += ["  would delete  {}".format(n) for n in result["selected"]]
      else:
          lines = ["EXECUTED — {} dataset(s) deleted, {} failed.".format(
              result["deleted_count"], result["failed_count"])]
          lines += ["  deleted  {}".format(n) for n in result["deleted"]]
          lines += ["  FAILED   {}: {}".format(f["dataset"], f["error"]) for f in result["failed"]]

      # The scope this run actually ran with. schema_version decides whether the run had any
      # scope at all, and min_quiet_hours is rail 6's threshold — both belong in the record.
      lines.append("scope: schema v{}, window={}, delete_legacy={}, min_quiet_hours={}".format(
          result["schema_version"],
          "none" if result["older_than_months"] is None else result["older_than_months"],
          result["delete_legacy"], result["min_quiet_hours"]))
      lines += ["NOTE: {}".format(n) for n in notes]

      if result.get("lock_taken_over"):
          lines.append("WARNING: another run's consolidation lock marker was present and this "
                       "pass TOOK IT OVER as stale ({}). If a consolidation pass was in fact "
                       "still running, its shards were pruned concurrently."
                       .format(result.get("lock_takeover_reason", "")))

      # Every skipped candidate's reason, in full and uncapped: a dataset silently not deleted
      # is indistinguishable from a bug, and this entry is the run's audit trail.
      if result["skipped"]:
          lines.append("")
          lines.append("{} candidate(s) kept, with reason:".format(result["skipped_count"]))
          lines += ["  skip  {}".format(s) for s in result["skipped"]]

      # Lock events (takeover, failed release) exist ONLY in the library's log, not in the
      # structured result — and on this automation they are the difference between a routine
      # pass and one that ran alongside a consolidation.
      lock_log = [m for m in log_lines if "lock" in m.lower()]
      if lock_log:
          lines.append("")
          lines.append("lock events:")
          lines += ["  {}".format(m) for m in lock_log]

      # Same context-accumulation risk as YaraConsolidateStatus (see its comment) - clear
      # before writing so selected/deleted/skipped never carry entries from a prior call.
      demisto.executeCommand("DeleteContext", {"key": "Yara.Cleanup"})

      return_results(CommandResults(
          readable_output="\n".join(lines),
          outputs_prefix="Yara.Cleanup",
          outputs=result,
          raw_response=result,
      ))


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()
