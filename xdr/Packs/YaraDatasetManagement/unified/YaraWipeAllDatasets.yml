script: |
  """YaraWipeAllDatasets - deletes EVERY yara_scanner_* lookup dataset on this tenant. No
  scoping, no rules, no exceptions for schema version or dataset kind.

  NOT part of any playbook. This exists for one job: resetting a tenant to a clean slate
  before a test cycle, run by hand from the Playground or War Room when an operator
  deliberately wants zero YARA data left on the tenant. Nothing in this pack ever calls it,
  and it should stay that way.

  This is the one automation in the pack that recognises none of the other five's safety
  rails. YaraCleanup will never delete a live matches dataset or a per-scan consolidated
  target; YaraConsolidateApply is permanently blocked from consuming a live v4 matches
  dataset. Those protections exist because that data is normally irreplaceable. This script
  targets every yara_scanner_* LOOKUP dataset unconditionally — host matches and scan
  lifecycle, old schema and new, per-scan consolidated targets and summary datasets alike.
  The only things it does not delete are the pack's own audit trails (this script's
  own included) and the consolidation lock, which it manages itself around the run.

  DRY RUN BY DEFAULT, same convention as every destructive automation in this pack: without
  execute=true this only reports what it would delete. Because there is no scoping argument
  here at all — no older_than_months, no host filter, no schema check — execute=true alone
  would be one accidental click away from wiping a tenant. So execute=true additionally
  requires confirm to equal the exact phrase below; get it wrong and nothing is deleted no
  matter what execute says.

  This script does not check whether any scan is currently in progress on the tenant. That
  is a deliberate simplification, not an oversight: any such check is inherently racy (a scan
  can start the instant after it runs), and the entire point of this tool is an operator
  choosing, on purpose, to remove everything. Confirm no scan is running before you use it.

  ARGUMENTS
    execute  THE DELETION OPT-IN. Leave false (the default) for a dry run. true, combined
             with a correct confirm phrase, deletes every yara_scanner_* dataset on the
             tenant except this pack's own run-log datasets and the consolidation lock.
    confirm  Required when execute=true. Must equal, exactly and case-sensitively:
             DELETE ALL YARA DATASETS
  """

  # ############################################################################
  # #  CONFIGURATION - the only values in this file you need to edit.          #
  # ############################################################################
  # Cortex XDR API credentials, security level ADVANCED
  # (Settings > Configurations > API Keys). Fill all three in before uploading this
  # script; until the URL is replaced every run fails immediately and does nothing.
  DEFAULT_XDR_API_KEY = "replace_with_xdr_advanced_api_key"   # the API key secret
  DEFAULT_XDR_API_ID = "replace_with_xdr_advanced_api_id"     # that key's numeric ID
  # Tenant API base URL, https://api-<tenant>.xdr.<region>.paloaltonetworks.com
  DEFAULT_XDR_API_URL = "replace_with_xdr_api_url"

  # The literal phrase execute=true must be paired with. Deliberately not a boolean second
  # flag - a typo in a free-text field is a much stronger signal of "I meant to type this"
  # than a second checkbox someone learns to tick reflexively alongside the first.
  CONFIRM_PHRASE = "DELETE ALL YARA DATASETS"
  # ############################################################################

  # ============================================================================
  # INLINED LIBRARY - carried in-file so this automation imports nothing, matching every
  # other script in this pack. Deliberately NOT the full matches/scans consolidation/
  # classification machinery those carry: this script never calls any of it (it has no
  # selection rules to apply), and leaving it out keeps this file short enough that "what
  # does this actually do" is answerable by reading it top to bottom - which matters more
  # here than on any sibling, given what it does. The pieces below (CoreApiClient, the
  # consolidation lock pair) are copied verbatim from xdr_consolidate.py so auth and lock
  # behaviour match every sibling automation exactly.
  # ============================================================================
  import json
  import threading
  import time

  _PREFIX = "yara_scanner"

  # Same dataset, same schema, same semantics as xdr_consolidate.py's lock - taking it here
  # stops this script racing YaraConsolidateApply/YaraCleanup/another wipe over the same
  # datasets. Copied verbatim; do not let this drift from the canonical source.
  _LOCK_DATASET = "yara_scanner_consolidation_lock"
  _LOCK_SCHEMA = {"holder": "text", "started_ms": "number"}
  DEFAULT_LOCK_STALE_SECS = 20 * 60

  # This script's own audit trail.
  _WIPE_RUNS_DATASET = "yara_scanner_wipe_runs"
  _WIPE_RUNS_SCHEMA = {
      "run_ts_ms": "number", "mode": "text", "total_found": "number",
      "to_delete_count": "number", "deleted_count": "number", "failed_count": "number",
      "deleted": "text", "failed": "text", "preserved": "text",
  }

  # Never deleted, regardless of how they reach the candidate list: the three run-logs this
  # pack's automations keep (including this script's own) are audit trail, not scan data -
  # deleting the record of a wipe defeats the reason it exists - and the lock dataset is
  # transient, managed by acquire/release around this run, not a wipe target.
  PRESERVED_DATASETS = frozenset({
      _LOCK_DATASET,
      "yara_scanner_consolidation_runs",
      "yara_scanner_cleanup_runs",
      _WIPE_RUNS_DATASET,
  })

  DELETE_CONCURRENCY = 12   # parallel delete_dataset calls, same bound every sibling uses


  def _read_lock(client):
      rows = client.xql("dataset = %s" % _LOCK_DATASET, limit=5) or []
      if not rows:
          return None
      ts = rows[0].get("started_ms")
      try:
          return int(ts) if ts is not None else None
      except (TypeError, ValueError):
          return None


  def acquire_consolidation_lock(client, log=print, now_ms=None,
                                 stale_after_secs=DEFAULT_LOCK_STALE_SECS, holder="unknown"):
      """Best-effort mutual exclusion against the pack's other destructive automations. See
      xdr_consolidate.py's version for the full reasoning; behaviour here is identical."""
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)
      resp = client.create_lookup_dataset(_LOCK_DATASET, _LOCK_SCHEMA)
      fresh = isinstance(resp, dict) and "dataset_name" in resp
      if not fresh:
          held_ms = _read_lock(client)
          if held_ms is not None and (now_ms - held_ms) < stale_after_secs * 1000:
              log("consolidation lock held (age %.0fs) - another run appears to be in "
                  "progress; skipping this wipe" % ((now_ms - held_ms) / 1000.0))
              return False
          log("consolidation lock is stale or unreadable (%s) - taking over"
              % ("age unknown" if held_ms is None
                 else "age %.0fs" % ((now_ms - held_ms) / 1000.0)))
          client.delete_dataset(_LOCK_DATASET, force=True)
          client.create_lookup_dataset(_LOCK_DATASET, _LOCK_SCHEMA)
      client.add_lookup_data(_LOCK_DATASET, [{"holder": str(holder), "started_ms": now_ms}])
      return True


  def release_consolidation_lock(client, log=print):
      try:
          client.delete_dataset(_LOCK_DATASET, force=True)
      except Exception as e:
          log("could not release consolidation lock: %s" % e)


  class CoreApiClient:
      """XQL queries and lookup-dataset writes against this tenant's public API. Copied
      verbatim from the other five automations - keep it that way."""

      def __init__(self, poll_secs=3, max_polls=60):
          self.poll_secs = poll_secs
          self.max_polls = max_polls
          self.base = DEFAULT_XDR_API_URL.rstrip("/")
          if "/public_api" in self.base:
              self.base = self.base[:self.base.index("/public_api")]
          if self.base.startswith("replace_with"):
              raise RuntimeError("XDR API credentials are not set - fill in the "
                                 "CONFIGURATION block at the top of this script and re-upload.")

      def _headers(self):
          import hashlib
          import os
          nonce = os.urandom(32).hex()
          ts = str(int(time.time() * 1000))
          sig = hashlib.sha256((DEFAULT_XDR_API_KEY + nonce + ts).encode()).hexdigest()
          return {"x-xdr-timestamp": ts, "x-xdr-nonce": nonce,
                  "x-xdr-auth-id": str(DEFAULT_XDR_API_ID), "Authorization": sig,
                  "Content-Type": "application/json"}

      def _post(self, uri, body, timeout=90):
          import requests
          r = requests.post(self.base + uri, headers=self._headers(), json=body, timeout=timeout)
          try:
              data = r.json()
          except Exception:
              data = {"_raw": r.text}
          if r.status_code != 200:
              raise RuntimeError("%s HTTP %d: %s" % (uri, r.status_code, json.dumps(data)[:400]))
          return data

      def xql(self, query, limit=1000):
          started = self._post("/public_api/v1/xql/start_xql_query/", {"request_data": {"query": query}})
          qid = started.get("reply", started) if isinstance(started, dict) else started
          if isinstance(qid, dict):
              qid = qid.get("query_id") or qid.get("reply") or qid
          for _ in range(self.max_polls):
              data = self._post("/public_api/v1/xql/get_query_results/",
                                {"request_data": {"query_id": qid, "pending_flag": True,
                                                  "limit": limit, "format": "json"}})
              reply = data.get("reply", data) if isinstance(data, dict) else data
              status = reply.get("status") if isinstance(reply, dict) else None
              if status and status != "PENDING":
                  if status != "SUCCESS":
                      raise RuntimeError("XQL %s: %s" % (status, json.dumps(reply)[:400]))
                  results = reply.get("results", {})
                  if isinstance(results, dict) and "data" in results:
                      rows = results["data"]
                      return rows if isinstance(rows, list) else []
                  if isinstance(results, dict) and results.get("stream_id"):
                      return self._xql_stream(qid, results["stream_id"])
                  return results if isinstance(results, list) else []
              time.sleep(self.poll_secs)
          raise RuntimeError("XQL timed out")

      def _xql_stream(self, query_id, stream_id):
          data = self._post("/public_api/v1/xql/get_query_results_stream/",
                            {"request_data": {"query_id": query_id, "stream_id": stream_id,
                                              "is_gzip_compressed": False}})
          raw = data.get("_raw") if isinstance(data, dict) else None
          if raw is None:
              return data if isinstance(data, list) else []
          rows = []
          for line in raw.splitlines():
              line = line.strip()
              if line:
                  rows.append(json.loads(line))
          return rows

      def get_datasets(self):
          data = self._post("/public_api/v1/xql/get_datasets/", {"request": {}})
          return data.get("reply", data) if isinstance(data, dict) else data

      def create_lookup_dataset(self, dataset_name, schema):
          try:
              data = self._post("/public_api/v1/xql/add_dataset/",
                                {"request": {"dataset_name": dataset_name, "dataset_type": "lookup",
                                            "dataset_schema": schema}})
              return data.get("reply", data) if isinstance(data, dict) else data
          except RuntimeError as e:
              if "already exists" in str(e).lower():
                  return {"status": "exists"}
              raise

      def add_lookup_data(self, dataset_name, rows, create_lag_retries=6):
          last = None
          for attempt in range(create_lag_retries):
              try:
                  data = self._post("/public_api/v1/xql/lookups/add_data/",
                                    {"request": {"dataset_name": dataset_name, "data": list(rows)}})
                  return data.get("reply", data) if isinstance(data, dict) else data
              except RuntimeError as e:
                  msg = str(e)
                  if "HTTP 401" in msg:
                      raise
                  msg = msg.lower()
                  if ("no schema" in msg or "not found" in msg) and attempt < create_lag_retries - 1:
                      last = e
                      time.sleep(3 * (attempt + 1))
                      continue
                  raise
          raise last

      def delete_dataset(self, dataset_name, force=False, retries=3):
          last = None
          for attempt in range(retries):
              try:
                  data = self._post("/public_api/v2/xql/delete_dataset/",
                                    {"request": {"dataset_name": dataset_name, "force": bool(force)}})
                  return data.get("reply", data) if isinstance(data, dict) else data
              except Exception as e:
                  last = e
                  if "HTTP 401" in str(e):
                      raise
                  msg = str(e).lower()
                  if "not found" in msg or "nonetype" in msg:
                      return {"status": "already_deleted"}
                  time.sleep(5 * (attempt + 1))
          raise last


  def list_all_yara_datasets(client):
      """Every yara_scanner_*-prefixed LOOKUP dataset on the tenant - matches, scans,
      summary, per-scan consolidated targets, this pack's own run-logs, the lock, any schema
      version, with no exceptions applied yet. See `_list_yara_datasets` in
      xdr_consolidate.py for the same read shape used by every other automation in this
      pack; this differs only in NOT filtering by kind (matches/scans), because this script
      is meant to find everything the prefix owns, including summary datasets the other
      automations' narrower pattern does not classify."""
      raw = client.get_datasets()
      if isinstance(raw, dict):
          items = raw.get("data") or raw.get("datasets") or raw.get("reply") or []
      else:
          items = raw or []
      names = []
      for d in items:
          if isinstance(d, str):
              n, dtype = d, "LOOKUP"
          elif isinstance(d, dict):
              n = d.get("Dataset Name") or d.get("dataset_name") or d.get("name")
              dtype = str(d.get("Type") or d.get("dataset_type") or "LOOKUP").upper()
          else:
              continue
          if n and dtype == "LOOKUP" and str(n).startswith(_PREFIX):
              names.append(str(n))
      return sorted(names)


  def _delete_all(client, names, log):
      """Concurrent delete, bounded batches - same pattern xdr_consolidate.py's
      `_delete_many` uses, WITHOUT its live-overwrite-dataset guard: that guard exists
      specifically to protect the dataset this script exists to delete. Returns
      (deleted, failed) name lists."""
      lock = threading.Lock()
      deleted, failed = [], []

      def worker(ds):
          try:
              client.delete_dataset(ds, force=True)
              with lock:
                  deleted.append(ds)
          except Exception as e:
              log("  delete FAILED %s: %s" % (ds, str(e)[:120]))
              with lock:
                  failed.append(ds)

      for i in range(0, len(names), DELETE_CONCURRENCY):
          batch = names[i:i + DELETE_CONCURRENCY]
          threads = [threading.Thread(target=worker, args=(ds,)) for ds in batch]
          for t in threads:
              t.start()
          for t in threads:
              t.join()
          log("  deleted %d/%d" % (len(deleted), len(names)))
      return sorted(deleted), sorted(failed)


  def record_wipe_run(client, result, now_ms=None, log=print):
      """Best-effort: write ONE row per run, dry or executed - the audit trail this tool
      exists to leave behind. Every exception is caught and only logged; failing to write
      this row must never replace the run's real outcome."""
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)
      row = {
          "run_ts_ms": now_ms,
          "mode": "dry_run" if result.get("dry_run") else "executed",
          "total_found": int(result.get("total_found", 0) or 0),
          "to_delete_count": int(result.get("to_delete_count", 0) or 0),
          "deleted_count": int(result.get("deleted_count", 0) or 0),
          "failed_count": int(result.get("failed_count", 0) or 0),
          "deleted": json.dumps(result.get("deleted", []))[:8000],
          "failed": json.dumps(result.get("failed", []))[:4000],
          "preserved": json.dumps(result.get("preserved", []))[:2000],
      }
      try:
          client.create_lookup_dataset(_WIPE_RUNS_DATASET, _WIPE_RUNS_SCHEMA)
          client.add_lookup_data(_WIPE_RUNS_DATASET, [row])
      except Exception as e:
          log("could not record wipe run outcome: %s" % e)


  def wipe_all(client, execute=False, log=print, now_ms=None):
      """Find every yara_scanner_* dataset, delete every one of them except
      PRESERVED_DATASETS. Read-only (a dry run) unless execute is True. Takes the
      consolidation lock for the duration of an executed pass; a dry run takes no lock.

      Returns a result dict; see main() for the shape consumed there."""
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)
      all_names = list_all_yara_datasets(client)
      to_delete = sorted(n for n in all_names if n not in PRESERVED_DATASETS)
      preserved_present = sorted(n for n in all_names if n in PRESERVED_DATASETS)

      result = {
          "dry_run": not execute,
          "total_found": len(all_names),
          "to_delete_count": len(to_delete),
          "to_delete": to_delete,
          "preserved": preserved_present,
          "lock_held_by_other_run": False,
          "deleted_count": 0, "failed_count": 0, "deleted": [], "failed": [],
      }

      if not execute:
          record_wipe_run(client, result, now_ms=now_ms, log=log)
          return result

      if not acquire_consolidation_lock(client, log=log, now_ms=now_ms,
                                        holder="YaraWipeAllDatasets"):
          result["lock_held_by_other_run"] = True
          return result
      try:
          deleted, failed = _delete_all(client, to_delete, log)
          result["deleted"] = deleted
          result["deleted_count"] = len(deleted)
          result["failed"] = failed
          result["failed_count"] = len(failed)
      finally:
          release_consolidation_lock(client, log=log)

      record_wipe_run(client, result, now_ms=now_ms, log=log)
      return result


  # ---- entry point ------------------------------------------------------------
  def main():
      args = demisto.args()
      execute = bool(argToBoolean(args.get("execute"))) if args.get("execute") not in (None, "") else False
      confirm = str(args.get("confirm") or "")

      if execute and confirm != CONFIRM_PHRASE:
          demisto.executeCommand("DeleteContext", {"key": "Yara.WipeAll"})
          return_error(
              "YaraWipeAllDatasets: execute=true requires confirm to equal exactly \"{}\". "
              "Nothing was deleted.".format(CONFIRM_PHRASE))
          return

      log_lines = []
      try:
          result = wipe_all(CoreApiClient(), execute=execute, log=lambda m: log_lines.append(m))
      except Exception as ex:
          demisto.executeCommand("DeleteContext", {"key": "Yara.WipeAll"})
          return_error("YaraWipeAllDatasets failed: {}".format(ex))
          return

      if result["lock_held_by_other_run"]:
          lines = ["Skipped - the consolidation lock is held by another concurrent run "
                   "(YaraConsolidateApply, YaraCleanup, or another wipe in progress). "
                   "Nothing was deleted."]
      elif result["dry_run"]:
          lines = ["DRY RUN - nothing was deleted. {} of {} yara_scanner_* dataset(s) on this "
                   "tenant WOULD be deleted; {} preserved (this pack's audit trail + lock). "
                   "Re-run with execute=true and confirm=\"{}\" to apply."
                   .format(result["to_delete_count"], result["total_found"],
                           len(result["preserved"]), CONFIRM_PHRASE)]
          if result["to_delete"]:
              lines += ["", "would delete:"] + ["  {}".format(n) for n in result["to_delete"]]
      else:
          lines = ["EXECUTED - {} dataset(s) deleted, {} failed.".format(
              result["deleted_count"], result["failed_count"])]
          if result["failed"]:
              lines += ["", "failed:"] + ["  {}".format(n) for n in result["failed"]]

      if result["preserved"]:
          lines += ["", "preserved (never touched):"] + ["  {}".format(n) for n in result["preserved"]]

      demisto.executeCommand("DeleteContext", {"key": "Yara.WipeAll"})
      return_results(CommandResults(
          readable_output="\n".join(lines),
          outputs_prefix="Yara.WipeAll",
          outputs=result,
          raw_response=result,
      ))


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()
