name: YaraWipeAllDatasets
outputs:
- contextPath: Yara.WipeAll.status
  description: 'The one field to branch on. A CLOSED set: "dry_run" (nothing was deleted; execute was not set), "skipped_locked" (nothing was deleted; another run held the consolidation lock), "executed" (the pass ran and every delete it attempted succeeded), "partial_failure" (the pass ran and at least one delete failed - see failed). It is the same value written to the mode column of the yara_scanner_wipe_runs audit row, derived once, so the run log and this context can never disagree. dry_run and lock_held_by_other_run below restate two of these four cases as booleans for convenience; status is authoritative.'
  type: String
- contextPath: Yara.WipeAll.dry_run
  description: True unless execute=true was passed with a correct confirm phrase. True exactly when status is "dry_run". Nothing was deleted, deleted is empty, and to_delete is the full candidate list this pass found.
  type: Boolean
- contextPath: Yara.WipeAll.total_found
  description: 'Every yara_scanner_* LOOKUP dataset found on the tenant, before exclusions. It is the census, not an independent measurement: it is always exactly to_delete_count plus the number of entries in preserved, because those two lists partition what was found.'
  type: Number
- contextPath: Yara.WipeAll.to_delete_count
  description: len(to_delete).
  type: Number
- contextPath: Yara.WipeAll.to_delete
  description: 'The CANDIDATE set: every dataset name this pass found that is not in the preserved list. It is what the pass INTENDED to delete, never a claim about what happened - deleted, failed and not_attempted partition this list exactly, in every mode, and those three are what say which datasets are actually gone. A list of plain dataset names, deliberately: each element carries one identifier and nothing else.'
  type: String
- contextPath: Yara.WipeAll.deleted_count
  description: len(deleted).
  type: Number
- contextPath: Yara.WipeAll.deleted
  description: The dataset names this pass actually deleted, as plain strings. Empty on a dry run and on a lock standdown. A name a delete found already missing counts as deleted - the desired end state was reached - and does not appear in failed.
  type: String
- contextPath: Yara.WipeAll.failed_count
  description: len(failed).
  type: Number
- contextPath: Yara.WipeAll.failed
  description: One OBJECT per candidate whose deletion raised, with the reason that used to exist only in a log line nothing ever read. Every one of these datasets is still on the tenant, so re-running is safe and picks them up again. Keys below.
  type: Unknown
- contextPath: Yara.WipeAll.failed.dataset
  description: The dataset whose deletion failed.
  type: String
- contextPath: Yara.WipeAll.failed.reason
  description: 'A CLOSED set, safe to match on in a playbook: auth_error (HTTP 401/403), rate_limited (HTTP 429), server_error (HTTP 5xx after the client''s own retries), http_error (any other non-200), timeout (no response inside the request timeout - the delete may in fact have landed), network_error (connection, DNS or TLS - the call never reached the tenant), unknown (unclassified; read detail). There is no not_found code: a dataset that is already gone is reported as deleted, not as a failure.'
  type: String
- contextPath: Yara.WipeAll.failed.detail
  description: The underlying error text, truncated to 200 characters. The sentence a human reads; never match on it.
  type: String
- contextPath: Yara.WipeAll.not_attempted_count
  description: len(not_attempted).
  type: Number
- contextPath: Yara.WipeAll.not_attempted
  description: Candidates from to_delete that this pass never tried to delete, as plain names - to_delete minus deleted minus failed, so the three always partition to_delete exactly. This is what a capped pass leaves owed to the next run (see stopped_early and max_deletes). On a dry run and on a lock standdown nothing is ever attempted, so it equals to_delete; status says which case you are in.
  type: String
- contextPath: Yara.WipeAll.preserved
  description: 'One OBJECT per dataset that was never a deletion candidate at all - this pack''s own run-logs and the consolidation lock. Never touched in any mode. There is no preserved_count key: this list is at most the four names the script''s PRESERVED_DATASETS holds. Keys below.'
  type: Unknown
- contextPath: Yara.WipeAll.preserved.dataset
  description: The preserved dataset name.
  type: String
- contextPath: Yara.WipeAll.preserved.reason
  description: 'A CLOSED set: "consolidation_lock" (the pack''s mutual-exclusion marker - transient, taken and released around an executed pass rather than wiped) or "run_log" (an audit trail; deleting the record of a wipe defeats the reason the record exists).'
  type: String
- contextPath: Yara.WipeAll.preserved.detail
  description: Which trail it is, in a sentence - e.g. YaraCleanup's run log, or this script's own.
  type: String
- contextPath: Yara.WipeAll.lock_held_by_other_run
  description: True if this run stood down because the consolidation lock was held by another concurrent run, or because its marker existed with no readable row (the create-lag window right after another run took it). Nothing was deleted in that case. True exactly when status is "skipped_locked".
  type: Boolean
- contextPath: Yara.WipeAll.lock_taken_over
  description: THE MOST CONSEQUENTIAL FLAG THIS AUTOMATION REPORTS. True when this pass found another run's lock marker, judged it stale, and DELETED DATASETS ANYWAY. If that judgement was wrong - a consolidation pass was still running - this wipe destroyed its source datasets underneath it, and the consolidation will report success over data that no longer exists. Alert on this. It is true exactly when lock_takeover.reason is non-empty; the boolean is the branch, the object beside it is the evidence.
  type: Boolean
- contextPath: Yara.WipeAll.lock_takeover
  description: 'The lock-steal event as fields rather than as a sentence. ALWAYS PRESENT with all three keys: reason is empty and age_secs is null when no takeover happened, so a filter on it never silently matches nothing. Keys below.'
  type: Unknown
- contextPath: Yara.WipeAll.lock_takeover.reason
  description: 'A CLOSED set: "lock_stale" (the marker carried a readable start time older than the 20-minute staleness window, so the run that wrote it is presumed dead) or "lock_unreadable" (the marker existed with no readable row) - and "" when no takeover happened. Only lock_stale is reachable from this automation, which passes unreadable_is_held=True and stands down rather than taking over an unreadable marker; lock_unreadable is declared because the shared lock helper can still emit it.'
  type: String
- contextPath: Yara.WipeAll.lock_takeover.age_secs
  description: How old the stolen marker was, in seconds, as reported by the lock helper. Null when no takeover happened or the marker carried no readable age. Compare it against the runtime of the automation you think held the lock.
  type: Number
- contextPath: Yara.WipeAll.lock_takeover.detail
  description: The lock helper's own sentence about the takeover. Empty when none happened.
  type: String
- contextPath: Yara.WipeAll.stopped_early
  description: True if there were more candidates than max_deletes allowed in this pass. What is still on the tenant is not_attempted PLUS failed - a capped pass that also had failures leaves both, so reading not_attempted alone UNDERCOUNTS the remainder. The report says the same thing one line away ("N remain (X never attempted, Y failed)"). Re-run the exact same command to continue draining; a failed candidate is retried, it is not skipped. Always false on a dry run and on a standdown, neither of which attempts anything.
  type: Boolean
- contextPath: Yara.WipeAll.max_deletes
  description: The per-pass deletion cap this run actually used, or null when the cap was disabled (the argument was 0 or negative). Published because the report states it and a capped pass cannot be interpreted without it.
  type: Number
- contextPath: Yara.WipeAll.passes_expected
  description: 'How many execute passes of max_deletes it takes to drain to_delete_count from scratch: 0 when there are no candidates, 1 when everything fits or the cap is disabled. A computed verdict, published rather than left to the caller, because ceil division against an optional cap is exactly the arithmetic a playbook gets wrong. An executed pass has already performed one of them.'
  type: Number
script: |
  """YaraWipeAllDatasets - deletes EVERY yara_scanner_* lookup dataset on this tenant. No
  scoping, no rules, no exceptions for schema version or dataset kind.

  NOT part of any playbook. This exists for one job: resetting a tenant to a clean slate
  before a test cycle, run by hand from the Playground or War Room when an operator
  deliberately wants zero YARA data left on the tenant. Nothing in this pack ever calls it,
  and it should stay that way.

  This is the one automation in the pack that recognises none of the other five's safety
  rails. YaraCleanup will never delete a live matches dataset or a per-scan consolidated
  target; YaraConsolidateApply is permanently blocked from consuming a live v4 matches
  dataset. Those protections exist because that data is normally irreplaceable. This script
  targets every yara_scanner_* LOOKUP dataset unconditionally — host matches and scan
  lifecycle, old schema and new, per-scan consolidated targets and summary datasets alike.
  The only things it does not delete are the pack's own audit trails (this script's
  own included) and the consolidation lock, which it manages itself around the run.

  DRY RUN BY DEFAULT, same convention as every destructive automation in this pack: without
  execute=true this only reports what it would delete. Because there is no scoping argument
  here at all — no older_than_months, no host filter, no schema check — execute=true alone
  would be one accidental click away from wiping a tenant. So execute=true additionally
  requires confirm to equal the exact phrase below; get it wrong and nothing is deleted no
  matter what execute says.

  This script does not check whether any scan is currently in progress on the tenant. That
  is a deliberate simplification, not an oversight: any such check is inherently racy (a scan
  can start the instant after it runs), and the entire point of this tool is an operator
  choosing, on purpose, to remove everything. Confirm no scan is running before you use it.

  ARGUMENTS
    execute      THE DELETION OPT-IN. Leave false (the default) for a dry run. true, combined
                 with a correct confirm phrase, deletes every yara_scanner_* dataset on the
                 tenant except this pack's own run-log datasets and the consolidation lock.
    confirm      Required when execute=true. Must equal, exactly and case-sensitively:
                 DELETE ALL YARA DATASETS
    max_deletes  Caps a single EXECUTED pass so it finishes inside the platform's ~900s task
                 timeout. Defaults to DEFAULT_MAX_DELETES_PER_PASS; 0 or a negative number
                 disables the cap. A dry run is unaffected and always reports the full
                 candidate list.

  WHAT IT REPORTS
    The result dict is the contract; the War Room report is rendered FROM it and from nothing
    else, so the table an operator reads and the context a playbook branches on cannot
    disagree. `status` is the one field to branch on. `to_delete` partitions exactly into
    `deleted` + `failed` + `not_attempted`, so a capped or partly-failed pass can never leave
    "deleted" and "never touched" indistinguishable. And `lock_taken_over` is the fact that
    matters most on a bad day: this pass proceeded over another run's lock marker, and may
    have deleted that run's source datasets underneath it.
  """

  # ############################################################################
  # #  CONFIGURATION - the only values in this file you need to edit.          #
  # ############################################################################
  # Cortex XDR API credentials, security level ADVANCED
  # (Settings > Configurations > API Keys). Fill all three in before uploading this
  # script; until the URL is replaced every run fails immediately and does nothing.
  DEFAULT_XDR_API_KEY = "replace_with_xdr_advanced_api_key"   # the API key secret
  DEFAULT_XDR_API_ID = "replace_with_xdr_advanced_api_id"     # that key's numeric ID
  # Tenant API base URL, https://api-<tenant>.xdr.<region>.paloaltonetworks.com
  DEFAULT_XDR_API_URL = "replace_with_xdr_api_url"

  # The literal phrase execute=true must be paired with. Deliberately not a boolean second
  # flag - a typo in a free-text field is a much stronger signal of "I meant to type this"
  # than a second checkbox someone learns to tick reflexively alongside the first.
  CONFIRM_PHRASE = "DELETE ALL YARA DATASETS"
  # ############################################################################

  # ============================================================================
  # INLINED LIBRARY - carried in-file so this automation imports nothing, matching every
  # other script in this pack. Deliberately NOT the full matches/scans consolidation/
  # classification machinery those carry: this script never calls any of it (it has no
  # selection rules to apply), and leaving it out keeps this file short enough that "what
  # does this actually do" is answerable by reading it top to bottom - which matters more
  # here than on any sibling, given what it does. The pieces below (CoreApiClient, the
  # consolidation lock pair) are copied verbatim from xdr_consolidate.py so auth and lock
  # behaviour match every sibling automation exactly.
  # ============================================================================
  import json
  import re
  import threading
  import time

  _PREFIX = "yara_scanner"

  # Same dataset, same schema, same semantics as xdr_consolidate.py's lock - taking it here
  # stops this script racing YaraConsolidateApply/YaraCleanup/another wipe over the same
  # datasets. Copied verbatim; do not let this drift from the canonical source.
  _LOCK_DATASET = "yara_scanner_consolidation_lock"
  _LOCK_SCHEMA = {"holder": "text", "started_ms": "number"}
  DEFAULT_LOCK_STALE_SECS = 20 * 60

  # This script's own audit trail.
  _WIPE_RUNS_DATASET = "yara_scanner_wipe_runs"
  _WIPE_RUNS_SCHEMA = {
      "run_ts_ms": "number", "mode": "text", "total_found": "number",
      "to_delete_count": "number", "deleted_count": "number", "failed_count": "number",
      "deleted": "text", "failed": "text", "preserved": "text", "stopped_early": "text",
  }

  # Never deleted, regardless of how they reach the candidate list: the three run-logs this
  # pack's automations keep (including this script's own) are audit trail, not scan data -
  # deleting the record of a wipe defeats the reason it exists - and the lock dataset is
  # transient, managed by acquire/release around this run, not a wipe target.
  PRESERVED_DATASETS = frozenset({
      _LOCK_DATASET,
      "yara_scanner_consolidation_runs",
      "yara_scanner_cleanup_runs",
      _WIPE_RUNS_DATASET,
  })

  DELETE_CONCURRENCY = 12   # parallel delete_dataset calls, same bound every sibling uses

  # A platform automation task cannot outlive its ~900s execution timeout (the same ceiling
  # YaraConsolidateApply's DEFAULT_MAX_SCANS_PER_PASS exists for - see xdr_consolidate.py:101,
  # "a run cannot outlive the 900s task timeout"). delete_dataset measures ~60s server-side, so
  # at DELETE_CONCURRENCY=12 an unbounded pass over a few hundred datasets - exactly this
  # tenant's accumulated count from a long test session - runs 15-20+ minutes and gets killed
  # mid-batch. That happened live: a full pass against ~240 datasets surfaced as a bare
  # "Internal Server Error" with no clean YaraWipeAllDatasets message, after silently deleting
  # most of its candidates first. 100 candidates x 60s / 12-wide = ~500s (56% of budget) -
  # comfortable margin, matching how conservative Apply's own bound is relative to its measured
  # ceiling. Re-run to drain the rest, exactly like Apply's own "owed a further pass" pattern.
  DEFAULT_MAX_DELETES_PER_PASS = 100


  def _read_lock(client):
      rows = client.xql("dataset = %s" % _LOCK_DATASET, limit=5) or []
      if not rows:
          return None
      ts = rows[0].get("started_ms")
      try:
          return int(ts) if ts is not None else None
      except (TypeError, ValueError):
          return None


  def acquire_consolidation_lock(client, log=print, now_ms=None,
                                 stale_after_secs=DEFAULT_LOCK_STALE_SECS, holder="unknown",
                                 unreadable_is_held=False, on_takeover=None):
      """Best-effort mutual exclusion against the pack's other destructive automations. See
      xdr_consolidate.py's version for the full reasoning; behaviour here is identical.

      This copy previously omitted unreadable_is_held and on_takeover, which the canonical
      version documents as existing precisely "for callers whose cost of a WRONG takeover is
      irreversible (dataset deletion)". That is this automation and no other, so the guard was
      missing from the one place it matters most: an unreadable lock row is the ordinary
      create-lag window right after another run took the lock, and treating it as stale let a
      wipe delete every dataset out from under a consolidation pass that was still running."""
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)
      resp = client.create_lookup_dataset(_LOCK_DATASET, _LOCK_SCHEMA)
      fresh = isinstance(resp, dict) and "dataset_name" in resp
      if not fresh:
          held_ms = _read_lock(client)
          if held_ms is not None and (now_ms - held_ms) < stale_after_secs * 1000:
              log("consolidation lock held (age %.0fs) - another run appears to be in "
                  "progress; skipping this pass" % ((now_ms - held_ms) / 1000.0))
              return False
          if held_ms is None and unreadable_is_held:
              log("consolidation lock marker exists but its row is unreadable - another run "
                  "most likely just created it (add_data create-lag); standing down rather "
                  "than taking over")
              return False
          msg = ("consolidation lock is stale or unreadable (%s) - taking over"
                 % ("age unknown" if held_ms is None
                    else "age %.0fs" % ((now_ms - held_ms) / 1000.0)))
          log(msg)
          if on_takeover:
              on_takeover(msg)
          # Delete-then-recreate rather than just appending a fresh row: leaving the stale
          # row(s) in place would let a future _read_lock pick up an arbitrary (not
          # necessarily newest) row, and the dataset would accumulate one row per steal
          # forever.
          client.delete_dataset(_LOCK_DATASET, force=True)
          client.create_lookup_dataset(_LOCK_DATASET, _LOCK_SCHEMA)
      client.add_lookup_data(_LOCK_DATASET, [{"holder": str(holder), "started_ms": now_ms}])
      return True


  def release_consolidation_lock(client, log=print):
      try:
          client.delete_dataset(_LOCK_DATASET, force=True)
      except Exception as e:
          log("could not release consolidation lock: %s" % e)


  class CoreApiClient:
      """XQL queries and lookup-dataset writes against this tenant's public API. Copied
      verbatim from the other five automations - keep it that way."""

      def __init__(self, poll_secs=3, max_polls=60):
          self.poll_secs = poll_secs
          self.max_polls = max_polls
          self.base = DEFAULT_XDR_API_URL.rstrip("/")
          if "/public_api" in self.base:
              self.base = self.base[:self.base.index("/public_api")]
          if self.base.startswith("replace_with"):
              raise RuntimeError("XDR API credentials are not set - fill in the "
                                 "CONFIGURATION block at the top of this script and re-upload.")

      def _headers(self):
          import hashlib
          import os
          nonce = os.urandom(32).hex()
          ts = str(int(time.time() * 1000))
          sig = hashlib.sha256((DEFAULT_XDR_API_KEY + nonce + ts).encode()).hexdigest()
          return {"x-xdr-timestamp": ts, "x-xdr-nonce": nonce,
                  "x-xdr-auth-id": str(DEFAULT_XDR_API_ID), "Authorization": sig,
                  "Content-Type": "application/json"}

      def _post(self, uri, body, timeout=90):
          import requests
          r = requests.post(self.base + uri, headers=self._headers(), json=body, timeout=timeout)
          try:
              data = r.json()
          except Exception:
              data = {"_raw": r.text}
          if r.status_code != 200:
              raise RuntimeError("%s HTTP %d: %s" % (uri, r.status_code, json.dumps(data)[:400]))
          return data

      def xql(self, query, limit=1000):
          started = self._post("/public_api/v1/xql/start_xql_query/", {"request_data": {"query": query}})
          qid = started.get("reply", started) if isinstance(started, dict) else started
          if isinstance(qid, dict):
              qid = qid.get("query_id") or qid.get("reply") or qid
          for _ in range(self.max_polls):
              data = self._post("/public_api/v1/xql/get_query_results/",
                                {"request_data": {"query_id": qid, "pending_flag": True,
                                                  "limit": limit, "format": "json"}})
              reply = data.get("reply", data) if isinstance(data, dict) else data
              status = reply.get("status") if isinstance(reply, dict) else None
              if status and status != "PENDING":
                  if status != "SUCCESS":
                      raise RuntimeError("XQL %s: %s" % (status, json.dumps(reply)[:400]))
                  results = reply.get("results", {})
                  if isinstance(results, dict) and "data" in results:
                      rows = results["data"]
                      return rows if isinstance(rows, list) else []
                  if isinstance(results, dict) and results.get("stream_id"):
                      return self._xql_stream(qid, results["stream_id"])
                  return results if isinstance(results, list) else []
              time.sleep(self.poll_secs)
          raise RuntimeError("XQL timed out")

      def _xql_stream(self, query_id, stream_id):
          data = self._post("/public_api/v1/xql/get_query_results_stream/",
                            {"request_data": {"query_id": query_id, "stream_id": stream_id,
                                              "is_gzip_compressed": False}})
          raw = data.get("_raw") if isinstance(data, dict) else None
          if raw is None:
              return data if isinstance(data, list) else []
          rows = []
          for line in raw.splitlines():
              line = line.strip()
              if line:
                  rows.append(json.loads(line))
          return rows

      def get_datasets(self):
          data = self._post("/public_api/v1/xql/get_datasets/", {"request": {}})
          return data.get("reply", data) if isinstance(data, dict) else data

      def create_lookup_dataset(self, dataset_name, schema):
          try:
              data = self._post("/public_api/v1/xql/add_dataset/",
                                {"request": {"dataset_name": dataset_name, "dataset_type": "lookup",
                                            "dataset_schema": schema}})
              return data.get("reply", data) if isinstance(data, dict) else data
          except RuntimeError as e:
              if "already exists" in str(e).lower():
                  return {"status": "exists"}
              raise

      def add_lookup_data(self, dataset_name, rows, create_lag_retries=6):
          last = None
          for attempt in range(create_lag_retries):
              try:
                  data = self._post("/public_api/v1/xql/lookups/add_data/",
                                    {"request": {"dataset_name": dataset_name, "data": list(rows)}})
                  return data.get("reply", data) if isinstance(data, dict) else data
              except RuntimeError as e:
                  msg = str(e)
                  if "HTTP 401" in msg:
                      raise
                  msg = msg.lower()
                  if ("no schema" in msg or "not found" in msg) and attempt < create_lag_retries - 1:
                      last = e
                      time.sleep(3 * (attempt + 1))
                      continue
                  raise
          raise last

      def delete_dataset(self, dataset_name, force=False, retries=3):
          last = None
          for attempt in range(retries):
              try:
                  data = self._post("/public_api/v2/xql/delete_dataset/",
                                    {"request": {"dataset_name": dataset_name, "force": bool(force)}})
                  return data.get("reply", data) if isinstance(data, dict) else data
              except Exception as e:
                  last = e
                  if "HTTP 401" in str(e):
                      raise
                  msg = str(e).lower()
                  if "not found" in msg or "nonetype" in msg:
                      return {"status": "already_deleted"}
                  time.sleep(5 * (attempt + 1))
          raise last


  # ---------------------------------------------------------------------------------------
  # RUN RECORDS - what this pass reports, as fields rather than sentences.
  #
  # `failed` and `preserved` are CONTEXT before they are prose: a playbook filters on them.
  # So each entry is an OBJECT with a stable key set and a `reason` drawn from a closed
  # vocabulary, and the sentence a human reads survives as `detail` rather than BEING the
  # record. Every entry carries every key even where one does not apply, because a transformer
  # filtering on a key that is only sometimes present matches nothing and reports no error -
  # a silently empty branch, which on a wipe tool is the worst kind.
  #
  # `to_delete`, `deleted` and `not_attempted` stay lists of PLAIN dataset names on purpose.
  # Each element there carries exactly one fact - an identifier - and that is data, not prose;
  # wrapping an identifier in an object buys nothing and costs every caller that splices the
  # list. The two lists that DID carry a per-entry reason are the two that became objects.
  # ---------------------------------------------------------------------------------------

  # Why one delete of one dataset did not happen. Closed set: a playbook may match on these.
  # The underlying exception text always survives in `detail`, so narrowing a code here never
  # loses the specifics. Note "not found" is deliberately absent - CoreApiClient.delete_dataset
  # treats a missing dataset as {"status": "already_deleted"} and never raises for it, so the
  # desired end state was reached and the name lands in `deleted`, not here.
  FAIL_REASONS = {
      "auth_error":
          "HTTP 401/403 - the API key is missing, rotated, or not at ADVANCED level. Every "
          "remaining delete in the pass fails the same way; fix the credentials and re-run",
      "rate_limited":
          "HTTP 429 - the tenant throttled this pass. The dataset is untouched; re-run to "
          "pick it up again",
      "server_error":
          "HTTP 5xx after the client's own retries - a tenant-side failure, not a rejection "
          "of this request",
      "http_error":
          "a non-200 HTTP status outside the classes above",
      "timeout":
          "the call did not return inside the client's request timeout. delete_dataset is "
          "measured at ~60s server-side, so a loaded tenant can exceed it; the delete may in "
          "fact have landed, and a re-run will report the name as already deleted",
      "network_error":
          "the call never reached the tenant - connection, DNS or TLS failure",
      "unknown":
          "the delete raised something none of the codes above classify. Read `detail`",
  }

  # Why a dataset was never a candidate in the first place. Closed set; mirrors
  # PRESERVED_DATASETS, which is the authority on WHICH names these are.
  PRESERVED_REASONS = {
      "consolidation_lock":
          "the pack's mutual-exclusion marker - transient, taken and released around an "
          "executed pass rather than wiped",
      "run_log":
          "an audit trail. Deleting the record of a wipe defeats the reason the record exists",
  }

  # Per-name sentence for a preserved record, so `detail` says which trail it is rather than
  # restating the vocabulary. Any preserved name not listed here is a run-log by elimination.
  _PRESERVED_DETAIL = {
      _LOCK_DATASET: "the consolidation lock. This automation takes and releases it around an "
                     "executed pass, so it is never a deletion candidate",
      "yara_scanner_consolidation_runs": "YaraConsolidateApply's run log - one row per "
                                         "consolidation pass",
      "yara_scanner_cleanup_runs": "YaraCleanup's run log - one row per retention pass",
      _WIPE_RUNS_DATASET: "this script's own run log - the record of this very wipe",
  }

  # Why this pass took another run's lock marker over. Closed set.
  #
  # Only lock_stale is reachable today: wipe_all passes unreadable_is_held=True, so an
  # unreadable marker stands the pass DOWN (lock_held_by_other_run) instead of being taken
  # over. lock_unreadable is declared because acquire_consolidation_lock still emits that
  # sentence for callers that pass False, and a vocabulary that silently drops a code the
  # shared helper can produce is a vocabulary that stops being closed the day the flag flips.
  TAKEOVER_REASONS = {
      "lock_stale":
          "the marker carried a readable start time older than DEFAULT_LOCK_STALE_SECS, so "
          "the run that wrote it is presumed dead",
      "lock_unreadable":
          "the marker existed with no readable row at all. NOT reachable from this automation "
          "while it passes unreadable_is_held=True, which treats that state as held",
  }


  def _delete_failure_reason(exc):
      """Closed-vocabulary FAIL_REASONS code for one delete_dataset exception.

      CoreApiClient raises RuntimeError("<uri> HTTP <code>: <body>") for a non-200, so the
      status code is the strongest signal available and is read first; the transport failures
      below it never carry one."""
      low = str(exc or "").lower()
      m = re.search(r"http (\d{3})", low)
      code = int(m.group(1)) if m else None
      if code in (401, 403):
          return "auth_error"
      if code == 429:
          return "rate_limited"
      if code is not None and 500 <= code <= 599:
          return "server_error"
      if code is not None:
          return "http_error"
      if "timed out" in low or "timeout" in low:
          return "timeout"
      if ("connection" in low or "ssl" in low or "certificate" in low
              or "name resolution" in low or "unreachable" in low):
          return "network_error"
      return "unknown"


  def _failed_record(dataset, exc):
      """One `failed` entry: the dataset, a code from FAIL_REASONS, and the error itself.

      Before this existed the reason was formatted into a log line that main() collected and
      never read, so the ONLY record of why a delete failed was discarded - the yml even
      promised it was in the readable output. It travels with the name now."""
      return {"dataset": dataset,
              "reason": _delete_failure_reason(exc),
              "detail": str(exc)[:200]}


  def _preserved_record(dataset):
      """One `preserved` entry. The WHY used to live only in a comment beside
      PRESERVED_DATASETS and in one sentence of the report; an operator asking "why is that
      still there" had nothing in context to read."""
      reason = "consolidation_lock" if dataset == _LOCK_DATASET else "run_log"
      return {"dataset": dataset, "reason": reason,
              "detail": _PRESERVED_DETAIL.get(dataset, PRESERVED_REASONS[reason])}


  def _takeover_record(message=""):
      """The lock-steal event as fields: a TAKEOVER_REASONS code, the marker's age, and the
      sentence.

      acquire_consolidation_lock is compared byte-for-byte against xdr_consolidate.py by
      tests/test_consolidation.py's lock gate, so it can only ever hand a caller its own
      sentence through on_takeover. This converts that sentence ONCE, here at the boundary,
      and nothing downstream substring-matches prose again. Every key is always present -
      reason "" and age_secs None mean no takeover happened."""
      msg = str(message or "")
      m = re.search(r"age ([0-9.]+)s", msg)
      age = float(m.group(1)) if m else None
      if not msg:
          reason = ""
      else:
          reason = "lock_stale" if age is not None else "lock_unreadable"
      return {"reason": reason, "age_secs": age, "detail": msg}


  def _passes_expected(candidates, max_deletes):
      """Execute passes of max_deletes needed to drain `candidates` from scratch. 0 when there
      is nothing to delete, 1 when the cap is disabled or everything fits.

      Published rather than left to the reader: the report has always stated this number, and
      ceil division against an optional cap is exactly the arithmetic a caller gets wrong."""
      if candidates <= 0:
          return 0
      if not max_deletes or max_deletes <= 0:
          return 1
      return -(-candidates // max_deletes)


  def list_all_yara_datasets(client):
      """Every yara_scanner_*-prefixed LOOKUP dataset on the tenant - matches, scans,
      summary, per-scan consolidated targets, this pack's own run-logs, the lock, any schema
      version, with no exceptions applied yet. See `_list_yara_datasets` in
      xdr_consolidate.py for the same read shape used by every other automation in this
      pack; this differs only in NOT filtering by kind (matches/scans), because this script
      is meant to find everything the prefix owns, including summary datasets the other
      automations' narrower pattern does not classify."""
      raw = client.get_datasets()
      if isinstance(raw, dict):
          items = raw.get("data") or raw.get("datasets") or raw.get("reply") or []
      else:
          items = raw or []
      names = []
      for d in items:
          if isinstance(d, str):
              n, dtype = d, "LOOKUP"
          elif isinstance(d, dict):
              n = d.get("Dataset Name") or d.get("dataset_name") or d.get("name")
              dtype = str(d.get("Type") or d.get("dataset_type") or "LOOKUP").upper()
          else:
              continue
          if n and dtype == "LOOKUP" and str(n).startswith(_PREFIX):
              names.append(str(n))
      return sorted(names)


  def _delete_all(client, names, log):
      """Concurrent delete, bounded batches - same pattern xdr_consolidate.py's
      `_delete_many` uses, WITHOUT its live-overwrite-dataset guard: that guard exists
      specifically to protect the dataset this script exists to delete.

      Returns (deleted names, failed RECORDS). The failure records are the point: the reason
      a delete failed used to be formatted into `log` and thrown away, leaving the caller a
      bare name list and the operator nothing to act on."""
      lock = threading.Lock()
      deleted, failed = [], []

      def worker(ds):
          try:
              client.delete_dataset(ds, force=True)
              with lock:
                  deleted.append(ds)
          except Exception as e:
              log("  delete FAILED %s: %s" % (ds, str(e)[:120]))
              with lock:
                  failed.append(_failed_record(ds, e))

      for i in range(0, len(names), DELETE_CONCURRENCY):
          batch = names[i:i + DELETE_CONCURRENCY]
          threads = [threading.Thread(target=worker, args=(ds,)) for ds in batch]
          for t in threads:
              t.start()
          for t in threads:
              t.join()
          log("  deleted %d/%d" % (len(deleted), len(names)))
      # Grouped by reason, then by name: a pass that fails 40 deletes usually fails them for
      # two or three reasons, and those want to be adjacent in the table an operator reads.
      return sorted(deleted), sorted(failed, key=lambda f: (f["reason"], f["dataset"]))


  def record_wipe_run(client, result, now_ms=None, log=print):
      """Best-effort: write ONE row per run, dry or executed - the audit trail this tool
      exists to leave behind. Every exception is caught and only logged; failing to write
      this row must never replace the run's real outcome."""
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)
      # `mode` IS result["status"] - one derivation, so the audit trail and the context can
      # never disagree about what kind of pass this was. A lock standdown gets its own value
      # and is never "executed": it returns before any delete, so it lands here with dry_run
      # False and deleted_count 0 - byte-identical, in the run log, to a real executed pass
      # that deleted nothing, which is the exact question this audit trail exists to answer.
      row = {
          "run_ts_ms": now_ms,
          "mode": str(result.get("status") or ""),
          "total_found": int(result.get("total_found", 0) or 0),
          "to_delete_count": int(result.get("to_delete_count", 0) or 0),
          "deleted_count": int(result.get("deleted_count", 0) or 0),
          "failed_count": int(result.get("failed_count", 0) or 0),
          "deleted": json.dumps(result.get("deleted", []))[:8000],
          # Reason included, name and code only: the column is capped at 4000 characters and a
          # truncated JSON document parses as nothing at all, so the sentence stays in context
          # and in the report while the audit row keeps the fact you can group by. `preserved`
          # is written as bare names for the same reason - its detail sentences alone would
          # overrun 2000 characters.
          "failed": json.dumps([{"dataset": f.get("dataset"), "reason": f.get("reason")}
                                for f in (result.get("failed") or [])])[:4000],
          "preserved": json.dumps([p.get("dataset")
                                   for p in (result.get("preserved") or [])])[:2000],
          "stopped_early": str(bool(result.get("stopped_early"))),
      }
      # NOTE: not_attempted has no column of its own, and deliberately so - adding one to
      # _WIPE_RUNS_SCHEMA would not match the yara_scanner_wipe_runs dataset already on every
      # tenant that has ever run this, and add_lookup_data against a mismatched schema fails.
      # It is recoverable from the row as to_delete_count - deleted_count - failed_count.
      try:
          client.create_lookup_dataset(_WIPE_RUNS_DATASET, _WIPE_RUNS_SCHEMA)
          client.add_lookup_data(_WIPE_RUNS_DATASET, [row])
      except Exception as e:
          log("could not record wipe run outcome: %s" % e)


  def wipe_all(client, execute=False, log=print, now_ms=None, max_deletes=DEFAULT_MAX_DELETES_PER_PASS):
      """Find every yara_scanner_* dataset, delete every one of them except
      PRESERVED_DATASETS. Read-only (a dry run) unless execute is True. Takes the
      consolidation lock for the duration of an executed pass; a dry run takes no lock.

      max_deletes bounds a single EXECUTED pass so it finishes inside the platform's task
      timeout (see DEFAULT_MAX_DELETES_PER_PASS) - a dry run is unaffected and always reports
      the full candidate list, since a report has no execution-time budget to protect.

      Returns a result dict; see main() for the shape consumed there."""
      now_ms = now_ms if now_ms is not None else int(time.time() * 1000)
      all_names = list_all_yara_datasets(client)
      to_delete = sorted(n for n in all_names if n not in PRESERVED_DATASETS)
      preserved_present = [_preserved_record(n)
                           for n in sorted(n for n in all_names if n in PRESERVED_DATASETS)]

      # to_delete is the CANDIDATE set - what this pass found. deleted / failed /
      # not_attempted partition it exactly, always, in every mode: without the third of those
      # a capped or partly-failed pass reported "8 candidates, 3 deleted" and left the other
      # five indistinguishable between "still there" and "gone". not_attempted starts as the
      # whole candidate set, which is the literal truth of a dry run and of a standdown -
      # nothing is attempted in either - and is narrowed once a real pass has run.
      result = {
          "status": "dry_run" if not execute else "executed",
          "dry_run": not execute,
          "total_found": len(all_names),
          "to_delete_count": len(to_delete),
          "to_delete": to_delete,
          "preserved": preserved_present,
          "lock_held_by_other_run": False,
          "lock_taken_over": False,
          "lock_takeover": _takeover_record(),
          "stopped_early": False,
          "max_deletes": max_deletes if max_deletes else None,
          "passes_expected": _passes_expected(len(to_delete), max_deletes),
          "deleted_count": 0, "failed_count": 0, "deleted": [], "failed": [],
          "not_attempted": list(to_delete), "not_attempted_count": len(to_delete),
      }

      if not execute:
          record_wipe_run(client, result, now_ms=now_ms, log=log)
          return result

      # unreadable_is_held=True because a wrong takeover HERE is unrecoverable: an unreadable
      # lock row is the ordinary create-lag window right after another run took the lock, and
      # this automation's response to "stale" is to delete every yara_scanner_* dataset.
      takeovers = []
      if not acquire_consolidation_lock(client, log=log, now_ms=now_ms,
                                        holder="YaraWipeAllDatasets",
                                        unreadable_is_held=True,
                                        on_takeover=takeovers.append):
          result["lock_held_by_other_run"] = True
          result["status"] = "skipped_locked"
          # Recorded, not silent: a standdown returns before any delete, so without this the
          # run log cannot tell "stood down on the lock" from "never started" - the exact
          # question the wipe audit trail exists to answer.
          record_wipe_run(client, result, now_ms=now_ms, log=log)
          return result
      if takeovers:
          # Reported, never silent: this pass proceeded while another run's lock marker was in
          # place, and the operator must be able to tell it apart from an uncontended pass.
          # The boolean is the branch; the record beside it carries the code, the marker's age
          # and the sentence.
          result["lock_taken_over"] = True
          result["lock_takeover"] = _takeover_record(takeovers[0])
      try:
          this_pass = to_delete
          if max_deletes and len(to_delete) > max_deletes:
              result["stopped_early"] = True
              this_pass = to_delete[:max_deletes]
              log("pass bounded to %d of %d candidate(s) so it finishes inside its task "
                  "timeout; the rest are owed a further pass" % (max_deletes, len(to_delete)))
          deleted, failed = _delete_all(client, this_pass, log)
          result["deleted"] = deleted
          result["deleted_count"] = len(deleted)
          result["failed"] = failed
          result["failed_count"] = len(failed)
          # The remainder, computed from what was actually touched rather than from the cap:
          # a bounded pass and a pass whose deletes failed both leave candidates behind, and
          # they leave DIFFERENT ones. Subtracting keeps to_delete == deleted + failed +
          # not_attempted true whichever happened.
          touched = set(deleted) | set(f["dataset"] for f in failed)
          result["not_attempted"] = [n for n in to_delete if n not in touched]
          result["not_attempted_count"] = len(result["not_attempted"])
          result["status"] = "partial_failure" if failed else "executed"
      finally:
          release_consolidation_lock(client, log=log)

      record_wipe_run(client, result, now_ms=now_ms, log=log)
      return result


  # ---- entry point ------------------------------------------------------------
  _MD_ROW_CAP = 50


  def _n(v):
      """Thousands-separated. The numbers this reports run to six figures.

      Integral values print as integers, floats included: the settings arrive as
      float(args.get(...)), and "900.0" in a table reads as a typo rather than a default.

      A NON-integral float keeps its fraction. The previous version went through int(), which
      silently truncated - a quiet_secs of 900.5 printed as 900 while the context carried 900.5,
      so the report and the context stated different numbers. That is the one disagreement this
      renderer exists to make impossible, and it was being introduced by the formatter itself.
      """
      try:
          f = float(v)
      except (TypeError, ValueError):
          return str(v)
      return format(int(f), ",d") if f.is_integer() else format(f, ",g")


  def _md_table(headers, rows):
      """A markdown table, or "" when there is nothing to put in it. Cells are escaped: rule
      names and hostnames reach here from a ruleset and from an endpoint, and a single pipe in
      either would silently shear a column off every row below it."""
      if not rows:
          return ""

      def cell(v):
          return str("" if v is None else v).replace("|", "\\|").replace("\n", " ")

      out = ["| " + " | ".join(cell(h) for h in headers) + " |",
             "|" + "|".join("---" for _ in headers) + "|"]
      for r in rows:
          out.append("| " + " | ".join(cell(v) for v in r) + " |")
      return "\n".join(out)


  def _md_capped(headers, rows, context_key):
      """_md_table, truncated. The context keeps every entry, so a 200-host pass cannot push the
      counts off the top of the War Room - the same trade YaraReport makes for the scan log."""
      body = _md_table(headers, rows[:_MD_ROW_CAP])
      if len(rows) > _MD_ROW_CAP:
          body += ("\n\n_... and %s more - the full list is in `%s`._"
                   % (_n(len(rows) - _MD_ROW_CAP), context_key))
      return body


  _HEADLINE = {"dry_run": "DRY RUN", "skipped_locked": "STOOD DOWN",
               "executed": "EXECUTED", "partial_failure": "EXECUTED, WITH FAILURES"}
  _SUBTITLE = {
      "dry_run": "Nothing was deleted. Re-run with execute=true and a correct confirm phrase "
                 "to apply exactly this.",
      # NOT "the lock is held by another concurrent run", which this pass cannot know:
      # acquire_consolidation_lock refuses for TWO reasons and returns the same False for both -
      # a fresh readable marker (another run really is in progress) and a marker whose row could
      # not be read at all, which this automation treats as held rather than risk deleting
      # underneath a live pass. Asserting the first on both paths told an operator to wait for a
      # run that may not exist. Naming both is what the pass actually established.
      "skipped_locked": "Nothing was deleted. The consolidation lock could not be taken - either "
                        "another run holds it (YaraConsolidateApply, YaraCleanup, the CLI, or "
                        "another wipe), or its marker exists with a row that could not be read, "
                        "which this automation treats as held rather than delete underneath a "
                        "pass that may still be running.",
      "executed": "Every dataset this pass attempted was deleted.",
      "partial_failure": "Some deletions failed. Those datasets are still on the tenant, and "
                         "re-running is safe.",
  }


  def render_wipe_markdown(result):
      """The War Room report for one pass, rendered from the result dict and NOTHING else.

      Every number here is a key a playbook can also read, so the table an operator acts on
      and the context a branch reads cannot disagree. The previous version formatted three of
      its numbers - the pass count, the remainder, the preserved count - out of main() locals
      that were published nowhere, and built its lists with `["  " + n for n in ...]`, which
      raises TypeError the moment one of those lists holds an object rather than a name."""
      status = str(result.get("status") or "")
      out = ["### YARA dataset wipe - %s" % _HEADLINE.get(status, status.upper() or "UNKNOWN"),
             "_%s_" % _SUBTITLE.get(status, ""), ""]

      if result["lock_held_by_other_run"]:
          # Same care as the subtitle: the refusal does not say WHICH of its two branches fired,
          # so this row must not pick one. See _SUBTITLE["skipped_locked"].
          lock = ("NOT TAKEN - held by another run, or its marker could not be read; this pass "
                  "stood down and deleted nothing")
      elif result["lock_taken_over"]:
          lock = ("TAKEN OVER from another run (`%s`) - see the warning below"
                  % result["lock_takeover"]["reason"])
      elif result["dry_run"]:
          lock = "not taken - a dry run takes no lock"
      else:
          lock = "taken and released by this pass, uncontended"

      if status in ("executed", "partial_failure"):
          owed = " - still on the tenant, owed a further pass"
      elif status == "skipped_locked":
          owed = " - the pass stood down before attempting any of them"
      else:
          owed = " - a dry run attempts nothing"

      facts = [
          ("Status", "`%s`" % status),
          ("Candidates", "%s of %s yara_scanner_* dataset(s) on this tenant"
                         % (_n(result["to_delete_count"]), _n(result["total_found"]))),
          ("Deleted", _n(result["deleted_count"])),
          ("Failed", "%s%s" % (_n(result["failed_count"]),
                               " - still on the tenant" if result["failed_count"] else "")),
          ("Not attempted", "%s%s" % (_n(result["not_attempted_count"]),
                                      owed if result["not_attempted_count"] else "")),
          ("Preserved", "%s - this pack's audit trail and the consolidation lock"
                        % _n(len(result["preserved"]))),
          ("Lock", lock),
          ("Pass cap", ("max_deletes=%s" % _n(result["max_deletes"])) if result["max_deletes"]
                       else "disabled - this pass was allowed to delete every candidate"),
      ]
      out.append(_md_table(["", ""], [("**%s**" % k, v) for k, v in facts]))

      if result["lock_taken_over"]:
          out += ["", "> **WARNING - this wipe took another run's consolidation lock over.** %s. "
                      "If a consolidation pass was in fact still running, its source datasets "
                      "were deleted underneath it: check `yara_scanner_consolidation_runs` for "
                      "a pass around this time with no outcome row."
                  % (result["lock_takeover"]["detail"] or "No detail was reported").rstrip(".")]

      # Stated in a dry run, which is exactly when it needs to be known - not discovered after
      # the first capped execute pass.
      if result["dry_run"] and result["passes_expected"] > 1:
          out += ["", "This is more than one execute pass handles (max_deletes=%s): expect %s "
                      "execute run(s), invoking the exact same command each time, to fully "
                      "drain it." % (_n(result["max_deletes"]), _n(result["passes_expected"]))]
      if result["stopped_early"]:
          # What "remains" is what is STILL ON THE TENANT, which is not_attempted PLUS failed -
          # a capped pass that also had failures leaves both behind, and "the rest" the next run
          # picks up is both. Formatting not_attempted alone undercounted, and disagreed with the
          # two rows of the table directly above that each say "still on the tenant". The
          # breakdown is appended only when there is one to give, so an uncontended capped pass
          # reads exactly as before.
          remaining = result["not_attempted_count"] + result["failed_count"]
          breakdown = ("" if not result["failed_count"] else
                       " (%s never attempted, %s failed)"
                       % (_n(result["not_attempted_count"]), _n(result["failed_count"])))
          out += ["", "Pass was bounded to %s of %s candidate(s) - %s remain%s. Run this exact "
                      "command again to continue draining the rest."
                  % (_n(result["max_deletes"]), _n(result["to_delete_count"]),
                     _n(remaining), breakdown)]

      if status in ("executed", "partial_failure"):
          if result["deleted"]:
              out += ["", "#### Deleted",
                      _md_capped(["Dataset"], [("`%s`" % n,) for n in result["deleted"]],
                                 "Yara.WipeAll.deleted")]
          if result["failed"]:
              out += ["", "#### Failed - still on the tenant",
                      _md_capped(["Dataset", "Reason", "Detail"],
                                 [("`%s`" % f["dataset"], "`%s`" % f["reason"], f["detail"])
                                  for f in result["failed"]], "Yara.WipeAll.failed"),
                      "", "_A failed delete leaves the dataset exactly as it was, so every "
                          "name here is simply a candidate again on the next run._"]
          if result["not_attempted"]:
              out += ["", "#### Not attempted - still on the tenant",
                      _md_capped(["Dataset"], [("`%s`" % n,) for n in result["not_attempted"]],
                                 "Yara.WipeAll.not_attempted")]
      elif result["to_delete"]:
          out += ["", "#### Would delete",
                  _md_capped(["Dataset"], [("`%s`" % n,) for n in result["to_delete"]],
                             "Yara.WipeAll.to_delete")]

      if result["preserved"]:
          out += ["", "#### Preserved - never touched",
                  _md_table(["Dataset", "Why", "Detail"],
                            [("`%s`" % p["dataset"], "`%s`" % p["reason"], p["detail"])
                             for p in result["preserved"]])]

      out += ["", "#### Settings this run used",
              _md_table(["Argument", "Value", "What it controls"], [
                  ("`execute`", "false - dry run" if result["dry_run"] else "true",
                   "false reports and deletes nothing; true deletes, and additionally "
                   "requires an exact confirm phrase"),
                  ("`confirm`", "not read on a dry run" if result["dry_run"] else "matched",
                   'must equal exactly "%s", or nothing is deleted no matter what execute '
                   "says" % CONFIRM_PHRASE),
                  ("`max_deletes`", _n(result["max_deletes"]) if result["max_deletes"]
                                    else "disabled",
                   "candidates ONE executed pass may delete, so it finishes inside the "
                   "platform's ~900s task timeout. A dry run ignores it"),
              ])]
      return "\n".join(out)


  def main():
      args = demisto.args()
      execute = bool(argToBoolean(args.get("execute"))) if args.get("execute") not in (None, "") else False
      confirm = str(args.get("confirm") or "")
      max_deletes_arg = args.get("max_deletes")
      try:
          max_deletes = (int(max_deletes_arg) if max_deletes_arg not in (None, "")
                        else DEFAULT_MAX_DELETES_PER_PASS)
      except (TypeError, ValueError):
          demisto.executeCommand("DeleteContext", {"key": "Yara.WipeAll"})
          return_error("YaraWipeAllDatasets: max_deletes must be a whole number ({!r} given). "
                       "Nothing was deleted.".format(max_deletes_arg))
          return
      if max_deletes <= 0:
          max_deletes = None   # 0 or negative disables the cap - an explicit, logged choice

      if execute and confirm != CONFIRM_PHRASE:
          demisto.executeCommand("DeleteContext", {"key": "Yara.WipeAll"})
          return_error(
              "YaraWipeAllDatasets: execute=true requires confirm to equal exactly \"{}\". "
              "Nothing was deleted.".format(CONFIRM_PHRASE))
          return

      # The log sink stays a sink: every fact it used to be the only carrier of - why a delete
      # failed, that a lock was taken over, that the pass was bounded - now travels in the
      # result dict, and the report is rendered from that. This only keeps the platform's
      # container log quiet.
      log_lines = []
      try:
          result = wipe_all(CoreApiClient(), execute=execute, max_deletes=max_deletes,
                            log=lambda m: log_lines.append(m))
      except Exception as ex:
          demisto.executeCommand("DeleteContext", {"key": "Yara.WipeAll"})
          return_error("YaraWipeAllDatasets failed: {}".format(ex))
          return

      # List-valued context is APPENDED to across repeated calls in one investigation; clear
      # it first so to_delete/deleted/failed never carry a prior call's entries.
      demisto.executeCommand("DeleteContext", {"key": "Yara.WipeAll"})
      return_results(CommandResults(
          readable_output=render_wipe_markdown(result),
          outputs_prefix="Yara.WipeAll",
          outputs=result,
          raw_response=result,
      ))


  if __name__ in ("__main__", "__builtin__", "builtins"):
      main()
