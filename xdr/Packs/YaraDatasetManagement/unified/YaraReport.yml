args:
- name: schema_version
  description: The scanner's current lookup schema version (YARA_LOOKUP_SCHEMA_VER on the endpoints; "4" if unset). Must be a whole number — a non-numeric value is rejected outright. Datasets on a HIGHER version are reported under "newer schema" and are never pruned by YaraCleanup — if this is stale, everything lands in that bucket.
  required: false
  isArray: false
  default: false
  secret: false
comment: 'Read-only inventory of every yara_scanner_* lookup dataset: kind, host and age in months, plus the legacy and newer-schema buckets. Never writes or deletes anything and issues a single API call — safe to run any time, including from a poll loop or alongside a consolidation pass. Flags the two conditions that need opposite advice: "frozen" (unsuffixed but rotated siblings exist — a pre-rotation leftover, not growing) and "not rotated" (unsuffixed with no rotated siblings — rotation is genuinely off for that deployment and the dataset will grow without bound until it goes write-dead). Per-scan consolidated targets are unsuffixed too but are consolidation OUTPUT, so they get their own "consolidated" state and are counted in neither bucket.'
commonfields:
  id: YaraReport
  version: -1
enabled: true
name: YaraReport
outputs:
- contextPath: Yara.Report.now_yyyymm
