- contextPath: Yara.Report.frozen
  description: Unsuffixed datasets that have rotated siblings — pre-rotation leftovers, frozen rather than growing.
  type: String
- contextPath: Yara.Report.frozen_count
  description: Number of frozen pre-rotation datasets.
  type: Number
- contextPath: Yara.Report.not_rotated
  description: Unsuffixed datasets with no rotated siblings — rotation is off and these grow without bound.
  type: String
