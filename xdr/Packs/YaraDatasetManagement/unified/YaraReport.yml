  description: The rendered fixed-width inventory table, as shown in the War Room.
  type: String
- contextPath: Yara.Report.datasets
  description: Per-dataset rows — name, kind, host, month, age_months, and state (rotated / frozen / not_rotated / consolidated / unrecognised).
  type: Unknown
- contextPath: Yara.Report.current_count
  description: Number of datasets on the current schema version.
