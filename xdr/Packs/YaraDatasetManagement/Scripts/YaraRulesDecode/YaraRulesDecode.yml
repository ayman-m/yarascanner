args:
- description: The base64 payload to decode - the same value the scanner takes as its yarafile input. Whitespace and missing padding are repaired automatically, so a blob pasted out of context or a report still works.
  isArray: false
  name: b64
  required: false
  secret: false
- description: War Room entry ID of a file containing the base64, used when b64 is not passed directly. Handy when the payload is too large to pass as an argument.
  isArray: false
  name: entry_id
  required: false
  secret: false
- description: A ruleset hash to check the decoded text against - for example the one in a dataset name, yara_scanner_full_v4_rules_<hash>. When given, the output states plainly whether the payload really is the ruleset that dataset was named for. A mismatch is reported as its own finding and does not by itself mark the decode as failed.
  isArray: false
  name: expected_hash
  required: false
  secret: false
- auto: PREDEFINED
  defaultValue: 'true'
  description: Hold the decoded text to the same structural standard YaraRulesFromFile applies before dispatch. Defaults to true. Set false to read a payload the gate would refuse - the text is still returned, which is exactly when reading it matters most.
  isArray: false
  name: validate
  predefined:
  - 'true'
  - 'false'
  required: false
  secret: false
- auto: PREDEFINED
  defaultValue: 'false'
  description: Also attach the decoded rules as a downloadable .yar file. Defaults to false, which keeps the output inline in the War Room.
  isArray: false
  name: as_file
  predefined:
  - 'true'
  - 'false'
  required: false
  secret: false
- defaultValue: '2097152'
  description: 'Size ceiling applied to the decoded text when validate is true. Must be a POSITIVE number of bytes and is rejected otherwise: 0 does not mean ''no ceiling'', it silently disables the size check while still reading like a strict setting, and a negative value refuses every payload - a valid ruleset included - as too_large against a limit nothing can be under. Defaults to 2097152 (2 MB), matching YaraRulesFromFile. To read a payload without any ceiling, pass validate=false, which the output states plainly. ASYMMETRY WITH YaraRulesFromFile, deliberate: 0 is REFUSED here, because pass validate=false to skip the size gate outright - an explicit argument beats a magic value that silently disables a guard while still reading like a strict ceiling. YaraRulesFromFile has no `validate` argument, so it accepts 0 as its only escape hatch and surfaces it as max_bytes=null. A negative value is refused by both.'
  isArray: false
  name: max_bytes
  required: false
  secret: false
comment: 'Decodes the scanner''s yarafile base64 back into readable YARA rules - the inverse of YaraRulesFromFile, and built for verification rather than convenience. A consolidated dataset is named after a ruleset hash (yara_scanner_full_v4_rules_<hash>), and a hash is one-way, so it cannot on its own answer "which rules produced these matches?". Passing the dispatched base64 here recomputes that hash from the text, so a match against expected_hash is proof the text is what the dataset was named for. Strict about the base64 alphabet on purpose: Python''s decoder silently discards stray characters, which would turn a corrupted payload into plausible garbage instead of an error, and this automation is meant to be trusted as evidence. Whitespace and missing padding are repaired, being artifacts of copy-paste rather than corruption. Note the round trip is normalising, not byte-exact - a UTF-8 BOM is stripped at encode time, so the decoded text, the hash and the dispatched bytes all agree with each other and all differ from a BOM-carrying original by that BOM. Needs no tenant credentials.'
commonfields:
  id: YaraRulesDecode
  version: -1
dockerimage: demisto/python3:3.11.10.116949
enabled: true
fromversion: 6.5.0
marketplaces:
- xsoar
- marketplacev2
name: YaraRulesDecode
outputs:
- contextPath: Yara.RulesDecoded.ok
  description: 'True if the payload decoded and - when validate is true - passed the structural checks. Branch on this. It is exactly `errors` being empty, in one field: `errors` is the authoritative side, because it says WHY. A hash mismatch never clears this flag; that finding lives in hash_matches.'
  type: Boolean
- contextPath: Yara.RulesDecoded.rules
  description: The decoded YARA rules text. Truncated to the first 4000 characters when the payload FAILED validation, so a bad payload can still be inspected without carrying megabytes through context - rules_truncated says when that happened, and size_bytes always describes the whole text rather than this field.
  type: String
- contextPath: Yara.RulesDecoded.rules_truncated
  description: True when `rules` holds only the first 4000 characters of the decoded text, which happens only on a validation failure. When true, len(rules) is deliberately smaller than size_bytes; when false the two describe the same text.
  type: Boolean
- contextPath: Yara.RulesDecoded.rule_hash
  description: First 12 hex of sha256 over the decoded text, computed exactly as the scanner and YaraRulesFromFile compute it. Empty when nothing decoded.
  type: String
- contextPath: Yara.RulesDecoded.expected_hash
  description: The hash that was supplied for comparison, echoed back. Empty when none was given.
  type: String
- contextPath: Yara.RulesDecoded.hash_matches
  description: 'The verdict of comparing rule_hash with expected_hash: true when they match, false when they do not, and NULL when no expected_hash was given or nothing decoded. Read this rather than comparing the two hashes yourself - it folds in the case-insensitive comparison and the third state, and a caller re-deriving it from the two hash fields cannot express ''not checked''. Deliberately never conflated with ok: ''this is not valid YARA'' and ''this is valid YARA, but not the ruleset you were told'' are different findings with different fixes.'
  type: Boolean
- contextPath: Yara.RulesDecoded.errors
  description: 'One OBJECT per refusal, never a sentence - keys below. At most one entry: every check returns at the first thing it finds, so this is a single verdict in a list. Empty exactly when ok is true.'
  type: Unknown
- contextPath: Yara.RulesDecoded.errors.reason
  description: 'A CLOSED set, safe to match on in a playbook: no_input, urlsafe_b64, bad_alphabet, invalid_b64, not_text, empty, too_large, pdf, binary, no_rules, unbalanced_braces, missing_conditions, unclassified. The last one means the shared validator''s wording drifted without this vocabulary being updated - a bug in the automation, not a state of the payload. A hash mismatch is NOT in this set: it is reported by hash_matches, because it does not make the rules invalid.'
  type: String
- contextPath: Yara.RulesDecoded.errors.detail
  description: The same refusal as a sentence, for a human reading the War Room. Naming what to fix is its job; matching on it is not - branch on reason.
  type: String
- contextPath: Yara.RulesDecoded.errors.stage
  description: 'Where the payload was refused: "decode" for the base64-and-text step, "validate" for the structural gate. Tells an operator whether to re-copy the payload or fix the ruleset, and is not derivable from reason - not_text can arise at either stage. Always "decode" when validate=false, since the gate never ran.'
  type: String
- contextPath: Yara.RulesDecoded.errors.observed
  description: 'The quantity the check actually measured, so it need not be read back out of the sentence: the decoded size for too_large, the signed brace depth for unbalanced_braces (positive is unclosed, negative is an unexpected close), the number of `condition:` sections for missing_conditions. NULL for every reason that is not a comparison - the key is still present on every entry.'
  type: Number
- contextPath: Yara.RulesDecoded.errors.limit
  description: 'What `observed` was compared against: max_bytes for too_large, 0 for unbalanced_braces (the balance every ruleset must reach), the rule count for missing_conditions. NULL for every reason that is not a comparison - the key is still present on every entry.'
  type: Number
- contextPath: Yara.RulesDecoded.rule_names
  description: The decoded rule names, in file order, as plain strings - identifiers out of the ruleset, not prose. Empty unless validate was true and the text got as far as the declaration scan. The authoritative list; the War Room table over it is capped at 50 rows, this is not.
  type: String
- contextPath: Yara.RulesDecoded.rule_count
  description: How many rule declarations the decoded text contains. Always len(rule_names) - kept beside the list as this pack's convention, so a count is readable without loading the list, and rule_names is the side to trust if they ever disagree.
  type: Number
- contextPath: Yara.RulesDecoded.size_bytes
  description: 'Size of the WHOLE decoded rules text in bytes, UTF-8, measured before any truncation. See rules_truncated: on a validation failure this is deliberately larger than the `rules` field it describes.'
  type: Number
- contextPath: Yara.RulesDecoded.validated
  description: Whether the structural gate ran - the `validate` argument as it was applied. False means ok=true says only 'this decoded to text', NOT 'this is a usable ruleset', which is the one case where ok alone would mislead a playbook.
  type: Boolean
- contextPath: Yara.RulesDecoded.max_bytes
  description: 'The size ceiling actually applied to the decoded text, in bytes. 0 is the ABSENCE of a ceiling, never a 0-byte one, and it has two causes: validate was false so the gate never ran at all, or the ceiling itself was disabled because max_bytes was falsy (the size check short-circuits on it). Read `validated` to tell those two apart. Reporting a ceiling that never ran would be a claim, so the War Room row says ''no size ceiling'' instead of naming 0 as one. The script refuses a non-positive max_bytes argument, so on a run driven through it only validate=false reaches 0 here. A too_large entry repeats this value in errors.limit, beside the size that broke it.'
  type: Number
script: '-'
subtype: python3
system: false
tags: []
timeout: 300
type: python
