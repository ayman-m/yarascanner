args:
- name: scan_id
  description: Restrict the preview to these scan_id(s), comma-separated.
  required: false
  isArray: true
  secret: false
- name: schema_version
  description: Lookup schema version to act on. Defaults to 4.
  required: false
  isArray: false
  defaultValue: '4'
  secret: false
- name: retention_hours
  description: A scan with no terminal lifecycle row is treated as finished past this age. Defaults to 24. Must match what the consolidation run will use, or this preview and that run disagree.
  required: false
  isArray: false
  defaultValue: '24'
  secret: false
comment: 'Read-only readiness check. Never writes or deletes. Previews exactly what YaraConsolidateSummary (compact) and YaraConsolidateApply (full detail) would group: which scans pass the finished-or-aged gate, and how they bucket by ruleset hash into consolidated datasets. It does NOT preview a scans-lifecycle merge - nothing performs one today.'
commonfields:
  id: YaraConsolidateStatus
  version: -1
enabled: true
name: YaraConsolidateStatus
outputs:
- contextPath: Yara.ConsolidateStatus.any_in_progress
  description: True if at least one scan is still running or settling.
  type: Boolean
- contextPath: Yara.ConsolidateStatus.eligible_count
  description: Number of scans ready to consolidate now.
  type: Number
- contextPath: Yara.ConsolidateStatus.eligible_scan_ids
  description: scan_id(s) ready to consolidate now.
  type: String
- contextPath: Yara.ConsolidateStatus.pending_scan_ids
  description: scan_id(s) still in progress (running, or settling).
  type: String
- contextPath: Yara.ConsolidateStatus.blocked_count
  description: Number of scans blocked (row ceiling or count mismatch).
  type: Number
- contextPath: Yara.ConsolidateStatus.blocked_scan_ids
  description: scan_id(s) blocked and needing attention.
  type: String
- contextPath: Yara.ConsolidateStatus.blocked_reasons
  description: Map of blocked scan_id to the specific reason it's blocked (e.g. row_ceiling_exceeded, count_mismatch).
  type: Unknown
script: '-'
system: false
tags: []
timeout: 900
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
fromversion: 6.5.0
marketplaces:
- xsoar
- marketplacev2
