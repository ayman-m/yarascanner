args:
- name: scan_id
  description: Restrict the preview to these scan_id(s), comma-separated.
  required: false
  isArray: true
  secret: false
- name: schema_version
  description: Lookup schema version to act on. Defaults to 4.
  required: false
  isArray: false
  defaultValue: '4'
  secret: false
- name: retention_hours
  description: A scan with no terminal lifecycle row is treated as finished past this age. Defaults to 24. Must match what the consolidation run will use, or this preview and that run disagree.
  required: false
  isArray: false
  defaultValue: '24'
  secret: false
- name: quiet_secs
  description: How long (seconds) a finished scan's newest match row must have been quiet before it counts as ready. Defaults to 900, and must match what YaraConsolidateApply and YaraConsolidateSummary use - this automation is their preview, and the playbook feeds its eligible_scan_ids straight into them. The scanner writes its terminal lifecycle row BEFORE draining the upload queue, so a scan can report completed while rows are still landing.
  required: false
  isArray: false
  defaultValue: '900'
  secret: false
comment: 'Read-only readiness check. Never writes or deletes. Previews exactly what YaraConsolidateSummary (compact) and YaraConsolidateApply (full detail) would group: which scans pass the finished-or-aged gate, and how they bucket by ruleset hash into consolidated datasets. It does NOT preview a scans-lifecycle merge - nothing performs one today.'
commonfields:
  id: YaraConsolidateStatus
  version: -1
enabled: true
name: YaraConsolidateStatus
outputs:
- contextPath: Yara.ConsolidateStatus.eligible_count
  description: How many scans passed the finished-or-aged gate and are ready for either consolidation mode.
  type: Number
- contextPath: Yara.ConsolidateStatus.eligible_scan_ids
  description: Those scan_ids. Feed straight into YaraConsolidateSummary or YaraConsolidateApply.
  type: String
- contextPath: Yara.ConsolidateStatus.pending_count
  description: Scans still in progress - not yet eligible.
  type: Number
- contextPath: Yara.ConsolidateStatus.pending_scan_ids
  description: Those scan_ids.
  type: String
- contextPath: Yara.ConsolidateStatus.group_count
  description: How many ruleset groups the ready scans fall into - i.e. how many consolidated datasets a run would produce.
  type: Number
- contextPath: Yara.ConsolidateStatus.groups
  description: 'Per ruleset hash: how many scans and which hosts land in that group.'
  type: Unknown
script: '-'
system: false
tags: []
timeout: 900
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
fromversion: 6.5.0
marketplaces:
- xsoar
- marketplacev2
