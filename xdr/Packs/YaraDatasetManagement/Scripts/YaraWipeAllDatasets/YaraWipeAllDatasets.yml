args:
- auto: PREDEFINED
  default: false
  defaultValue: 'false'
  description: THE DELETION OPT-IN. Leave false (the default) for a dry run that reports what would be deleted and deletes nothing. true, combined with a correct confirm phrase, deletes every yara_scanner_* dataset on the tenant except this pack's own run-log datasets and the consolidation lock.
  isArray: false
  name: execute
  predefined:
  - 'true'
  - 'false'
  required: false
  secret: false
- default: false
  description: Required when execute=true. Must equal, exactly and case-sensitively — DELETE ALL YARA DATASETS — or nothing is deleted, regardless of execute. There is no scoping argument on this automation (no older_than_months, no host filter, no schema check), so this phrase is the only thing standing between execute=true and every YARA dataset on the tenant.
  isArray: false
  name: confirm
  required: false
  secret: false
- default: false
  description: Caps a single EXECUTED pass so it finishes inside the platform's ~900s automation task timeout. Defaults to 100 — measured against delete_dataset's ~60s server-side cost at this automation's 12-way delete concurrency, roughly 500s (56% of budget). A tenant with more than that many candidates is drained over several re-runs, the same "bounded pass, re-run to continue" pattern YaraConsolidateApply's max_scans uses. Does not affect a dry run, which always reports the full candidate count regardless of this value. 0 or a negative number disables the cap — an explicit, logged choice, not the default.
  isArray: false
  name: max_deletes
  required: false
  secret: false
comment: 'Deletes EVERY yara_scanner_* lookup dataset on this tenant — host matches and scan lifecycle, old schema and new, per-scan consolidated targets and summary datasets alike. No scoping, no rules, no exceptions for schema version or dataset kind. This is the one automation in the pack that recognises none of the other five''s safety rails (YaraCleanup never deletes a live matches dataset or a consolidated target; YaraConsolidateApply is blocked from ever consuming one) — those protections exist because that data is normally irreplaceable, and this script exists specifically to override that, on purpose, for resetting a tenant to a clean slate before a test cycle. NOT part of any playbook — run it by hand, from the Playground or War Room, only when you deliberately want zero YARA data left on the tenant. Dry run by default: without execute=true this only reports what it would delete. execute=true additionally requires the confirm argument to equal an exact phrase, or nothing is deleted. Preserves only its own audit trail (yara_scanner_wipe_runs), the other two run-logs (yara_scanner_consolidation_runs, yara_scanner_cleanup_runs), and the consolidation lock, which it takes itself for the duration of an executed pass.'
commonfields:
  id: YaraWipeAllDatasets
  version: -1
dockerimage: demisto/python3:3.11.10.116949
enabled: true
fromversion: 6.5.0
marketplaces:
- xsoar
- marketplacev2
name: YaraWipeAllDatasets
outputs:
- contextPath: Yara.WipeAll.status
  description: 'The one field to branch on. A CLOSED set: "dry_run" (nothing was deleted; execute was not set), "skipped_locked" (nothing was deleted; another run held the consolidation lock), "executed" (the pass ran and every delete it attempted succeeded), "partial_failure" (the pass ran and at least one delete failed - see failed). It is the same value written to the mode column of the yara_scanner_wipe_runs audit row, derived once, so the run log and this context can never disagree. dry_run and lock_held_by_other_run below restate two of these four cases as booleans for convenience; status is authoritative.'
  type: String
- contextPath: Yara.WipeAll.dry_run
  description: True unless execute=true was passed with a correct confirm phrase. True exactly when status is "dry_run". Nothing was deleted, deleted is empty, and to_delete is the full candidate list this pass found.
  type: Boolean
- contextPath: Yara.WipeAll.total_found
  description: 'Every yara_scanner_* LOOKUP dataset found on the tenant, before exclusions. It is the census, not an independent measurement: it is always exactly to_delete_count plus the number of entries in preserved, because those two lists partition what was found.'
  type: Number
- contextPath: Yara.WipeAll.to_delete_count
  description: len(to_delete).
  type: Number
- contextPath: Yara.WipeAll.to_delete
  description: 'The CANDIDATE set: every dataset name this pass found that is not in the preserved list. It is what the pass INTENDED to delete, never a claim about what happened - deleted, failed and not_attempted partition this list exactly, in every mode, and those three are what say which datasets are actually gone. A list of plain dataset names, deliberately: each element carries one identifier and nothing else.'
  type: String
- contextPath: Yara.WipeAll.deleted_count
  description: len(deleted).
  type: Number
- contextPath: Yara.WipeAll.deleted
  description: The dataset names this pass actually deleted, as plain strings. Empty on a dry run and on a lock standdown. A name a delete found already missing counts as deleted - the desired end state was reached - and does not appear in failed.
  type: String
- contextPath: Yara.WipeAll.failed_count
  description: len(failed).
  type: Number
- contextPath: Yara.WipeAll.failed
  description: One OBJECT per candidate whose deletion raised, with the reason that used to exist only in a log line nothing ever read. Every one of these datasets is still on the tenant, so re-running is safe and picks them up again. Keys below.
  type: Unknown
- contextPath: Yara.WipeAll.failed.dataset
  description: The dataset whose deletion failed.
  type: String
- contextPath: Yara.WipeAll.failed.reason
  description: 'A CLOSED set, safe to match on in a playbook: auth_error (HTTP 401/403), rate_limited (HTTP 429), server_error (HTTP 5xx after the client''s own retries), http_error (any other non-200), timeout (no response inside the request timeout - the delete may in fact have landed), network_error (connection, DNS or TLS - the call never reached the tenant), unknown (unclassified; read detail). There is no not_found code: a dataset that is already gone is reported as deleted, not as a failure.'
  type: String
- contextPath: Yara.WipeAll.failed.detail
  description: The underlying error text, truncated to 200 characters. The sentence a human reads; never match on it.
  type: String
- contextPath: Yara.WipeAll.not_attempted_count
  description: len(not_attempted).
  type: Number
- contextPath: Yara.WipeAll.not_attempted
  description: Candidates from to_delete that this pass never tried to delete, as plain names - to_delete minus deleted minus failed, so the three always partition to_delete exactly. This is what a capped pass leaves owed to the next run (see stopped_early and max_deletes). On a dry run and on a lock standdown nothing is ever attempted, so it equals to_delete; status says which case you are in.
  type: String
- contextPath: Yara.WipeAll.preserved
  description: 'One OBJECT per dataset that was never a deletion candidate at all - this pack''s own run-logs and the consolidation lock. Never touched in any mode. There is no preserved_count key: this list is at most the four names the script''s PRESERVED_DATASETS holds. Keys below.'
  type: Unknown
- contextPath: Yara.WipeAll.preserved.dataset
  description: The preserved dataset name.
  type: String
- contextPath: Yara.WipeAll.preserved.reason
  description: 'A CLOSED set: "consolidation_lock" (the pack''s mutual-exclusion marker - transient, taken and released around an executed pass rather than wiped) or "run_log" (an audit trail; deleting the record of a wipe defeats the reason the record exists).'
  type: String
- contextPath: Yara.WipeAll.preserved.detail
  description: Which trail it is, in a sentence - e.g. YaraCleanup's run log, or this script's own.
  type: String
- contextPath: Yara.WipeAll.lock_held_by_other_run
  description: True if this run stood down because the consolidation lock was held by another concurrent run, or because its marker existed with no readable row (the create-lag window right after another run took it). Nothing was deleted in that case. True exactly when status is "skipped_locked".
  type: Boolean
- contextPath: Yara.WipeAll.lock_taken_over
  description: THE MOST CONSEQUENTIAL FLAG THIS AUTOMATION REPORTS. True when this pass found another run's lock marker, judged it stale, and DELETED DATASETS ANYWAY. If that judgement was wrong - a consolidation pass was still running - this wipe destroyed its source datasets underneath it, and the consolidation will report success over data that no longer exists. Alert on this. It is true exactly when lock_takeover.reason is non-empty; the boolean is the branch, the object beside it is the evidence.
  type: Boolean
- contextPath: Yara.WipeAll.lock_takeover
  description: 'The lock-steal event as fields rather than as a sentence. ALWAYS PRESENT with all three keys: reason is empty and age_secs is null when no takeover happened, so a filter on it never silently matches nothing. Keys below.'
  type: Unknown
- contextPath: Yara.WipeAll.lock_takeover.reason
  description: 'A CLOSED set: "lock_stale" (the marker carried a readable start time older than the 20-minute staleness window, so the run that wrote it is presumed dead) or "lock_unreadable" (the marker existed with no readable row) - and "" when no takeover happened. Only lock_stale is reachable from this automation, which passes unreadable_is_held=True and stands down rather than taking over an unreadable marker; lock_unreadable is declared because the shared lock helper can still emit it.'
  type: String
- contextPath: Yara.WipeAll.lock_takeover.age_secs
  description: How old the stolen marker was, in seconds, as reported by the lock helper. Null when no takeover happened or the marker carried no readable age. Compare it against the runtime of the automation you think held the lock.
  type: Number
- contextPath: Yara.WipeAll.lock_takeover.detail
  description: The lock helper's own sentence about the takeover. Empty when none happened.
  type: String
- contextPath: Yara.WipeAll.stopped_early
  description: True if there were more candidates than max_deletes allowed in this pass. What is still on the tenant is not_attempted PLUS failed - a capped pass that also had failures leaves both, so reading not_attempted alone UNDERCOUNTS the remainder. The report says the same thing one line away ("N remain (X never attempted, Y failed)"). Re-run the exact same command to continue draining; a failed candidate is retried, it is not skipped. Always false on a dry run and on a standdown, neither of which attempts anything.
  type: Boolean
- contextPath: Yara.WipeAll.max_deletes
  description: The per-pass deletion cap this run actually used, or null when the cap was disabled (the argument was 0 or negative). Published because the report states it and a capped pass cannot be interpreted without it.
  type: Number
- contextPath: Yara.WipeAll.passes_expected
  description: 'How many execute passes of max_deletes it takes to drain to_delete_count from scratch: 0 when there are no candidates, 1 when everything fits or the cap is disabled. A computed verdict, published rather than left to the caller, because ceil division against an optional cap is exactly the arithmetic a playbook gets wrong. An executed pass has already performed one of them.'
  type: Number
script: '-'
subtype: python3
system: false
tags: []
timeout: 1800
type: python
