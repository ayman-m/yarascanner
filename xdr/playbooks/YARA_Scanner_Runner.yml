id: YARA_Scanner_Runner
version: -1
name: YARA Scanner Runner
description: 'Runs the YARA scanner (xdr_yara_scanner.py) on targeted Cortex agents via Action Center.

  Flow: resolve the script UID from the library by name (core-get-scripts) -> resolve target

  endpoints (core-get-endpoints) -> execute the scanner with its parameters (core-script-run).


  Uses the built-in "Cortex Core - IR" integration, which is available on Cortex XDR (edr),

  XSIAM, and cloud_runtime_security. Designed to be run manually or as a scheduled Job.


  PREREQUISITE: the scanner must already exist in the Action Center script library (upload via

  the console once) with entry point `main` and string inputs, in order:

  yarafile, scan_folder, alert_severity, mode, options.'
starttaskid: '0'
tasks:
  '0':
    id: '0'
    taskid: 4b1c0a10-0000-0000-0000-000000000000
    type: start
    task:
      id: 4b1c0a10-0000-0000-0000-000000000000
      version: -1
      name: ''
      iscommand: false
      brand: ''
    nexttasks:
      '#none#':
      - '1'
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 450, "y": 50}}'
  '1':
    id: '1'
    taskid: 4b1c0a10-0000-0000-0000-000000000001
    type: regular
    task:
      id: 4b1c0a10-0000-0000-0000-000000000001
      version: -1
      name: Resolve script UID
      description: Get the list of library scripts and match the one named by inputs.script_name.
      script: Cortex Core - IR|||core-get-scripts
      type: regular
      iscommand: true
      brand: Cortex Core - IR
    scriptarguments:
      script_name:
        simple: ${inputs.script_name}
    nexttasks:
      '#none#':
      - '2'
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 450, "y": 195}}'
  '2':
    id: '2'
    taskid: 4b1c0a10-0000-0000-0000-000000000002
    type: regular
    task:
      id: 4b1c0a10-0000-0000-0000-000000000002
      version: -1
      name: Store script UID
      description: Save the resolved script_uid to context.
      script: SetAndHandleEmpty
      type: regular
      iscommand: false
      brand: ''
    scriptarguments:
      key:
        simple: script_uuid
      value:
        simple: ${Core.Scripts.script_uid}
      append:
        simple: 'false'
    nexttasks:
      '#none#':
      - '7'
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 450, "y": 340}}'
  '3':
    id: '3'
    taskid: 4b1c0a10-0000-0000-0000-000000000003
    type: regular
    task:
      id: 4b1c0a10-0000-0000-0000-000000000003
      version: -1
      name: Get target endpoints
      description: Resolve connected endpoints by hostname and/or group.
      script: Cortex Core - IR|||core-get-endpoints
      type: regular
      iscommand: true
      brand: Cortex Core - IR
    scriptarguments:
      hostname:
        complex:
          root: inputs.endpoint_hostnames
          transformers:
          - operator: join
            args:
              separator:
                value:
                  simple: ','
      group_name:
        complex:
          root: inputs.endpoint_groups
          transformers:
          - operator: join
            args:
              separator:
                value:
                  simple: ','
      status:
        simple: connected
    nexttasks:
      '#none#':
      - '4'
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 450, "y": 630}}'
  '4':
    id: '4'
    taskid: 4b1c0a10-0000-0000-0000-000000000004
    type: regular
    task:
      id: 4b1c0a10-0000-0000-0000-000000000004
      version: -1
      name: Collect endpoint IDs
      description: Extract endpoint IDs from the resolved endpoints into context.
      script: SetAndHandleEmpty
      type: regular
      iscommand: false
      brand: ''
    scriptarguments:
      key:
        simple: endpoint_id
      value:
        simple: ${Core.Endpoint.endpoint_id}
      append:
        simple: 'false'
    nexttasks:
      '#none#':
      - '9'
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 450, "y": 775}}'
  '5':
    id: '5'
    taskid: 4b1c0a10-0000-0000-0000-000000000005
    type: regular
    task:
      id: 4b1c0a10-0000-0000-0000-000000000005
      version: -1
      name: Run YARA scanner
      description: Execute the scanner from the library on the resolved endpoints, passing its parameters.
      script: Cortex Core - IR|||core-script-run
      type: regular
      iscommand: true
      brand: Cortex Core - IR
    scriptarguments:
      script_uid:
        simple: ${script_uuid}
      endpoint_ids:
        complex:
          root: endpoint_id
          transformers:
          - operator: join
            args:
              separator:
                value:
                  simple: ','
      parameters:
        simple: '{"yarafile":"${inputs.yarafile}","scan_folder":"${inputs.scan_folder}","alert_severity":"${inputs.alert_severity}"}'
      timeout:
        simple: ${inputs.timeout}
    nexttasks:
      '#none#':
      - '6'
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 450, "y": 1065}}'
  '6':
    id: '6'
    taskid: 4b1c0a10-0000-0000-0000-000000000006
    type: title
    task:
      id: 4b1c0a10-0000-0000-0000-000000000006
      version: -1
      name: Done
      type: title
      iscommand: false
      brand: ''
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 450, "y": 1210}}'
  '7':
    id: '7'
    taskid: 4b1c0a10-0000-0000-0000-000000000007
    type: condition
    task:
      id: 4b1c0a10-0000-0000-0000-000000000007
      version: -1
      name: Scan all, or a named scope?
      type: condition
      iscommand: false
      brand: ''
      description: '`all` scans every CONNECTED endpoint. Anything else is treated as an explicit scope. Blank is
        neither, and stops the playbook rather than quietly meaning everything.'
    separatecontext: false
    continueonerrortype: ''
    conditions:
    - label: all
      condition:
      - - operator: isEqualString
          left:
            value:
              simple: inputs.endpoint_groups
            iscontext: true
          right:
            value:
              simple: all
          ignorecase: true
    - label: scoped
      condition:
      - - operator: isExists
          left:
            value:
              simple: inputs.endpoint_groups
            iscontext: true
        - operator: isExists
          left:
            value:
              simple: inputs.endpoint_hostnames
            iscontext: true
    nexttasks:
      all:
      - '8'
      scoped:
      - '3'
      '#default#':
      - '10'
    view: '{"position": {"x": 450, "y": 485}}'
  '8':
    id: '8'
    taskid: 4b1c0a10-0000-0000-0000-000000000008
    type: regular
    task:
      id: 4b1c0a10-0000-0000-0000-000000000008
      version: -1
      name: Get ALL connected endpoints
      description: The `all` branch. No hostname or group filter - only status, so every connected endpoint on the
        tenant is a target. Reached only when an operator typed `all`, never by leaving an input blank.
      script: Cortex Core - IR|||core-get-endpoints
      type: regular
      iscommand: true
      brand: Cortex Core - IR
    scriptarguments:
      status:
        simple: connected
    nexttasks:
      '#none#':
      - '4'
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 700, "y": 630}}'
  '9':
    id: '9'
    taskid: 4b1c0a10-0000-0000-0000-000000000009
    type: condition
    task:
      id: 4b1c0a10-0000-0000-0000-000000000009
      version: -1
      name: Any endpoints resolved?
      type: condition
      iscommand: false
      brand: ''
      description: A misspelled group, or a group whose members are all disconnected, resolves to nothing. Without
        this the playbook dispatches to an empty target list and completes green having scanned no host.
    separatecontext: false
    continueonerrortype: ''
    conditions:
    - label: found
      condition:
      - - operator: isExists
          left:
            value:
              simple: endpoint_id
            iscontext: true
    nexttasks:
      found:
      - '5'
      '#default#':
      - '11'
    view: '{"position": {"x": 450, "y": 920}}'
  '10':
    id: '10'
    taskid: 4b1c0a10-0000-0000-0000-000000000010
    type: title
    task:
      id: 4b1c0a10-0000-0000-0000-000000000010
      version: -1
      name: STOPPED - no scope given (use `all` or a group)
      type: title
      iscommand: false
      brand: ''
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 150, "y": 630}}'
  '11':
    id: '11'
    taskid: 4b1c0a10-0000-0000-0000-000000000011
    type: title
    task:
      id: 4b1c0a10-0000-0000-0000-000000000011
      version: -1
      name: STOPPED - no connected endpoint matched
      type: title
      iscommand: false
      brand: ''
    separatecontext: false
    continueonerrortype: ''
    view: '{"position": {"x": 150, "y": 1065}}'
view: "{\n  \"linkLabelsPosition\": {},\n  \"paper\": {\n    \"dimensions\": {\n      \"height\": 1460,\n      \"\
