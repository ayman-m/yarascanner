<svg width="100%" viewBox="0 0 680 2519" role="img">
<title>YaraCleanup - what the script does, step by step</title>
<desc>Workflow of YaraCleanup (in the tenant (Cortex automation script)): Prune aged-out datasets; dry run by default. Each step names the function responsible; the reference blocks list every API endpoint it calls and every lookup dataset it touches.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  .band-bg { fill: var(--bg2); stroke: var(--b); }
  .band-txt { font-size: 13px; font-weight: 600; }
  .fn { font-size: 11px; font-family: var(--font-mono); opacity: 0.8; }
  .phase { font-size: 11px; font-weight: 600; fill: var(--text-secondary); }
</style>
<rect class="band-bg" x="40" y="20" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="36" text-anchor="middle" dominant-baseline="central">YaraCleanup  -  Prune aged-out datasets; dry run by default</text>
<rect x="60" y="68" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="81" text-anchor="middle" dominant-baseline="central">runs in the tenant (Cortex automation script)  -  DESTRUCTIVE</text>
<g class="node c-gray"><rect x="60" y="110" width="560" height="58" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="132" dominant-baseline="central">API base</text>
<text class="ts" x="606" y="132" text-anchor="end" dominant-baseline="central">https://api-&lt;tenant&gt;.xdr.&lt;region&gt;.paloaltonetworks.com</text>
<text class="fn" x="74" y="152" dominant-baseline="central">Delivered via</text>
<text class="ts" x="606" y="152" text-anchor="end" dominant-baseline="central">POST /xsoar/automation/import (multipart file=unified yml)</text>
</g>
<rect x="60" y="174" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="187" text-anchor="middle" dominant-baseline="central">Same tenant host, HMAC-signed with the same Advanced key as the calls above</text>
<g class="node c-blue"><rect x="60" y="220" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">YaraCleanup runs</text>
<text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">reads the task's arguments</text>
<text class="fn" x="340" y="278" text-anchor="middle" dominant-baseline="central">main</text>
</g>
<line x1="340" y1="296" x2="340" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="318" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="336" text-anchor="middle" dominant-baseline="central">Validate arguments</text>
<text class="ts" x="340" y="355" text-anchor="middle" dominant-baseline="central">schema ver numeric; quiet-hrs floor</text>
<text class="fn" x="340" y="376" text-anchor="middle" dominant-baseline="central">set_schema_version</text>
</g>
<line x1="340" y1="394" x2="340" y2="416" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="416" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="434" text-anchor="middle" dominant-baseline="central">Anything requested?</text>
<text class="ts" x="340" y="453" text-anchor="middle" dominant-baseline="central">no window, no legacy = no-op</text>
<text class="fn" x="340" y="474" text-anchor="middle" dominant-baseline="central">prune_datasets</text>
</g>
<line x1="340" y1="492" x2="340" y2="514" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="514" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="532" text-anchor="middle" dominant-baseline="central">Take consolidation lock</text>
<text class="ts" x="340" y="551" text-anchor="middle" dominant-baseline="central">execute only; unreadable = held</text>
<text class="fn" x="340" y="572" text-anchor="middle" dominant-baseline="central">acquire_consolidation_lock</text>
</g>
<line x1="340" y1="590" x2="340" y2="612" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="612" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="630" text-anchor="middle" dominant-baseline="central">Bucket by schema version</text>
<text class="ts" x="340" y="649" text-anchor="middle" dominant-baseline="central">current, legacy, newer; rail 4</text>
<text class="fn" x="340" y="670" text-anchor="middle" dominant-baseline="central">classify_yara_datasets</text>
</g>
<line x1="340" y1="688" x2="340" y2="710" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="710" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="728" text-anchor="middle" dominant-baseline="central">Select by name, two paths</text>
<text class="ts" x="340" y="747" text-anchor="middle" dominant-baseline="central">name-derived rails 1-5 applied</text>
<text class="fn" x="340" y="768" text-anchor="middle" dominant-baseline="central">prune_datasets</text>
</g>
<line x1="340" y1="786" x2="192" y2="816" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="786" x2="487" y2="816" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="816" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="192" y="834" text-anchor="middle" dominant-baseline="central">Retention window</text>
<text class="ts" x="192" y="853" text-anchor="middle" dominant-baseline="central">rotated &gt; N months</text>
<text class="fn" x="192" y="874" text-anchor="middle" dominant-baseline="central">months_between</text>
</g>
<g class="node c-green"><rect x="355" y="816" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="487" y="834" text-anchor="middle" dominant-baseline="central">delete_legacy</text>
<text class="ts" x="487" y="853" text-anchor="middle" dominant-baseline="central">old/unversioned _vN</text>
<text class="fn" x="487" y="874" text-anchor="middle" dominant-baseline="central">classify_yara_datasets</text>
</g>
<line x1="192" y1="892" x2="340" y2="922" class="arr" marker-end="url(#arrow)"/>
<line x1="487" y1="892" x2="340" y2="922" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="922" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="940" text-anchor="middle" dominant-baseline="central">Live rails 6 and 7</text>
<text class="ts" x="340" y="959" text-anchor="middle" dominant-baseline="central">queries tenant; errors keep it</text>
<text class="fn" x="340" y="980" text-anchor="middle" dominant-baseline="central">_live_rails</text>
</g>
<line x1="340" y1="998" x2="340" y2="1020" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="1020" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1038" text-anchor="middle" dominant-baseline="central">Dry run or execute?</text>
<text class="ts" x="340" y="1057" text-anchor="middle" dominant-baseline="central">execute=false is the default</text>
<text class="fn" x="340" y="1078" text-anchor="middle" dominant-baseline="central">prune_datasets</text>
</g>
<line x1="340" y1="1096" x2="192" y2="1126" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="1096" x2="487" y2="1126" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="1126" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="192" y="1144" text-anchor="middle" dominant-baseline="central">Dry run (default)</text>
<text class="ts" x="192" y="1163" text-anchor="middle" dominant-baseline="central">lists, deletes none</text>
<text class="fn" x="192" y="1184" text-anchor="middle" dominant-baseline="central">prune_datasets</text>
</g>
<g class="node c-green"><rect x="355" y="1126" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="487" y="1144" text-anchor="middle" dominant-baseline="central">execute=true</text>
<text class="ts" x="487" y="1163" text-anchor="middle" dominant-baseline="central">real, no undo</text>
<text class="fn" x="487" y="1184" text-anchor="middle" dominant-baseline="central">delete_dataset</text>
</g>
<line x1="192" y1="1202" x2="340" y2="1232" class="arr" marker-end="url(#arrow)"/>
<line x1="487" y1="1202" x2="340" y2="1232" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="1232" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1250" text-anchor="middle" dominant-baseline="central">Delete whole datasets</text>
<text class="ts" x="340" y="1269" text-anchor="middle" dominant-baseline="central">one call each; failures logged</text>
<text class="fn" x="340" y="1290" text-anchor="middle" dominant-baseline="central">delete_dataset</text>
</g>
<line x1="340" y1="1308" x2="340" y2="1330" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="1330" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1348" text-anchor="middle" dominant-baseline="central">Record the run</text>
<text class="ts" x="340" y="1367" text-anchor="middle" dominant-baseline="central">one row: mode, counts, reasons</text>
<text class="fn" x="340" y="1388" text-anchor="middle" dominant-baseline="central">record_cleanup_run</text>
</g>
<line x1="340" y1="1406" x2="340" y2="1428" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="60" y="1428" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1446" text-anchor="middle" dominant-baseline="central">Release lock, report</text>
<text class="ts" x="340" y="1465" text-anchor="middle" dominant-baseline="central">finally block; War Room output</text>
<text class="fn" x="340" y="1486" text-anchor="middle" dominant-baseline="central">release_consolidation_lock</text>
</g>
<rect class="band-bg" x="40" y="1538" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1554" text-anchor="middle" dominant-baseline="central">API endpoints called</text>
<g class="node c-blue"><rect x="60" y="1586" width="560" height="158" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="1608" dominant-baseline="central">/public_api/v1/xql/get_datasets/</text>
<text class="ts" x="606" y="1608" text-anchor="end" dominant-baseline="central">list all lookup datasets</text>
<text class="fn" x="74" y="1628" dominant-baseline="central">/public_api/v1/xql/start_xql_query/</text>
<text class="ts" x="606" y="1628" text-anchor="end" dominant-baseline="central">start an XQL query</text>
<text class="fn" x="74" y="1648" dominant-baseline="central">/public_api/v1/xql/get_query_results/</text>
<text class="ts" x="606" y="1648" text-anchor="end" dominant-baseline="central">poll for XQL results</text>
<text class="fn" x="74" y="1668" dominant-baseline="central">/public_api/v1/xql/get_query_results_stream/</text>
<text class="ts" x="606" y="1668" text-anchor="end" dominant-baseline="central">fetch large result sets</text>
<text class="fn" x="74" y="1688" dominant-baseline="central">/public_api/v1/xql/add_dataset/</text>
<text class="ts" x="606" y="1688" text-anchor="end" dominant-baseline="central">create lock + audit datasets</text>
<text class="fn" x="74" y="1708" dominant-baseline="central">/public_api/v1/xql/lookups/add_data/</text>
<text class="ts" x="606" y="1708" text-anchor="end" dominant-baseline="central">write lock and audit rows</text>
<text class="fn" x="74" y="1728" dominant-baseline="central">/public_api/v2/xql/delete_dataset/</text>
<text class="ts" x="606" y="1728" text-anchor="end" dominant-baseline="central">delete datasets and the lock</text>
</g>
<rect class="band-bg" x="40" y="1778" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1794" text-anchor="middle" dominant-baseline="central">Datasets touched</text>
<g class="node c-purple"><rect x="60" y="1826" width="560" height="138" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="1848" dominant-baseline="central">yara_scanner_*_v&lt;N&gt;_&lt;host&gt;_&lt;YYYYMM&gt;</text>
<text class="ts" x="606" y="1848" text-anchor="end" dominant-baseline="central">read + delete</text>
<text class="fn" x="74" y="1868" dominant-baseline="central">yara_scanner_matches_v4_&lt;host&gt;</text>
<text class="ts" x="606" y="1868" text-anchor="end" dominant-baseline="central">read only, never deleted</text>
<text class="fn" x="74" y="1888" dominant-baseline="central">yara_scanner_&lt;kind&gt;_v&lt;N&gt;_scan_&lt;slug&gt;</text>
<text class="ts" x="606" y="1888" text-anchor="end" dominant-baseline="central">read (count) only</text>
<text class="fn" x="74" y="1908" dominant-baseline="central">yara_matches_* / yara_scans_* (legacy)</text>
<text class="ts" x="606" y="1908" text-anchor="end" dominant-baseline="central">delete only with flag</text>
<text class="fn" x="74" y="1928" dominant-baseline="central">yara_scanner_consolidation_lock</text>
<text class="ts" x="606" y="1928" text-anchor="end" dominant-baseline="central">create, write, delete</text>
<text class="fn" x="74" y="1948" dominant-baseline="central">yara_scanner_cleanup_runs</text>
<text class="ts" x="606" y="1948" text-anchor="end" dominant-baseline="central">create + append 1 row</text>
</g>
<rect class="band-bg" x="40" y="1998" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="2014" text-anchor="middle" dominant-baseline="central">Safety rails</text>
<g class="node c-amber"><rect x="60" y="2046" width="560" height="249" rx="8" stroke-width="0.5"/>
<text class="ts" x="74" y="2068" dominant-baseline="central">- Rail 1: never the current month - a scan may be writing</text>
<text class="ts" x="74" y="2089" dominant-baseline="central">- Rail 2: never a future month (clock skew)</text>
<text class="ts" x="74" y="2110" dominant-baseline="central">- Rail 3: never an unsuffixed dataset - all host history</text>
<text class="ts" x="74" y="2131" dominant-baseline="central">- Rail 4: never a NEWER schema version than assumed</text>
<text class="ts" x="74" y="2152" dominant-baseline="central">- Rail 5: never a name outside the yara_scanner_* contract</text>
<text class="ts" x="74" y="2173" dominant-baseline="central">- Rail 6: never written to within min_quiet_hours</text>
<text class="ts" x="74" y="2194" dominant-baseline="central">- Rail 7: never holding an unconsolidated scan</text>
<text class="ts" x="74" y="2215" dominant-baseline="central">- Dry run unless execute=true; no default window</text>
<text class="ts" x="74" y="2236" dominant-baseline="central">- Takes the consolidation lock before evaluating rails</text>
<text class="ts" x="74" y="2257" dominant-baseline="central">- Rails 6-7 fail closed: a query error keeps the dataset</text>
<text class="ts" x="74" y="2278" dominant-baseline="central">- min_quiet_hours floored at 1h; 0 would disable rail 6</text>
</g>
<rect class="band-bg" x="40" y="2329" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="2345" text-anchor="middle" dominant-baseline="central">On a tenant with no YARA datasets yet</text>
<g class="node c-green"><rect x="60" y="2377" width="560" height="102" rx="8" stroke-width="0.5"/>
<text class="ts" x="74" y="2399" dominant-baseline="central">- Bare run refuses: no window given, so nothing is selected</text>
<text class="ts" x="74" y="2420" dominant-baseline="central">- execute=true alone STILL deletes nothing without a window</text>
<text class="ts" x="74" y="2441" dominant-baseline="central">- With a window: DRY RUN 0 would be deleted / EXECUTED 0 deleted</text>
<text class="ts" x="74" y="2462" dominant-baseline="central">- execute=true takes ~90s of fixed lock cost even deleting nothing</text>
</g>
</svg>
