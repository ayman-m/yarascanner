<svg width="100%" viewBox="0 0 680 2099" role="img">
<title>xdr/xdr_yara_scanner.py - what the script does, step by step</title>
<desc>Workflow of xdr/xdr_yara_scanner.py (on the endpoint (Action Center payload)): Scan an endpoint with YARA and deliver every hit. Each step names the function responsible; the reference blocks list every API endpoint it calls and every lookup dataset it touches.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  .band-bg { fill: var(--bg2); stroke: var(--b); }
  .band-txt { font-size: 13px; font-weight: 600; }
  .fn { font-size: 11px; font-family: var(--font-mono); opacity: 0.8; }
  .phase { font-size: 11px; font-weight: 600; fill: var(--text-secondary); }
</style>
<rect class="band-bg" x="40" y="20" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="36" text-anchor="middle" dominant-baseline="central">xdr/xdr_yara_scanner.py  -  Scan an endpoint with YARA and deliver every hit</text>
<rect x="60" y="68" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="81" text-anchor="middle" dominant-baseline="central">runs on the endpoint (Action Center payload)  -  DESTRUCTIVE</text>
<g class="node c-gray"><rect x="60" y="110" width="560" height="58" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="132" dominant-baseline="central">API base</text>
<text class="ts" x="606" y="132" text-anchor="end" dominant-baseline="central">https://api-&lt;tenant&gt;.xdr.&lt;region&gt;.paloaltonetworks.com</text>
<text class="fn" x="74" y="152" dominant-baseline="central">Delivered via</text>
<text class="ts" x="606" y="152" text-anchor="end" dominant-baseline="central">Action Center -&gt; Scripts -&gt; Upload Script (console only)</text>
</g>
<rect x="60" y="174" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="187" text-anchor="middle" dominant-baseline="central">No public API for this one - a one-time manual step, then dispatched per scan</text>
<g class="node c-blue"><rect x="60" y="220" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">Scan starts on the endpoint</text>
<text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">One Action Center entry point</text>
<text class="fn" x="340" y="278" text-anchor="middle" dominant-baseline="central">main</text>
</g>
<line x1="340" y1="296" x2="340" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="318" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="336" text-anchor="middle" dominant-baseline="central">Scan or cancel?</text>
<text class="ts" x="340" y="355" text-anchor="middle" dominant-baseline="central">mode=cancel never scans anything</text>
<text class="fn" x="340" y="376" text-anchor="middle" dominant-baseline="central">run</text>
</g>
<line x1="340" y1="394" x2="192" y2="424" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="394" x2="487" y2="424" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="424" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="192" y="442" text-anchor="middle" dominant-baseline="central">Scan</text>
<text class="ts" x="192" y="461" text-anchor="middle" dominant-baseline="central">decode + compile</text>
<text class="fn" x="192" y="482" text-anchor="middle" dominant-baseline="central">decode_yara_rules</text>
</g>
<g class="node c-green"><rect x="355" y="424" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="487" y="442" text-anchor="middle" dominant-baseline="central">Cancel</text>
<text class="ts" x="487" y="461" text-anchor="middle" dominant-baseline="central">write cancel.flag</text>
<text class="fn" x="487" y="482" text-anchor="middle" dominant-baseline="central">_handle_cancel_request</text>
</g>
<line x1="192" y1="500" x2="340" y2="530" class="arr" marker-end="url(#arrow)"/>
<line x1="487" y1="500" x2="340" y2="530" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="530" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="548" text-anchor="middle" dominant-baseline="central">Compile the YARA ruleset</text>
<text class="ts" x="340" y="567" text-anchor="middle" dominant-baseline="central">Cache hit, else a fresh compile</text>
<text class="fn" x="340" y="588" text-anchor="middle" dominant-baseline="central">_load_or_compile_rules</text>
</g>
<line x1="340" y1="606" x2="340" y2="628" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="628" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="646" text-anchor="middle" dominant-baseline="central">Create the two datasets</text>
<text class="ts" x="340" y="665" text-anchor="middle" dominant-baseline="central">Probe first, create if missing</text>
<text class="fn" x="340" y="686" text-anchor="middle" dominant-baseline="central">_ensure_datasets</text>
</g>
<line x1="340" y1="704" x2="340" y2="726" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="726" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="744" text-anchor="middle" dominant-baseline="central">Overwrite old match rows</text>
<text class="ts" x="340" y="763" text-anchor="middle" dominant-baseline="central">Deletes every earlier scan_id row</text>
<text class="fn" x="340" y="784" text-anchor="middle" dominant-baseline="central">_flush_stale_matches</text>
</g>
<line x1="340" y1="802" x2="340" y2="824" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="824" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="842" text-anchor="middle" dominant-baseline="central">Start workers, walk targets</text>
<text class="ts" x="340" y="861" text-anchor="middle" dominant-baseline="central">Emits the 'initiated' row first</text>
<text class="fn" x="340" y="882" text-anchor="middle" dominant-baseline="central">scan_system</text>
</g>
<line x1="340" y1="900" x2="340" y2="922" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="922" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="940" text-anchor="middle" dominant-baseline="central">YARA-match each file</text>
<text class="ts" x="340" y="959" text-anchor="middle" dominant-baseline="central">Skips huge, special, symlink files</text>
<text class="fn" x="340" y="980" text-anchor="middle" dominant-baseline="central">scan_file</text>
</g>
<line x1="340" y1="998" x2="340" y2="1020" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="1020" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1038" text-anchor="middle" dominant-baseline="central">CPU governor paces the scan</text>
<text class="ts" x="340" y="1057" text-anchor="middle" dominant-baseline="central">Sleeps to hold its own CPU share</text>
<text class="fn" x="340" y="1078" text-anchor="middle" dominant-baseline="central">_sample_governor</text>
</g>
<line x1="340" y1="1096" x2="340" y2="1118" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="1118" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1136" text-anchor="middle" dominant-baseline="central">Channel 1: XDR alerts</text>
<text class="ts" x="340" y="1155" text-anchor="middle" dominant-baseline="central">One alert per rule+file, batched</text>
<text class="fn" x="340" y="1176" text-anchor="middle" dominant-baseline="central">_upload_alert_batch</text>
</g>
<line x1="340" y1="1194" x2="340" y2="1216" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="1216" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1234" text-anchor="middle" dominant-baseline="central">Channel 2: dataset rows</text>
<text class="ts" x="340" y="1253" text-anchor="middle" dominant-baseline="central">One row per matched file, batched</text>
<text class="fn" x="340" y="1274" text-anchor="middle" dominant-baseline="central">_send_batch</text>
</g>
<line x1="340" y1="1292" x2="340" y2="1314" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="60" y="1314" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1332" text-anchor="middle" dominant-baseline="central">Terminal lifecycle row</text>
<text class="ts" x="340" y="1351" text-anchor="middle" dominant-baseline="central">completed / cancelled / failed</text>
<text class="fn" x="340" y="1372" text-anchor="middle" dominant-baseline="central">_emit_scan_row</text>
</g>
<path d="M 60 1058 L 28 1058 L 28 862 L 58 862" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M 620 1254 L 652 1254 L 652 666 L 622 666" class="arr" fill="none" marker-end="url(#arrow)"/>
<rect class="band-bg" x="40" y="1424" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1440" text-anchor="middle" dominant-baseline="central">API endpoints called</text>
<g class="node c-blue"><rect x="60" y="1472" width="560" height="158" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="1494" dominant-baseline="central">/public_api/v1/alerts/insert_parsed_alerts</text>
<text class="ts" x="606" y="1494" text-anchor="end" dominant-baseline="central">One alert per rule+file finding</text>
<text class="fn" x="74" y="1514" dominant-baseline="central">/public_api/v1/xql/lookups/add_data</text>
<text class="ts" x="606" y="1514" text-anchor="end" dominant-baseline="central">Match rows + lifecycle rows</text>
<text class="fn" x="74" y="1534" dominant-baseline="central">/public_api/v1/xql/get_datasets</text>
<text class="ts" x="606" y="1534" text-anchor="end" dominant-baseline="central">Does this host's dataset exist?</text>
<text class="fn" x="74" y="1554" dominant-baseline="central">/public_api/v1/xql/add_dataset</text>
<text class="ts" x="606" y="1554" text-anchor="end" dominant-baseline="central">Create a missing lookup dataset</text>
<text class="fn" x="74" y="1574" dominant-baseline="central">/public_api/v1/xql/lookups/remove_data/</text>
<text class="ts" x="606" y="1574" text-anchor="end" dominant-baseline="central">Delete the previous scan's rows</text>
<text class="fn" x="74" y="1594" dominant-baseline="central">/public_api/v1/xql/start_xql_query/</text>
<text class="ts" x="606" y="1594" text-anchor="end" dominant-baseline="central">Find stale scan_ids to delete</text>
<text class="fn" x="74" y="1614" dominant-baseline="central">/public_api/v1/xql/get_query_results/</text>
<text class="ts" x="606" y="1614" text-anchor="end" dominant-baseline="central">Poll that query for its rows</text>
</g>
<rect class="band-bg" x="40" y="1664" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1680" text-anchor="middle" dominant-baseline="central">Datasets touched</text>
<g class="node c-purple"><rect x="60" y="1712" width="560" height="58" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="1734" dominant-baseline="central">yara_scanner_matches_v4_&lt;host&gt;_&lt;6hex&gt;</text>
<text class="ts" x="606" y="1734" text-anchor="end" dominant-baseline="central">create+delete+write</text>
<text class="fn" x="74" y="1754" dominant-baseline="central">yara_scanner_scans_v4_&lt;host&gt;_&lt;6hex&gt;</text>
<text class="ts" x="606" y="1754" text-anchor="end" dominant-baseline="central">create+append, monthly</text>
</g>
<rect class="band-bg" x="40" y="1804" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1820" text-anchor="middle" dominant-baseline="central">Safety rails</text>
<g class="node c-amber"><rect x="60" y="1852" width="560" height="207" rx="8" stroke-width="0.5"/>
<text class="ts" x="74" y="1874" dominant-baseline="central">- Aborts if the XDR API credentials are placeholders</text>
<text class="ts" x="74" y="1895" dominant-baseline="central">- The overwrite never deletes the current scan's rows</text>
<text class="ts" x="74" y="1916" dominant-baseline="central">- No scan_id or unknown dataset name = delete nothing</text>
<text class="ts" x="74" y="1937" dominant-baseline="central">- Overwrite fails safe: logged, and the scan still runs</text>
<text class="ts" x="74" y="1958" dominant-baseline="central">- A spent flush budget stops deleting, never the scan</text>
<text class="ts" x="74" y="1979" dominant-baseline="central">- Terminal row sent inline so a drain cannot strand it</text>
<text class="ts" x="74" y="2000" dominant-baseline="central">- Cancel is cooperative, checked before each directory</text>
<text class="ts" x="74" y="2021" dominant-baseline="central">- Read-timed-out batches are not retried, to avoid dupes</text>
<text class="ts" x="74" y="2042" dominant-baseline="central">- CPU governor fails open: unreadable CPU = no throttle</text>
</g>
</svg>
