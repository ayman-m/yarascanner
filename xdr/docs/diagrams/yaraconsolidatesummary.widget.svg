<svg width="100%" viewBox="0 0 680 2232" role="img">
<title>YaraConsolidateSummary - what the script does, step by step</title>
<desc>Workflow of YaraConsolidateSummary (in the tenant (Cortex automation)): Which rules fired on which host, per scan. Each step names the function responsible; the reference blocks list every API endpoint it calls and every lookup dataset it touches.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  .band-bg { fill: var(--bg2); stroke: var(--b); }
  .band-txt { font-size: 13px; font-weight: 600; }
  .fn { font-size: 11px; font-family: var(--font-mono); opacity: 0.8; }
  .phase { font-size: 11px; font-weight: 600; fill: var(--text-secondary); }
</style>
<rect class="band-bg" x="40" y="20" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="36" text-anchor="middle" dominant-baseline="central">YaraConsolidateSummary  -  Which rules fired on which host, per scan</text>
<rect x="60" y="68" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="81" text-anchor="middle" dominant-baseline="central">runs in the tenant (Cortex automation)</text>
<g class="node c-gray"><rect x="60" y="110" width="560" height="58" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="132" dominant-baseline="central">API base</text>
<text class="ts" x="606" y="132" text-anchor="end" dominant-baseline="central">https://api-&lt;tenant&gt;.xdr.&lt;region&gt;.paloaltonetworks.com</text>
<text class="fn" x="74" y="152" dominant-baseline="central">Delivered via</text>
<text class="ts" x="606" y="152" text-anchor="end" dominant-baseline="central">POST /xsoar/automation/import (multipart file=unified yml)</text>
</g>
<rect x="60" y="174" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="187" text-anchor="middle" dominant-baseline="central">Same tenant host, HMAC-signed with the same Advanced key as the calls above</text>
<g class="node c-blue"><rect x="60" y="220" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">Read args, pin schema</text>
<text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">scan_id, retention_hours, execute</text>
<text class="fn" x="340" y="278" text-anchor="middle" dominant-baseline="central">set_schema_version</text>
</g>
<line x1="340" y1="296" x2="340" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="318" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="336" text-anchor="middle" dominant-baseline="central">Take consolidation lock</text>
<text class="ts" x="340" y="355" text-anchor="middle" dominant-baseline="central">Only when execute=true, else skip</text>
<text class="fn" x="340" y="376" text-anchor="middle" dominant-baseline="central">acquire_consolidation_lock</text>
</g>
<line x1="340" y1="394" x2="340" y2="416" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="416" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="434" text-anchor="middle" dominant-baseline="central">List and pick shards</text>
<text class="ts" x="340" y="453" text-anchor="middle" dominant-baseline="central">Includes the live overwrite dataset</text>
<text class="fn" x="340" y="474" text-anchor="middle" dominant-baseline="central">_matches_shard_for_read</text>
</g>
<line x1="340" y1="492" x2="340" y2="514" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="514" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="532" text-anchor="middle" dominant-baseline="central">Read scan lifecycle</text>
<text class="ts" x="340" y="551" text-anchor="middle" dominant-baseline="central">One comp query per scans shard</text>
<text class="fn" x="340" y="572" text-anchor="middle" dominant-baseline="central">_lifecycle_state</text>
</g>
<line x1="340" y1="590" x2="340" y2="612" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="612" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="630" text-anchor="middle" dominant-baseline="central">One XQL per host shard</text>
<text class="ts" x="340" y="649" text-anchor="middle" dominant-baseline="central">Expand rules to host+rule pairs</text>
<text class="fn" x="340" y="670" text-anchor="middle" dominant-baseline="central">summarise_shard</text>
</g>
<line x1="340" y1="688" x2="340" y2="710" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="710" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="728" text-anchor="middle" dominant-baseline="central">Merge pairs per scan</text>
<text class="ts" x="340" y="747" text-anchor="middle" dominant-baseline="central">Dedupe host+rule, keep newest ts</text>
<text class="fn" x="340" y="768" text-anchor="middle" dominant-baseline="central">_max_ms</text>
</g>
<line x1="340" y1="786" x2="340" y2="808" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="808" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="826" text-anchor="middle" dominant-baseline="central">Scan finished?</text>
<text class="ts" x="340" y="845" text-anchor="middle" dominant-baseline="central">Terminal, or silent past retention</text>
<text class="fn" x="340" y="866" text-anchor="middle" dominant-baseline="central">main</text>
</g>
<line x1="340" y1="884" x2="192" y2="914" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="884" x2="487" y2="914" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="914" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="192" y="932" text-anchor="middle" dominant-baseline="central">Terminal or aged</text>
<text class="ts" x="192" y="951" text-anchor="middle" dominant-baseline="central">summarise this scan</text>
<text class="fn" x="192" y="972" text-anchor="middle" dominant-baseline="central">summary_target_name</text>
</g>
<g class="node c-green"><rect x="355" y="914" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="487" y="932" text-anchor="middle" dominant-baseline="central">Still running</text>
<text class="ts" x="487" y="951" text-anchor="middle" dominant-baseline="central">skipped, left alone</text>
<text class="fn" x="487" y="972" text-anchor="middle" dominant-baseline="central">_lifecycle_state</text>
</g>
<line x1="192" y1="990" x2="340" y2="1020" class="arr" marker-end="url(#arrow)"/>
<line x1="487" y1="990" x2="340" y2="1020" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="1020" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1038" text-anchor="middle" dominant-baseline="central">Dry run or execute?</text>
<text class="ts" x="340" y="1057" text-anchor="middle" dominant-baseline="central">execute=false is the default</text>
<text class="fn" x="340" y="1078" text-anchor="middle" dominant-baseline="central">argToBoolean</text>
</g>
<line x1="340" y1="1096" x2="192" y2="1126" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="1096" x2="487" y2="1126" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="1126" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="192" y="1144" text-anchor="middle" dominant-baseline="central">Dry run</text>
<text class="ts" x="192" y="1163" text-anchor="middle" dominant-baseline="central">reports would-write</text>
<text class="fn" x="192" y="1184" text-anchor="middle" dominant-baseline="central">return_results</text>
</g>
<g class="node c-green"><rect x="355" y="1126" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="487" y="1144" text-anchor="middle" dominant-baseline="central">execute=true</text>
<text class="ts" x="487" y="1163" text-anchor="middle" dominant-baseline="central">creates the target</text>
<text class="fn" x="487" y="1184" text-anchor="middle" dominant-baseline="central">create_lookup_dataset</text>
</g>
<line x1="192" y1="1202" x2="340" y2="1232" class="arr" marker-end="url(#arrow)"/>
<line x1="487" y1="1202" x2="340" y2="1232" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="1232" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1250" text-anchor="middle" dominant-baseline="central">Check existing target</text>
<text class="ts" x="340" y="1269" text-anchor="middle" dominant-baseline="central">Same count skips, other counts fail</text>
<text class="fn" x="340" y="1290" text-anchor="middle" dominant-baseline="central">_count</text>
</g>
<line x1="340" y1="1308" x2="340" y2="1330" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="1330" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1348" text-anchor="middle" dominant-baseline="central">Write 4-column summary</text>
<text class="ts" x="340" y="1367" text-anchor="middle" dominant-baseline="central">scan_id, hostname, rule, ts</text>
<text class="fn" x="340" y="1388" text-anchor="middle" dominant-baseline="central">add_lookup_data</text>
</g>
<line x1="340" y1="1406" x2="340" y2="1428" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="60" y="1428" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1446" text-anchor="middle" dominant-baseline="central">Release lock and report</text>
<text class="ts" x="340" y="1465" text-anchor="middle" dominant-baseline="central">Nothing deleted; shards untouched</text>
<text class="fn" x="340" y="1486" text-anchor="middle" dominant-baseline="central">release_consolidation_lock</text>
</g>
<path d="M 60 748 L 28 748 L 28 650 L 58 650" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M 620 1368 L 652 1368 L 652 846 L 622 846" class="arr" fill="none" marker-end="url(#arrow)"/>
<rect class="band-bg" x="40" y="1538" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1554" text-anchor="middle" dominant-baseline="central">API endpoints called</text>
<g class="node c-blue"><rect x="60" y="1586" width="560" height="158" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="1608" dominant-baseline="central">/public_api/v1/xql/get_datasets/</text>
<text class="ts" x="606" y="1608" text-anchor="end" dominant-baseline="central">list the lookup datasets</text>
<text class="fn" x="74" y="1628" dominant-baseline="central">/public_api/v1/xql/start_xql_query/</text>
<text class="ts" x="606" y="1628" text-anchor="end" dominant-baseline="central">start every read query</text>
<text class="fn" x="74" y="1648" dominant-baseline="central">/public_api/v1/xql/get_query_results/</text>
<text class="ts" x="606" y="1648" text-anchor="end" dominant-baseline="central">poll until the query returns</text>
<text class="fn" x="74" y="1668" dominant-baseline="central">/public_api/v1/xql/get_query_results_stream/</text>
<text class="ts" x="606" y="1668" text-anchor="end" dominant-baseline="central">pull large result sets</text>
<text class="fn" x="74" y="1688" dominant-baseline="central">/public_api/v1/xql/add_dataset/</text>
<text class="ts" x="606" y="1688" text-anchor="end" dominant-baseline="central">create lock and summary targets</text>
<text class="fn" x="74" y="1708" dominant-baseline="central">/public_api/v1/xql/lookups/add_data/</text>
<text class="ts" x="606" y="1708" text-anchor="end" dominant-baseline="central">write the 4-column summary rows</text>
<text class="fn" x="74" y="1728" dominant-baseline="central">/public_api/v2/xql/delete_dataset/</text>
<text class="ts" x="606" y="1728" text-anchor="end" dominant-baseline="central">release the lock dataset only</text>
</g>
<rect class="band-bg" x="40" y="1778" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1794" text-anchor="middle" dominant-baseline="central">Datasets touched</text>
<g class="node c-purple"><rect x="60" y="1826" width="560" height="98" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="1848" dominant-baseline="central">yara_scanner_matches_v&lt;N&gt;_&lt;host&gt;</text>
<text class="ts" x="606" y="1848" text-anchor="end" dominant-baseline="central">read only (live + dated)</text>
<text class="fn" x="74" y="1868" dominant-baseline="central">yara_scanner_scans_v&lt;N&gt;_&lt;host&gt;_YYYYMM</text>
<text class="ts" x="606" y="1868" text-anchor="end" dominant-baseline="central">read only (lifecycle)</text>
<text class="fn" x="74" y="1888" dominant-baseline="central">yara_scanner_summary_v&lt;N&gt;_scan_&lt;slug&gt;</text>
<text class="ts" x="606" y="1888" text-anchor="end" dominant-baseline="central">create + write</text>
<text class="fn" x="74" y="1908" dominant-baseline="central">yara_scanner_consolidation_lock</text>
<text class="ts" x="606" y="1908" text-anchor="end" dominant-baseline="central">create, write, delete</text>
</g>
<rect class="band-bg" x="40" y="1958" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1974" text-anchor="middle" dominant-baseline="central">Safety rails</text>
<g class="node c-amber"><rect x="60" y="2006" width="560" height="186" rx="8" stroke-width="0.5"/>
<text class="ts" x="74" y="2028" dominant-baseline="central">- Dry run by default - execute=true is required to write</text>
<text class="ts" x="74" y="2049" dominant-baseline="central">- Deletes no shard and no row - only the lock dataset</text>
<text class="ts" x="74" y="2070" dominant-baseline="central">- Writes only while holding the consolidation lock</text>
<text class="ts" x="74" y="2091" dominant-baseline="central">- A scan still in progress is skipped, not summarised</text>
<text class="ts" x="74" y="2112" dominant-baseline="central">- Target with a different row count is refused, not appended</text>
<text class="ts" x="74" y="2133" dominant-baseline="central">- Equal row count means verified - not rewritten</text>
<text class="ts" x="74" y="2154" dominant-baseline="central">- Unreadable lifecycle means unknown; those scans stay put</text>
<text class="ts" x="74" y="2175" dominant-baseline="central">- Non-matches dataset refused before any XQL interpolation</text>
</g>
</svg>
