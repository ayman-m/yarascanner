<svg width="100%" viewBox="0 0 680 2322" role="img">
<title>YaraConsolidateStatus - what the script does, step by step</title>
<desc>Workflow of YaraConsolidateStatus (in the tenant, as an XDR automation): Read-only readiness check for the per-scan merge. Each step names the function responsible; the reference blocks list every API endpoint it calls and every lookup dataset it touches.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  .band-bg { fill: var(--bg2); stroke: var(--b); }
  .band-txt { font-size: 13px; font-weight: 600; }
  .fn { font-size: 11px; font-family: var(--font-mono); opacity: 0.8; }
  .phase { font-size: 11px; font-weight: 600; fill: var(--text-secondary); }
</style>
<rect class="band-bg" x="40" y="20" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="36" text-anchor="middle" dominant-baseline="central">YaraConsolidateStatus  -  Read-only readiness check for the per-scan merge</text>
<rect x="60" y="68" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="81" text-anchor="middle" dominant-baseline="central">runs in the tenant, as an XDR automation</text>
<g class="node c-gray"><rect x="60" y="110" width="560" height="58" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="132" dominant-baseline="central">API base</text>
<text class="ts" x="606" y="132" text-anchor="end" dominant-baseline="central">https://api-&lt;tenant&gt;.xdr.&lt;region&gt;.paloaltonetworks.com</text>
<text class="fn" x="74" y="152" dominant-baseline="central">Delivered via</text>
<text class="ts" x="606" y="152" text-anchor="end" dominant-baseline="central">POST /xsoar/automation/import (multipart file=unified yml)</text>
</g>
<rect x="60" y="174" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="187" text-anchor="middle" dominant-baseline="central">Same tenant host, HMAC-signed with the same Advanced key as the calls above</text>
<g class="node c-blue"><rect x="60" y="220" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">Read script arguments</text>
<text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">scan_id, quiet, ceiling, abandoned</text>
<text class="fn" x="340" y="278" text-anchor="middle" dominant-baseline="central">main</text>
</g>
<line x1="340" y1="296" x2="340" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="318" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="336" text-anchor="middle" dominant-baseline="central">Build signed API client</text>
<text class="ts" x="340" y="355" text-anchor="middle" dominant-baseline="central">HMAC headers; halts if URL unset</text>
<text class="fn" x="340" y="376" text-anchor="middle" dominant-baseline="central">CoreApiClient.__init__</text>
</g>
<line x1="340" y1="394" x2="340" y2="416" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="416" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="434" text-anchor="middle" dominant-baseline="central">Fan out kinds x versions</text>
<text class="ts" x="340" y="453" text-anchor="middle" dominant-baseline="central">matches+scans x schema v2,v3,v4</text>
<text class="fn" x="340" y="474" text-anchor="middle" dominant-baseline="central">check_consolidation_status</text>
</g>
<line x1="340" y1="492" x2="340" y2="514" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="514" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="532" text-anchor="middle" dominant-baseline="central">List yara lookup datasets</text>
<text class="ts" x="340" y="551" text-anchor="middle" dominant-baseline="central">keep shards matching kind+version</text>
<text class="fn" x="340" y="572" text-anchor="middle" dominant-baseline="central">_list_yara_datasets</text>
</g>
<line x1="340" y1="590" x2="340" y2="612" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="612" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="630" text-anchor="middle" dominant-baseline="central">Read scan lifecycle rows</text>
<text class="ts" x="340" y="649" text-anchor="middle" dominant-baseline="central">latest status per scan_id + host</text>
<text class="fn" x="340" y="670" text-anchor="middle" dominant-baseline="central">build_terminal_map</text>
</g>
<line x1="340" y1="688" x2="340" y2="710" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="710" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="728" text-anchor="middle" dominant-baseline="central">Count rows per scan</text>
<text class="ts" x="340" y="747" text-anchor="middle" dominant-baseline="central">count + newest stamp, skew-proofed</text>
<text class="fn" x="340" y="768" text-anchor="middle" dominant-baseline="central">_scan_stats</text>
</g>
<line x1="340" y1="786" x2="340" y2="808" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="808" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="826" text-anchor="middle" dominant-baseline="central">Apply merge gates</text>
<text class="ts" x="340" y="845" text-anchor="middle" dominant-baseline="central">terminal? quiet? abandoned?</text>
<text class="fn" x="340" y="866" text-anchor="middle" dominant-baseline="central">_gate_scan</text>
</g>
<line x1="340" y1="884" x2="340" y2="906" class="arr" marker-end="url(#arrow)"/>
<rect x="60" y="906" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="919" text-anchor="middle" dominant-baseline="central">one of these four outcomes</text>
<g class="node c-red"><rect x="60" y="946" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="192" y="964" text-anchor="middle" dominant-baseline="central">Host not terminal</text>
<text class="ts" x="192" y="983" text-anchor="middle" dominant-baseline="central">defer -&gt; pending</text>
<text class="fn" x="192" y="1004" text-anchor="middle" dominant-baseline="central">shard_is_terminal</text>
</g>
<g class="node c-green"><rect x="355" y="946" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="487" y="964" text-anchor="middle" dominant-baseline="central">In quiet period</text>
<text class="ts" x="487" y="983" text-anchor="middle" dominant-baseline="central">newest row too fresh</text>
<text class="fn" x="487" y="1004" text-anchor="middle" dominant-baseline="central">newest_row_age_ok</text>
</g>
<g class="node c-blue"><rect x="60" y="1036" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="192" y="1054" text-anchor="middle" dominant-baseline="central">Abandoned scan</text>
<text class="ts" x="192" y="1073" text-anchor="middle" dominant-baseline="central">silent 24h -&gt; merge</text>
<text class="fn" x="192" y="1094" text-anchor="middle" dominant-baseline="central">_gate_scan</text>
</g>
<g class="node c-purple"><rect x="355" y="1036" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="487" y="1054" text-anchor="middle" dominant-baseline="central">Clear to merge</text>
<text class="ts" x="487" y="1073" text-anchor="middle" dominant-baseline="central">counted as eligible</text>
<text class="fn" x="487" y="1094" text-anchor="middle" dominant-baseline="central">run_consolidation</text>
</g>
<line x1="192" y1="1112" x2="340" y2="1142" class="arr" marker-end="url(#arrow)"/>
<line x1="487" y1="1112" x2="340" y2="1142" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="1142" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1160" text-anchor="middle" dominant-baseline="central">Check row ceiling</text>
<text class="ts" x="340" y="1179" text-anchor="middle" dominant-baseline="central">over ceiling -&gt; blocked, not merged</text>
<text class="fn" x="340" y="1200" text-anchor="middle" dominant-baseline="central">plan_consolidation</text>
</g>
<line x1="340" y1="1218" x2="340" y2="1240" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="1240" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1258" text-anchor="middle" dominant-baseline="central">Record would-consolidate plan</text>
<text class="ts" x="340" y="1277" text-anchor="middle" dominant-baseline="central">dry_run: names target, writes none</text>
<text class="fn" x="340" y="1298" text-anchor="middle" dominant-baseline="central">run_consolidation</text>
</g>
<line x1="340" y1="1316" x2="340" y2="1338" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="1338" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1356" text-anchor="middle" dominant-baseline="central">Sort eligible/pending/blocked</text>
<text class="ts" x="340" y="1375" text-anchor="middle" dominant-baseline="central">dry_run=eligible; defers=pending</text>
<text class="fn" x="340" y="1396" text-anchor="middle" dominant-baseline="central">check_consolidation_status</text>
</g>
<line x1="340" y1="1414" x2="340" y2="1436" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="60" y="1436" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1454" text-anchor="middle" dominant-baseline="central">Clear context, return status</text>
<text class="ts" x="340" y="1473" text-anchor="middle" dominant-baseline="central">eligible_scan_ids for Apply</text>
<text class="fn" x="340" y="1494" text-anchor="middle" dominant-baseline="central">return_results</text>
</g>
<path d="M 60 1278 L 28 1278 L 28 846 L 58 846" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M 620 1376 L 652 1376 L 652 552 L 622 552" class="arr" fill="none" marker-end="url(#arrow)"/>
<rect class="band-bg" x="40" y="1546" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1562" text-anchor="middle" dominant-baseline="central">API endpoints called</text>
<g class="node c-blue"><rect x="60" y="1594" width="560" height="98" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="1616" dominant-baseline="central">/public_api/v1/xql/get_datasets/</text>
<text class="ts" x="606" y="1616" text-anchor="end" dominant-baseline="central">list tenant lookup datasets</text>
<text class="fn" x="74" y="1636" dominant-baseline="central">/public_api/v1/xql/start_xql_query/</text>
<text class="ts" x="606" y="1636" text-anchor="end" dominant-baseline="central">start an XQL query</text>
<text class="fn" x="74" y="1656" dominant-baseline="central">/public_api/v1/xql/get_query_results/</text>
<text class="ts" x="606" y="1656" text-anchor="end" dominant-baseline="central">poll for XQL results</text>
<text class="fn" x="74" y="1676" dominant-baseline="central">/public_api/v1/xql/get_query_results_stream/</text>
<text class="ts" x="606" y="1676" text-anchor="end" dominant-baseline="central">read large XQL result sets</text>
</g>
<rect class="band-bg" x="40" y="1726" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1742" text-anchor="middle" dominant-baseline="central">Datasets touched</text>
<g class="node c-purple"><rect x="60" y="1774" width="560" height="98" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="1796" dominant-baseline="central">yara_scanner_matches_v&lt;N&gt;_&lt;host&gt;_&lt;mo&gt;</text>
<text class="ts" x="606" y="1796" text-anchor="end" dominant-baseline="central">read (counts+timestamps)</text>
<text class="fn" x="74" y="1816" dominant-baseline="central">yara_scanner_scans_v&lt;N&gt;_&lt;host&gt;_&lt;mo&gt;</text>
<text class="ts" x="606" y="1816" text-anchor="end" dominant-baseline="central">read (lifecycle rows)</text>
<text class="fn" x="74" y="1836" dominant-baseline="central">yara_scanner_&lt;kind&gt;_v&lt;N&gt;_scan_&lt;slug&gt;</text>
<text class="ts" x="606" y="1836" text-anchor="end" dominant-baseline="central">named only, never read</text>
<text class="fn" x="74" y="1856" dominant-baseline="central">yara_scanner_consolidation_lock</text>
<text class="ts" x="606" y="1856" text-anchor="end" dominant-baseline="central">not taken (read-only)</text>
</g>
<rect class="band-bg" x="40" y="1906" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1922" text-anchor="middle" dominant-baseline="central">Safety rails</text>
<g class="node c-amber"><rect x="60" y="1954" width="560" height="165" rx="8" stroke-width="0.5"/>
<text class="ts" x="74" y="1976" dominant-baseline="central">- Writes nothing, deletes nothing: dry_run=True is forced</text>
<text class="ts" x="74" y="1997" dominant-baseline="central">- Refuses to run until the API URL and keys are filled in</text>
<text class="ts" x="74" y="2018" dominant-baseline="central">- A scan still running defers as pending, never eligible</text>
<text class="ts" x="74" y="2039" dominant-baseline="central">- Quiet period: newest row must be &gt;900s old</text>
<text class="ts" x="74" y="2060" dominant-baseline="central">- Over the 2,000,000-row ceiling: reported, never merged</text>
<text class="ts" x="74" y="2081" dominant-baseline="central">- Endpoint clock skew corrected via _insert_time</text>
<text class="ts" x="74" y="2102" dominant-baseline="central">- Context cleared first so stale scan_ids can't accumulate</text>
</g>
<rect class="band-bg" x="40" y="2153" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="2169" text-anchor="middle" dominant-baseline="central">On a tenant with no YARA datasets yet</text>
<g class="node c-green"><rect x="60" y="2201" width="560" height="81" rx="8" stroke-width="0.5"/>
<text class="ts" x="74" y="2223" dominant-baseline="central">- Reports "0 scan(s) eligible to consolidate"</text>
<text class="ts" x="74" y="2244" dominant-baseline="central">- any_in_progress=false; eligible/pending/blocked all empty</text>
<text class="ts" x="74" y="2265" dominant-baseline="central">- Nothing to consolidate is a normal state, not a fault</text>
</g>
</svg>
