<svg width="100%" viewBox="0 0 680 2690" role="img">
<title>YaraWipeAllDatasets - what the script does, step by step</title>
<desc>Workflow of YaraWipeAllDatasets (in the tenant (Playground / War Room)): Wipe every yara_scanner_* dataset. Each step names the function responsible; the reference blocks list every API endpoint it calls and every lookup dataset it touches.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  .band-bg { fill: var(--bg2); stroke: var(--b); }
  .band-txt { font-size: 13px; font-weight: 600; }
  .fn { font-size: 11px; font-family: var(--font-mono); opacity: 0.8; }
  .phase { font-size: 11px; font-weight: 600; fill: var(--text-secondary); }
</style>
<rect class="band-bg" x="40" y="20" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="36" text-anchor="middle" dominant-baseline="central">YaraWipeAllDatasets  -  Wipe every yara_scanner_* dataset</text>
<rect x="60" y="68" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="81" text-anchor="middle" dominant-baseline="central">runs in the tenant (Playground / War Room)  -  DESTRUCTIVE</text>
<g class="node c-gray"><rect x="60" y="110" width="560" height="58" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="132" dominant-baseline="central">API base</text>
<text class="ts" x="606" y="132" text-anchor="end" dominant-baseline="central">https://api-&lt;tenant&gt;.xdr.&lt;region&gt;.paloaltonetworks.com</text>
<text class="fn" x="74" y="152" dominant-baseline="central">Delivered via</text>
<text class="ts" x="606" y="152" text-anchor="end" dominant-baseline="central">POST /xsoar/automation/import (multipart file=unified yml)</text>
</g>
<rect x="60" y="174" width="560" height="26" rx="4" fill="var(--bg2)" stroke="var(--b)" stroke-width="0.5"/>
<text class="phase" x="340" y="187" text-anchor="middle" dominant-baseline="central">Same tenant host, HMAC-signed with the same Advanced key as the calls above</text>
<g class="node c-blue"><rect x="60" y="220" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">Read script arguments</text>
<text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">execute, confirm, max_deletes</text>
<text class="fn" x="340" y="278" text-anchor="middle" dominant-baseline="central">demisto.args</text>
</g>
<line x1="340" y1="296" x2="340" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="318" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="336" text-anchor="middle" dominant-baseline="central">Confirm-phrase gate</text>
<text class="ts" x="340" y="355" text-anchor="middle" dominant-baseline="central">execute=true needs exact phrase</text>
<text class="fn" x="340" y="376" text-anchor="middle" dominant-baseline="central">main</text>
</g>
<line x1="340" y1="394" x2="192" y2="424" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="394" x2="487" y2="424" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="424" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="192" y="442" text-anchor="middle" dominant-baseline="central">Phrase mismatch</text>
<text class="ts" x="192" y="461" text-anchor="middle" dominant-baseline="central">nothing deleted</text>
<text class="fn" x="192" y="482" text-anchor="middle" dominant-baseline="central">return_error</text>
</g>
<g class="node c-green"><rect x="355" y="424" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="487" y="442" text-anchor="middle" dominant-baseline="central">Phrase matches</text>
<text class="ts" x="487" y="461" text-anchor="middle" dominant-baseline="central">proceed to wipe</text>
<text class="fn" x="487" y="482" text-anchor="middle" dominant-baseline="central">wipe_all</text>
</g>
<line x1="192" y1="500" x2="340" y2="530" class="arr" marker-end="url(#arrow)"/>
<line x1="487" y1="500" x2="340" y2="530" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="530" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="548" text-anchor="middle" dominant-baseline="central">Build API client</text>
<text class="ts" x="340" y="567" text-anchor="middle" dominant-baseline="central">fails if credentials not filled in</text>
<text class="fn" x="340" y="588" text-anchor="middle" dominant-baseline="central">CoreApiClient.__init__</text>
</g>
<line x1="340" y1="606" x2="340" y2="628" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="628" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="646" text-anchor="middle" dominant-baseline="central">List yara_scanner_* datasets</text>
<text class="ts" x="340" y="665" text-anchor="middle" dominant-baseline="central">bare prefix, LOOKUP type only</text>
<text class="fn" x="340" y="686" text-anchor="middle" dominant-baseline="central">list_all_yara_datasets</text>
</g>
<line x1="340" y1="704" x2="340" y2="726" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="726" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="744" text-anchor="middle" dominant-baseline="central">Subtract PRESERVED_DATASETS</text>
<text class="ts" x="340" y="763" text-anchor="middle" dominant-baseline="central">keeps 3 run-logs + the lock</text>
<text class="fn" x="340" y="784" text-anchor="middle" dominant-baseline="central">wipe_all</text>
</g>
<line x1="340" y1="802" x2="340" y2="824" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="824" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="842" text-anchor="middle" dominant-baseline="central">Dry run or execute?</text>
<text class="ts" x="340" y="861" text-anchor="middle" dominant-baseline="central">execute=false is the default</text>
<text class="fn" x="340" y="882" text-anchor="middle" dominant-baseline="central">wipe_all</text>
</g>
<line x1="340" y1="900" x2="192" y2="930" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="900" x2="487" y2="930" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="930" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="192" y="948" text-anchor="middle" dominant-baseline="central">Dry run (default)</text>
<text class="ts" x="192" y="967" text-anchor="middle" dominant-baseline="central">warns if &gt;1 pass needed</text>
<text class="fn" x="192" y="988" text-anchor="middle" dominant-baseline="central">record_wipe_run</text>
</g>
<g class="node c-green"><rect x="355" y="930" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="487" y="948" text-anchor="middle" dominant-baseline="central">execute=true</text>
<text class="ts" x="487" y="967" text-anchor="middle" dominant-baseline="central">take lock, bound, delete</text>
<text class="fn" x="487" y="988" text-anchor="middle" dominant-baseline="central">_delete_all</text>
</g>
<line x1="192" y1="1006" x2="340" y2="1036" class="arr" marker-end="url(#arrow)"/>
<line x1="487" y1="1006" x2="340" y2="1036" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="1036" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1054" text-anchor="middle" dominant-baseline="central">Take consolidation lock</text>
<text class="ts" x="340" y="1073" text-anchor="middle" dominant-baseline="central">skips if another run holds it</text>
<text class="fn" x="340" y="1094" text-anchor="middle" dominant-baseline="central">acquire_consolidation_lock</text>
</g>
<line x1="340" y1="1112" x2="340" y2="1134" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="60" y="1134" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1152" text-anchor="middle" dominant-baseline="central">More than max_deletes?</text>
<text class="ts" x="340" y="1171" text-anchor="middle" dominant-baseline="central">default cap: 100 per pass</text>
<text class="fn" x="340" y="1192" text-anchor="middle" dominant-baseline="central">wipe_all</text>
</g>
<line x1="340" y1="1210" x2="192" y2="1240" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="1210" x2="487" y2="1240" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="1240" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="192" y="1258" text-anchor="middle" dominant-baseline="central">Yes: over the cap</text>
<text class="ts" x="192" y="1277" text-anchor="middle" dominant-baseline="central">bound to 100, stopped_early</text>
<text class="fn" x="192" y="1298" text-anchor="middle" dominant-baseline="central">to_delete[:max_deletes]</text>
</g>
<g class="node c-green"><rect x="355" y="1240" width="265" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="487" y="1258" text-anchor="middle" dominant-baseline="central">No: fits in one pass</text>
<text class="ts" x="487" y="1277" text-anchor="middle" dominant-baseline="central">attempt the full list</text>
<text class="fn" x="487" y="1298" text-anchor="middle" dominant-baseline="central">this_pass = to_delete</text>
</g>
<line x1="192" y1="1316" x2="340" y2="1346" class="arr" marker-end="url(#arrow)"/>
<line x1="487" y1="1316" x2="340" y2="1346" class="arr" marker-end="url(#arrow)"/>
<g class="node c-red"><rect x="60" y="1346" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1364" text-anchor="middle" dominant-baseline="central">Delete this pass's candidates</text>
<text class="ts" x="340" y="1383" text-anchor="middle" dominant-baseline="central">12 parallel force deletes</text>
<text class="fn" x="340" y="1404" text-anchor="middle" dominant-baseline="central">_delete_all</text>
</g>
<line x1="340" y1="1422" x2="340" y2="1444" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="1444" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1462" text-anchor="middle" dominant-baseline="central">Release the lock</text>
<text class="ts" x="340" y="1481" text-anchor="middle" dominant-baseline="central">in a finally block, always runs</text>
<text class="fn" x="340" y="1502" text-anchor="middle" dominant-baseline="central">release_consolidation_lock</text>
</g>
<line x1="340" y1="1520" x2="340" y2="1542" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="1542" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1560" text-anchor="middle" dominant-baseline="central">Record the run</text>
<text class="ts" x="340" y="1579" text-anchor="middle" dominant-baseline="central">incl. stopped_early, dry or executed</text>
<text class="fn" x="340" y="1600" text-anchor="middle" dominant-baseline="central">record_wipe_run</text>
</g>
<line x1="340" y1="1618" x2="340" y2="1640" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="60" y="1640" width="560" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1658" text-anchor="middle" dominant-baseline="central">Return the report</text>
<text class="ts" x="340" y="1677" text-anchor="middle" dominant-baseline="central">states exactly how many remain</text>
<text class="fn" x="340" y="1698" text-anchor="middle" dominant-baseline="central">return_results</text>
</g>
<rect class="band-bg" x="40" y="1750" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="1766" text-anchor="middle" dominant-baseline="central">API endpoints called</text>
<g class="node c-blue"><rect x="60" y="1798" width="560" height="158" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="1820" dominant-baseline="central">/public_api/v1/xql/get_datasets/</text>
<text class="ts" x="606" y="1820" text-anchor="end" dominant-baseline="central">list every dataset on the tenant</text>
<text class="fn" x="74" y="1840" dominant-baseline="central">/public_api/v2/xql/delete_dataset/</text>
<text class="ts" x="606" y="1840" text-anchor="end" dominant-baseline="central">delete a dataset, force=true</text>
<text class="fn" x="74" y="1860" dominant-baseline="central">/public_api/v1/xql/add_dataset/</text>
<text class="ts" x="606" y="1860" text-anchor="end" dominant-baseline="central">create lock + wipe-log datasets</text>
<text class="fn" x="74" y="1880" dominant-baseline="central">/public_api/v1/xql/lookups/add_data/</text>
<text class="ts" x="606" y="1880" text-anchor="end" dominant-baseline="central">write lock row and audit row</text>
<text class="fn" x="74" y="1900" dominant-baseline="central">/public_api/v1/xql/start_xql_query/</text>
<text class="ts" x="606" y="1900" text-anchor="end" dominant-baseline="central">start lock-age query</text>
<text class="fn" x="74" y="1920" dominant-baseline="central">/public_api/v1/xql/get_query_results/</text>
<text class="ts" x="606" y="1920" text-anchor="end" dominant-baseline="central">poll lock-age query results</text>
<text class="fn" x="74" y="1940" dominant-baseline="central">/public_api/v1/xql/get_query_results_stream/</text>
<text class="ts" x="606" y="1940" text-anchor="end" dominant-baseline="central">stream large result sets</text>
</g>
<rect class="band-bg" x="40" y="1990" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="2006" text-anchor="middle" dominant-baseline="central">Datasets touched</text>
<g class="node c-purple"><rect x="60" y="2038" width="560" height="118" rx="8" stroke-width="0.5"/>
<text class="fn" x="74" y="2060" dominant-baseline="central">yara_scanner_* (all LOOKUP datasets)</text>
<text class="ts" x="606" y="2060" text-anchor="end" dominant-baseline="central">read+delete</text>
<text class="fn" x="74" y="2080" dominant-baseline="central">yara_scanner_consolidation_lock</text>
<text class="ts" x="606" y="2080" text-anchor="end" dominant-baseline="central">create+write+delete</text>
<text class="fn" x="74" y="2100" dominant-baseline="central">yara_scanner_wipe_runs</text>
<text class="ts" x="606" y="2100" text-anchor="end" dominant-baseline="central">create+write</text>
<text class="fn" x="74" y="2120" dominant-baseline="central">yara_scanner_consolidation_runs</text>
<text class="ts" x="606" y="2120" text-anchor="end" dominant-baseline="central">preserved, not deleted</text>
<text class="fn" x="74" y="2140" dominant-baseline="central">yara_scanner_cleanup_runs</text>
<text class="ts" x="606" y="2140" text-anchor="end" dominant-baseline="central">preserved, not deleted</text>
</g>
<rect class="band-bg" x="40" y="2190" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="2206" text-anchor="middle" dominant-baseline="central">Safety rails</text>
<g class="node c-amber"><rect x="60" y="2238" width="560" height="228" rx="8" stroke-width="0.5"/>
<text class="ts" x="74" y="2260" dominant-baseline="central">- Dry run by default: execute=false only reports</text>
<text class="ts" x="74" y="2281" dominant-baseline="central">- execute=true also requires confirm: DELETE ALL YARA DATASETS</text>
<text class="ts" x="74" y="2302" dominant-baseline="central">- Wrong confirm phrase deletes nothing, no matter what</text>
<text class="ts" x="74" y="2323" dominant-baseline="central">- PRESERVED_DATASETS: 3 run-logs + the lock never deleted</text>
<text class="ts" x="74" y="2344" dominant-baseline="central">- Consolidation lock: skips if another run holds it</text>
<text class="ts" x="74" y="2365" dominant-baseline="central">- max_deletes caps a pass at 100 - stays inside the ~900s task timeout</text>
<text class="ts" x="74" y="2386" dominant-baseline="central">- Dry run warns up front how many execute passes will be needed</text>
<text class="ts" x="74" y="2407" dominant-baseline="central">- A capped pass states exactly how many candidates remain</text>
<text class="ts" x="74" y="2428" dominant-baseline="central">- Aborts at startup if API URL is still replace_with...</text>
<text class="ts" x="74" y="2449" dominant-baseline="central">- Every run, dry or executed, is logged to wipe_runs</text>
</g>
<rect class="band-bg" x="40" y="2500" width="600" height="32" rx="6" stroke-width="0.5"/>
<text class="th band-txt" x="340" y="2516" text-anchor="middle" dominant-baseline="central">On a tenant with no YARA datasets yet</text>
<g class="node c-green"><rect x="60" y="2548" width="560" height="102" rx="8" stroke-width="0.5"/>
<text class="ts" x="74" y="2570" dominant-baseline="central">- Only the pack's own run-logs remain, and they are preserved</text>
<text class="ts" x="74" y="2591" dominant-baseline="central">- Dry run: 0 of N would be deleted, N preserved</text>
<text class="ts" x="74" y="2612" dominant-baseline="central">- execute=true without the exact phrase is refused, deletes nothing</text>
<text class="ts" x="74" y="2633" dominant-baseline="central">- Correct phrase: EXECUTED - 0 deleted, run-logs still preserved</text>
</g>
</svg>
