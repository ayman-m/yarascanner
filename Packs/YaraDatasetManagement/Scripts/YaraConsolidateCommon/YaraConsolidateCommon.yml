args: []
comment: >-
  Shared library for this pack — NEVER invoked directly, and it takes no arguments and
  returns no outputs. YaraConsolidateStatus, YaraConsolidateApply, YaraReport and
  YaraCleanup all do "from YaraConsolidateCommon import ...", which XSOAR resolves against
  an automation of this name on the server. It must therefore exist as a content item in its
  own right: a directory holding only a .py is not a content item, is not created by
  demisto-sdk upload or by a pack-zip install, and every other automation in the pack then
  fails at import with "No module named YaraConsolidateCommon" before reading a single
  argument. It carries a verbatim port of xdr_consolidate.py's core consolidation logic and
  xdr_data_management.py's retention logic (both held to their originals by drift-gate unit
  tests in tests/), plus CoreApiClient, a directly-signed HTTPS client for this tenant's own
  public API. Edit the three DEFAULT_XDR_* placeholder constants before uploading.
commonfields:
  id: YaraConsolidateCommon
  version: -1
enabled: true
name: YaraConsolidateCommon
outputs: []
script: '-'
system: false
tags: []
timeout: 900
type: python
subtype: python3
dockerimage: demisto/python3:3.11.10.116949
fromversion: 6.5.0
marketplaces:
- xsoar
- marketplacev2
