inputs:
- key: scan_id
  value:
    simple: ''
  required: false
  description: Restrict this run to these scan_id(s) (comma-separated). Leave empty for all finished scans across the tenant.
  playbookInputQuery: null
- key: poll_interval_minutes
  value:
    simple: '30'
  required: false
  description: Minutes between rechecks while waiting on in-progress scans.
  playbookInputQuery: null
- key: poll_timeout_minutes
  value:
    simple: '240'
  required: false
  description: Total minutes to wait for in-progress scans before giving up on this cycle and letting the next scheduled run pick it up. This is THIS RUN's patience budget, separate from CONFIG_CONSOLIDATE_OBSOLETE_AFTER (days-scale, in the script) which governs when a truly-stuck scan is merged anyway to preserve its findings.
  playbookInputQuery: null
- key: row_ceiling
  value:
    simple: ''
  required: false
  description: Override the script's default per-scan row ceiling (2,000,000) above which a scan is refused rather than half-built. Leave empty to use the script default. Raise this for a tenant whose scans legitimately produce more matches than the default ceiling allows, instead of resorting to manual ad-hoc invocation.
  playbookInputQuery: null
- key: abandoned_after_hours
  value:
    simple: ''
  required: false
  description: Override the script's default hours (24h) a non-terminal scan must be silent before it's treated as abandoned and consolidated anyway to preserve its partial findings. Leave empty to use the script default.
  playbookInputQuery: null
outputs:
- contextPath: Yara.ConsolidateStatus.eligible_count
  description: Number of scans found eligible on the last status check.
  type: Number
- contextPath: Yara.ConsolidateApply.consolidated_count
  description: Number of scans actually merged this run.
  type: Number
- contextPath: Yara.ConsolidateApply.failed_count
  description: Number of scans that failed to merge and need attention.
  type: Number
- contextPath: Yara.ConsolidateApply.failed_reasons
  description: Map of failed scan_id to the specific reason it failed (e.g. row_ceiling_exceeded, count_mismatch).
  type: Unknown
